<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FCUI-Bibliotheken prüfen</title>
</head>
<body>
  <main>
    <h1>FCUI-Bibliotheken prüfen</h1>
    <p id="status" role="status">Prüfung wird geladen …</p>
    <p>Diese Prüfung verändert keine CMS-Daten und benötigt keine FHEM-Befehle.</p>
    <div id="probe"></div>
  </main>
  <script nomodule>
    document.getElementById('status').textContent =
      'Fehler: Dieser Browser unterstützt die benötigten JavaScript-Module nicht.';
  </script>
  <script type="module">
    const status = document.getElementById('status');
    const cacheKey = String(Date.now());
    const url = (path) => {
      const result = new URL(path, location.href);
      result.searchParams.set('v', cacheKey);
      return result.href;
    };

    function loadStylesheet() {
      return new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = url('../css/fcui-gridstack.css');
        const timer = setTimeout(() => reject(new Error('Gridstack-CSS antwortet nicht')), 15000);
        link.onload = () => { clearTimeout(timer); resolve(); };
        link.onerror = () => { clearTimeout(timer); reject(new Error('Gridstack-CSS konnte nicht geladen werden')); };
        document.head.append(link);
      });
    }

    try {
      const [runtime, schema5, widgets, live, shell] = await Promise.all([
        import(url('../js/fcui-runtime.js')),
        import(url('../js/fcui-schema5-layout.js')),
        import(url('../js/fcui-schema5-widgets.js')),
        import(url('../js/fcui-schema5-live.js')),
        import(url('../js/fcui-schema5-view.js')),
        loadStylesheet(),
      ]);
      const { LitElement, html, GridStack } = runtime;
      class Probe extends LitElement {
        render() { return html`<span>Lit funktioniert.</span>`; }
      }
      if (!customElements.get('fcui-build-probe')) customElements.define('fcui-build-probe', Probe);
      const element = document.createElement('fcui-build-probe');
      document.getElementById('probe').append(element);
      await element.updateComplete;
      if (!element.shadowRoot || element.shadowRoot.textContent.trim() !== 'Lit funktioniert.') {
        throw new Error('Lit-Komponente konnte nicht dargestellt werden');
      }
      const container = document.createElement('div');
      container.className = 'grid-stack';
      document.getElementById('probe').append(container);
      const grid = GridStack.init({ column: 12 }, container);
      grid.addWidget({ x: 0, y: 0, w: 2, h: 1 });
      if (grid.getColumn() !== 12 || grid.getGridItems().length !== 1) {
        throw new Error('Gridstack konnte kein 12-Spalten-Raster erzeugen');
      }
      grid.destroy();
      const config = {
        schemaVersion: 5, settings: { layoutMode: 'grid', gridColumns: 12 },
        navigation: { grid: { col: 1, row: 1, w: 12, h: 1 } },
        pages: [{ id: 'check', widgets: [{ id: 'probe', grid: { col: 2, row: 5, w: 2, h: 2 } }] }],
      };
      const sample = document.createElement('div');
      sample.className = 'grid-stack';
      document.getElementById('probe').append(sample);
      const schemaGrid = schema5.createSchema5Grid(GridStack, sample, config, 'check',
        (id) => document.createTextNode(id));
      try {
        const before = schema5.applySchema5GridItems(config, 'check', schemaGrid.save(false));
        if (JSON.stringify(before) !== JSON.stringify(config)) {
          throw new Error('Schema-5-Positionen wurden beim Laden verändert');
        }
        schemaGrid.setStatic(false);
        schemaGrid.update(sample.querySelector('[gs-id="probe"]'), { x: 4, y: 4, w: 3, h: 2 });
        const after = schema5.applySchema5GridItems(config, 'check', schemaGrid.save(false));
        const position = after.pages[0].widgets[0].grid;
        if (position.col !== 5 || position.row !== 5 || position.w !== 3 || position.h !== 2) {
          throw new Error('Schema-5-Positionen wurden nicht korrekt zurückgelesen');
        }
      } finally {
        schemaGrid.destroy();
      }
      const widgetConfig = {
        schemaVersion: 5, settings: { layoutMode: 'grid', gridColumns: 12 },
        navigation: { grid: { col: 1, row: 1, w: 12, h: 1 } },
        pages: [{ id: 'check', widgets: [
          { id: 'text', type: 'text', html: '<p>{{Test:state}}</p>', grid: { col: 1, row: 2, w: 4, h: 2 } },
          { id: 'html', type: 'fhem-html', devices: ['Test'],
            html: '<div>{{Test:state}} <span device="Test" reading="state"></span></div>',
            grid: { col: 5, row: 2, w: 4, h: 2 } },
          { id: 'clock', type: 'fhem-clock', style: 'digital',
            grid: { col: 9, row: 2, w: 4, h: 2 } },
          { id: 'thermostat', type: 'thermostat', device: 'Test',
            readings: { actual: 'temperature', target: 'desiredTemperature' }, grid: { col: 1, row: 4, w: 4, h: 2 } },
          { id: 'value', type: 'fhem-value', device: 'Test', reading: 'state', grid: { col: 5, row: 4, w: 4, h: 2 } },
          { id: 'icon', type: 'fhem-icon', device: 'Test', reading: 'state', states: [],
            grid: { col: 9, row: 4, w: 4, h: 2 } },
          { id: 'table', type: 'fhem-table', rows: [{ device: 'Test', reading: 'state' }],
            grid: { col: 1, row: 6, w: 4, h: 2 } },
          { id: 'slider', type: 'fhem-slider', device: 'Test', reading: 'pct', command: 'pct',
            grid: { col: 5, row: 6, w: 4, h: 2 } },
          { id: 'switch', type: 'fhem-switch', device: 'Test', reading: 'state', on: 'on', off: 'off',
            grid: { col: 9, row: 6, w: 4, h: 2 } },
          { id: 'button', type: 'fhem-button', device: 'Test', command: 'on',
            grid: { col: 1, row: 8, w: 4, h: 2 } },
          { id: 'chart', type: 'fhem-chart', device: 'Test', reading: 'state',
            grid: { col: 5, row: 8, w: 4, h: 2 } },
          { id: 'solar', type: 'fhem-solarflow', readings: { pv: { device: 'Test', reading: 'power' } },
            grid: { col: 9, row: 8, w: 4, h: 2 } },
        ] }],
      };
      const widgetRoot = document.createElement('div');
      widgetRoot.className = 'grid-stack';
      document.getElementById('probe').append(widgetRoot);
      const snapshot = (value) => new Map([['Test', [{
        name: 'Test', readings: { state: value, temperature: '21', desiredTemperature: '22', pct: '40', power: '100' },
      }]]]);
      let actionAttempts = 0;
      const services = {
        iconUrl: () => '',
        history: async () => ({ points: [] }),
        setCommand: () => { actionAttempts += 1; throw new Error('Testaktion gesperrt'); },
        setTarget: () => { actionAttempts += 1; throw new Error('Testaktion gesperrt'); },
      };
      const view = widgets.mountSchema5Widgets(GridStack, widgetRoot, widgetConfig, 'check',
        document.createElement('nav'), services, snapshot('vorher'));
      let liveStatus;
      const livePage = new live.Schema5LivePage({
        jsonlist: async () => snapshot('nachher').get('Test'),
        subscribe: (names, onEvent, onState) => onState('polling'),
        unsubscribe: () => {},
      }, widgetConfig.pages[0].widgets, (data, stale) => view.update(data, stale),
      (next) => { liveStatus = next; });
      try {
        const text = widgetRoot.querySelector('cms-text');
        const freeHtml = widgetRoot.querySelector('cms-html');
        const tags = ['cms-text', 'cms-html', 'cms-clock', 'cms-thermostat', 'cms-value', 'cms-icon',
          'cms-table', 'cms-slider', 'cms-switch', 'cms-button', 'cms-chart', 'cms-solarflow'];
        if (widgetRoot.querySelectorAll('.grid-stack-item').length !== 13
          || tags.some((tag) => widgetRoot.querySelectorAll(tag).length !== 1)) {
          throw new Error('Nicht alle Test-Widgets wurden im Raster angelegt');
        }
        if (text?.shadowRoot.querySelector('[data-body]')?.textContent.trim() !== 'vorher'
          || freeHtml?.shadowRoot.querySelector('[data-content]')?.textContent.trim() !== 'vorher vorher') {
          throw new Error('Widget-Platzhalter konnten nicht dargestellt werden');
        }
        await livePage.start();
        if (text.shadowRoot.querySelector('[data-body]').textContent.trim() !== 'nachher'
          || freeHtml.shadowRoot.querySelector('[data-content]').textContent.trim() !== 'nachher nachher'
          || liveStatus.error !== null) {
          throw new Error('Live-Snapshots und Widget-Platzhalter konnten nicht aktualisiert werden');
        }
        await widgetRoot.querySelector('cms-button').push();
        if (actionAttempts !== 1 || !widgetRoot.querySelector('cms-button').shadowRoot
          .querySelector('[data-msg]').textContent.includes('Testaktion gesperrt')) {
          throw new Error('Testaktion wurde nicht sicher abgewiesen');
        }
      } finally {
        livePage.stop();
        view.destroy();
        widgetRoot.remove();
      }
      const shellConfig = structuredClone(widgetConfig);
      shellConfig.pages[0].title = 'Erste Seite';
      shellConfig.pages.push({
        id: 'second', title: 'Zweite Seite', widgets: [{
          id: 'second-value', type: 'fhem-value', device: 'Other', reading: 'state',
          grid: { col: 1, row: 2, w: 4, h: 2 },
        }],
      });
      shellConfig.navigation.items = [{ page: 'second', label: 'Weitere Seite' }];
      const shellRoot = document.createElement('div');
      shellRoot.className = 'grid-stack';
      document.getElementById('probe').append(shellRoot);
      const shellStatus = document.createElement('p');
      const listeners = new Map();
      let reloads = 0;
      const browser = {
        location: { hash: '#/check', reload: () => { reloads += 1; } },
        addEventListener: (name, callback) => listeners.set(name, callback),
        removeEventListener: (name) => listeners.delete(name),
      };
      let shellRequests = 0;
      let unsubscribed = 0;
      const shellClient = {
        jsonlist: async (spec) => {
          shellRequests += 1;
          const name = spec.startsWith('Other,') ? 'Other' : 'Test';
          return [{ name, readings: { state: name === 'Other' ? 'zweiter Wert' : 'erster Wert' } }];
        },
        subscribe: (names, onEvent, onState) => onState('polling'),
        unsubscribe: () => { unsubscribed += 1; },
      };
      const shellView = new shell.Schema5View({
        GridStack, root: shellRoot, status: shellStatus, config: shellConfig,
        client: shellClient, services, browser,
      });
      try {
        await shellView.start();
        if (shellRoot.querySelector('cms-text')?.shadowRoot.querySelector('[data-body]')?.textContent.trim() !== 'erster Wert'
          || shellRoot.querySelector('nav a[aria-current="page"]')?.textContent !== 'Erste Seite') {
          throw new Error('Erste Schema-5-Seite konnte nicht geladen werden');
        }
        browser.location.hash = '#/second';
        listeners.get('hashchange')();
        await shellView.live.inFlight;
        if (shellRoot.querySelector('cms-value')?.shadowRoot.textContent.includes('zweiter Wert') !== true
          || shellRoot.querySelector('nav a[aria-current="page"]')?.textContent !== 'Weitere Seite'
          || shellRequests !== 2) {
          throw new Error('Schema-5-Seitenwechsel konnte nicht geprüft werden');
        }
        listeners.get('pagehide')();
        if (shellRoot.querySelector('.grid-stack-item') || unsubscribed !== 2) {
          throw new Error('Schema-5-Ansicht wird beim Verlassen nicht aufgeräumt');
        }
        listeners.get('pageshow')({ persisted: true });
        if (reloads !== 1) throw new Error('Wiederhergestellte Seite wird nicht neu geladen');
      } finally {
        shellView.stop();
        shellRoot.remove();
      }
      if (listeners.size !== 0 || unsubscribed !== 2) {
        throw new Error('Schema-5-Seite räumt Live-Abos nicht auf');
      }
      status.textContent = 'Erfolg: Lit, Gridstack, Schema-5-Raster, Live-Widgets und Seitenwechsel wurden synthetisch geprüft.';
    } catch (error) {
      status.textContent = `Fehler beim Laden oder Prüfen der FCUI-Dateien: ${error.message}`;
    }
  </script>
</body>
</html>
