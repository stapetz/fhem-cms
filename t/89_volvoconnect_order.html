<!doctype html>
<html lang="de" data-cms-theme="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolvoConnect popup arrangement</title>
<link rel="stylesheet" href="../www/fhem-cms/css/fhem-cms.css">
<link rel="stylesheet" href="../www/fhem-cms/css/fcui-gridstack.css">
<style>
body { margin:0; }
.grid-stack-animate,.grid-stack-animate .grid-stack-item { transition:none !important; }
#result { white-space:pre-wrap; }
</style>
<main class="cms-shell"><section id="editor"></section></main>
<pre id="result">RUNNING</pre>
<script type="module">
import { GridStack } from '../www/fhem-cms/js/fcui-runtime.js';
import { Schema5Editor } from '../www/fhem-cms/js/fcui-schema5-editor.js';
import { Schema5DraftController } from '../www/fhem-cms/js/fcui-schema5-draft.js';
import { volvoGroupOrder } from '../www/fhem-cms/js/volvoconnect.js';

const output = document.querySelector('#result');
let checks = 0;
const check = (condition, message) => { if (!condition) throw new Error(message); checks++; };
const initial = { schemaVersion:5, theme:'light', settings:{layoutMode:'grid',gridColumns:12},
  navigation:{orientation:'horizontal',grid:{col:1,row:1,w:12,h:1}},
  pages:[{id:'one',title:'Auto',widgets:[{id:'car',type:'fhem-volvoconnect',device:'Car',
    title:'VolvoConnect',grid:{col:1,row:2,w:4,h:4}}]}] };
let state = {live:structuredClone(initial),draft:null,token:'a'.repeat(64)};
let writes = 0, publications = 0, fail = false;
const controller = new Schema5DraftController({
  read:async () => structuredClone(state),
  save:async (candidate,token) => {
    check(token === state.token, 'save uses current token');
    if (fail) throw new Error('test storage failure');
    state.draft = structuredClone(candidate);
    state.token = 'b'.repeat(64);
    writes++;
  },
  publish:async () => { publications++; throw new Error('Unexpected publication'); },
  discard:async () => { throw new Error('Unexpected discard'); },
});
const values = {state:'authenticated',state_batteryChargeLevel:'84',fuel_batteryChargeLevel:'84',
  state_electricRange:'310',state_electricRange_unit:'km',state_chargingPower:'PROPERTY_NOT_FOUND',
  state_chargingPower_unit:'watts',state_transferLimit:'PROPERTY_NOT_SUPPORTED',
  capabilities_charge_isSupported:'1',statistics_tripMeterManual:'123',
  statistics_unavailable:'property_not_found',doors_centralLock:'LOCKED',
  warnings_lowBeamLeftWarning:'NO_WARNING',windows_frontLeftWindow:'CLOSED',
  engine_engineStatus:'STOPPED',vehicle_descriptions_model:'Demo',
  vehicle_images_exteriorImageUrl:`${location.origin}/t/media/${'a'.repeat(32)}.png`};
const snapshot = () => [{name:'Car',type:'VolvoConnect',readings:{...values},sets:'lock unlock'}];
const editor = new Schema5Editor({GridStack,root:document.querySelector('#editor'),controller,
  client:{jsonlist:async () => snapshot(),subscribe() {},unsubscribe() {}},
  services:{listAllDevices:async () => snapshot()},
  browser:{location:window.location,localStorage:window.localStorage,
    addEventListener:window.addEventListener.bind(window),
    removeEventListener:window.removeEventListener.bind(window),confirm:() => false}});
const outer = () => document.querySelector('cms-volvoconnect');
const host = outer;
const $ = selector => host().shadowRoot.querySelector(selector);
const order = () => [...$('#top').children].map(card => card.dataset.group);
const pause = () => new Promise(resolve => setTimeout(resolve,30));
const wait = async predicate => {
  for (let i=0;i<150;i++) { if (predicate()) return; await pause(); }
  throw new Error('Editor transition timed out');
};
const start = async () => {
  host().openDetails();
  host().startArrangement();
};
const cancel = async () => {
  host().cancelArrangement();
  host().closeDetails();
};
try {
  await editor.start();
  await wait(() => outer()?.snapshot);
  outer().openActions();
  check($('[data-command]').disabled, 'editor cannot execute vehicle commands');
  outer().closeActions();
  await start();
  check(host().snapshot[0].name === 'Car', 'popup uses actual device readings');
  check(order().slice(0,4).join() === 'state,statistics,vehicle,gallery', 'agreed initial order');
  check(order().length === 15, 'all cards including absent groups remain editable');
  check(!$('#reading-fuel_batteryChargeLevel') && !$('#reading-state_batteryChargeLevel'), 'no duplicate SOC row');
  check(!$('#reading-state_chargingPower') && !$('#reading-statistics_unavailable'), 'unavailable properties omitted');
  host().moveCard('gallery',-1);
  host().toggleCard('doors');
  check(order()[2] === 'gallery' && writes === 0, 'interactive preview does not write');
  check(host().pendingVisibility.hiddenGroups.includes('doors'), 'eye toggles pending visibility');
  check(!host().config.hiddenGroups?.includes('doors'), 'eye leaves stored config untouched');
  check(!$('[data-card-step]'), 'visible up/down buttons removed');
  host().data = snapshot();
  check(order()[2] === 'gallery', 'live data retains unsaved order');
  await cancel();
  await start();
  check(order()[3] === 'gallery' && !host().pendingVisibility.hiddenGroups.includes('doors'),
    'cancel discards ordering and visibility');
  host().toggleCard('doors');
  host().toggleCard('gallery');
  fail = true;
  await host().saveArrangement();
  check($('[data-message]').textContent.includes('test storage failure'), 'storage failure visibly reported');
  check(writes === 0 && host().pendingVisibility.showGallery === false, 'failure retains pending visibility without writing');
  fail = false;
  await controller.reload();
  await cancel();
  window.popupOrderTest = {
    host, $, order, check, start, cancel,
    save: async () => { await host().saveArrangement(); await wait(() => document.querySelector('.cms-widget-config')); },
    snapshot: () => structuredClone(state), writes: () => writes,
    finish: async () => {
      check(writes === 1 && publications === 0, 'exactly one draft write and no publication');
      check(JSON.stringify(state.live) === JSON.stringify(initial), 'live config unchanged');
      check(JSON.stringify(state.draft.pages[0].widgets[0].grid) ===
        JSON.stringify(initial.pages[0].widgets[0].grid), 'outer grid unchanged');
      await controller.reload();
      check(controller.snapshot().draft.pages[0].widgets[0].groupOrder.includes('gallery'),
        'reload reads persisted order including gallery');
      check(new Set(state.draft.pages[0].widgets[0].groupOrder).size === volvoGroupOrder().length,
        'saved order includes all unique cards');
      check(state.draft.pages[0].widgets[0].showDetails !== false, 'legacy popup default retained');
      check(state.draft.pages[0].widgets[0].hiddenGroups.includes('doors'), 'eye preference persists with order');
      const {mountSchema5Widgets} = await import('../www/fhem-cms/js/fcui-schema5-widgets.js');
      const root = document.createElement('div');
      root.className = 'grid-stack cms-schema5-grid';
      document.body.append(root);
      const view = mountSchema5Widgets(GridStack,root,state.draft,'one',document.createElement('nav'),{},
        new Map([['Car',snapshot()]]));
      try {
        const readOnly = root.querySelector('cms-volvoconnect');
        readOnly.openDetails();
        check(readOnly.$('[data-arrange]').hidden, 'view mode has no arrangement controls');
        readOnly.startArrangement();
        check(!readOnly.pendingCardOrder, 'view mode rejects arrangement method');
        check(!readOnly.$('[data-group="doors"]'), 'saved hidden group is absent in view mode');
      } finally { view.destroy(); root.remove(); }
      output.dataset.result = 'pass';
      output.textContent = JSON.stringify({checks});
    },
  };
  output.dataset.ready = 'true';
  output.textContent = 'READY';
} catch (error) {
  output.dataset.result = 'fail';
  output.textContent = `${error.message}\n${error.stack}`;
}
</script>
