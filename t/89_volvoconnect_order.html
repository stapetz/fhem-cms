<!doctype html>
<html lang="de" data-cms-theme="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolvoConnect popup arrangement</title>
<link rel="stylesheet" href="../www/fhem-cms/css/fhem-cms.css">
<link rel="stylesheet" href="../www/fhem-cms/css/fcui-gridstack.css">
<style>
body { margin:0; }
.grid-stack-animate,.grid-stack-animate .grid-stack-item { transition:none !important; }
#result { white-space:pre-wrap; }
</style>
<main class="cms-shell"><section id="editor"></section></main>
<pre id="result">RUNNING</pre>
<script type="module">
import { GridStack } from '../www/fhem-cms/js/fcui-runtime.js';
import { Schema5Editor } from '../www/fhem-cms/js/fcui-schema5-editor.js';
import { Schema5DraftController } from '../www/fhem-cms/js/fcui-schema5-draft.js';
import { volvoGroupOrder } from '../www/fhem-cms/js/volvoconnect.js';

const output = document.querySelector('#result');
let checks = 0;
const check = (condition, message) => { if (!condition) throw new Error(message); checks++; };
const parameters = new URLSearchParams(location.search);
const columns = Number(parameters.get('columns') || 12);
const initial = { schemaVersion:5, theme:'light', settings:{layoutMode:'grid',gridColumns:columns},
  navigation:{orientation:'horizontal',grid:{col:1,row:1,w:columns,h:1}},
  pages:[{id:'one',title:'Auto',widgets:[{id:'car',type:'fhem-volvoconnect',device:'Car',
    title:'VolvoConnect',showDetails:parameters.get('inline') !== '1',
    grid:{col:1,row:2,w:parameters.get('inline') === '1' ? columns : columns / 3,h:columns / 3}}]}] };
let state = {live:structuredClone(initial),draft:null,token:'a'.repeat(64)};
let writes = 0, publications = 0, fail = false;
const controller = new Schema5DraftController({
  read:async () => structuredClone(state),
  save:async (candidate,token) => {
    check(token === state.token, 'save uses current token');
    if (fail) throw new Error('test storage failure');
    state.draft = structuredClone(candidate);
    writes++;
    state.token = (writes + 10).toString(16).repeat(64);
  },
  publish:async () => { publications++; throw new Error('Unexpected publication'); },
  discard:async () => { throw new Error('Unexpected discard'); },
});
const values = {state:'authenticated',state_batteryChargeLevel:'84',fuel_batteryChargeLevel:'84',
  state_code:'AUTHORIZATION_ERROR',
  state_electricRange:'310',state_electricRange_unit:'km',state_chargingPower:'PROPERTY_NOT_FOUND',
  state_chargingPower_unit:'watts',state_transferLimit:'PROPERTY_NOT_SUPPORTED',
  capabilities_charge_isSupported:'1',statistics_tripMeterManual:'123',
  statistics_unavailable:'property_not_found',doors_centralLock:'LOCKED',
  warnings_lowBeamLeftWarning:'NO_WARNING',windows_frontLeftWindow:'CLOSED',
  engine_engineStatus:'STOPPED',vehicle_descriptions_model:'Demo',
  vehicle_images_exteriorImageUrl:`${location.origin}/t/media/${'a'.repeat(32)}.png`};
const snapshot = () => [{name:'Car',type:'VolvoConnect',readings:{...values},sets:'lock unlock'}];
const editor = new Schema5Editor({GridStack,root:document.querySelector('#editor'),controller,
  client:{jsonlist:async () => snapshot(),subscribe() {},unsubscribe() {}},
  services:{listAllDevices:async () => snapshot()},
  browser:{location:window.location,localStorage:window.localStorage,
    addEventListener:window.addEventListener.bind(window),
    removeEventListener:window.removeEventListener.bind(window),confirm:() => false}});
const outer = () => document.querySelector('cms-volvoconnect');
const host = outer;
const $ = selector => {
  const root = host().shadowRoot;
  return (root.querySelector('[data-details]').open && root.querySelector('[data-detail-content]').querySelector(selector))
    || root.querySelector(selector);
};
const order = () => [...$('#top').children].map(card => card.dataset.group);
const pause = () => new Promise(resolve => setTimeout(resolve,30));
const wait = async predicate => {
  for (let i=0;i<150;i++) { if (predicate()) return; await pause(); }
  throw new Error('Editor transition timed out');
};
const start = async () => {
  host().openDetails();
  host().startArrangement();
};
const cancel = async () => {
  host().cancelArrangement();
  host().closeDetails();
};
const sizeEnergy = () => host().setCardSize('state',columns / 2,
  Math.max(Math.ceil(576 / host().pendingGrid.rowHeight), Math.ceil(192 / host().pendingGrid.rowHeight) + 2));
try {
  await editor.start();
  await wait(() => outer()?.snapshot);
  outer().openActions();
  check($('[data-command]').disabled, 'editor cannot execute vehicle commands');
  outer().closeActions();
  host().openDetails();
  if ($('#top').clientWidth > 600) {
    check($('#top').hasAttribute('data-float') && !host().config.cardSizes,
      'unsized existing cards use floating placement without migrating configuration');
    const cards=[...$('#top').children].map(card=>card.getBoundingClientRect());
    check(cards.every((a,i)=>cards.slice(i+1).every(b=>
      a.right<=b.left+1 || b.right<=a.left+1 || a.bottom<=b.top+1 || b.bottom<=a.top+1)),
      'normal floating cards do not overlap');
    check(cards.some((card,i)=>cards.slice(0,i).some(other=>
      card.top>other.top+1 && card.top<other.bottom-1)),
      'normal floating layout fills space alongside taller cards instead of rigid rows');
  }
  await start();
  check(host().cardGrid().columns === columns, 'arrangement inherits actual page column setting');
  check(Math.abs(host().cardGrid().rowHeight - document.querySelector('.cms-schema5-grid').gridstack.getCellHeight()) < .1,
    'arrangement inherits the main grid row height');
  if (parameters.get('inline') === '1') {
    const inlineWidth = host().inlineArrangementWidth;
    check(Math.abs($('#top').getBoundingClientRect().width - inlineWidth) < 2,
      `inline arrangement uses the exact same content width as the main inline widget (${inlineWidth} vs ${$('#top').getBoundingClientRect().width})`);
  }
  check(host().snapshot[0].name === 'Car', 'popup uses actual device readings');
  check(order().slice(0,4).join() === 'state,statistics,vehicle,gallery', 'agreed initial order');
  check(order().length === 15, 'all cards including absent groups remain editable');
  check(!$('#reading-state_code'), 'technical authorization code is omitted from popup');
  check(host().shadowRoot.querySelectorAll('[data-resize-card]').length === 15,
    'every card has the same corner resizing control');
  check(!$('#top').hasAttribute('data-guides'), 'grid guides initially follow disabled global preference');
  const gridToggle = document.querySelector('[aria-label="Raster anzeigen"]')
    || [...document.querySelectorAll('button')].find(button=>button.textContent.trim()==='Raster anzeigen');
  check(gridToggle, 'global grid preference control exists');
  gridToggle.click();
  check($('#top').hasAttribute('data-guides'), 'global grid preference propagates to open arrangement');
  check($('#top').style.getPropertyValue('--card-columns') === String(columns),
    'grid guide columns match the inherited page setting');
  gridToggle.click();
  check(!$('#top').hasAttribute('data-guides'), 'turning grid preference off removes popup guides');
  gridToggle.click();
  await cancel();
  await start();
  check($('#top').hasAttribute('data-guides'), 'opening arrangement inherits enabled grid preference');
  gridToggle.click();
  check([...host().shadowRoot.querySelectorAll('[data-reading-visibility]')]
    .every(button => button.getBoundingClientRect().height >= 48), 'reading eyes retain 48px touch targets');
  check(!$('#group-state [data-reading-visibility]'), 'energy readings are fixed without individual eyes');
  check(!$('#identity [data-reading-visibility]') && $('#identity .badge'),
    'connection status is always shown without an eye in arrangement mode');
  host().toggleReading('state');
  check(!host().pendingVisibility.hiddenReadings.includes('state'),
    'connection status cannot be hidden through toggle method');
  for (const row of host().shadowRoot.querySelectorAll('.row[data-editable]')) {
    const eye = row.querySelector('[data-reading-visibility]');
    check(row.querySelector('dt').firstElementChild === eye && !row.querySelector('dd button'),
      'reading eye precedes the label rather than the variable-width value');
    check(Math.abs(eye.getBoundingClientRect().left - row.getBoundingClientRect().left) < 1,
      'reading eyes align at the beginning of each row');
  }
  for (const tools of host().shadowRoot.querySelectorAll('.card-tools')) {
    check(getComputedStyle(tools).justifyContent === 'flex-end'
      && Math.abs(tools.lastElementChild.getBoundingClientRect().right - tools.getBoundingClientRect().right) < 1,
      'drag grip and card eye align on right edge');
  }
  check(!$('#reading-fuel_batteryChargeLevel') && !$('#reading-state_batteryChargeLevel'), 'no duplicate SOC row');
  check(!$('#reading-state_chargingPower') && !$('#reading-statistics_unavailable'), 'unavailable properties omitted');
  host().moveCard('gallery',-1);
  host().toggleCard('doors');
  $('[data-reading-visibility="statistics_tripMeterManual"]').click();
  check(order()[2] === 'gallery' && writes === 0, 'interactive preview does not write');
  check(host().pendingVisibility.hiddenGroups.includes('doors'), 'eye toggles pending visibility');
  check(host().pendingVisibility.hiddenReadings.includes('statistics_tripMeterManual'), 'reading eye toggles pending visibility');
  check(!host().config.hiddenGroups?.includes('doors'), 'eye leaves stored config untouched');
  check(!$('[data-card-step]'), 'visible up/down buttons removed');
  host().data = snapshot();
  check(order()[2] === 'gallery', 'live data retains unsaved order');
  await cancel();
  await start();
  check(order()[3] === 'gallery' && !host().pendingVisibility.hiddenGroups.includes('doors'),
    'cancel discards ordering and visibility');
  check(!host().pendingVisibility.hiddenReadings.length, 'cancel discards reading visibility');
  host().pendingSizes = {state:{w:12,h:18},statistics:{w:6,h:12}};
  host().pendingGrid = null;
  host().ensureCardSizes();
  check(host().pendingGrid.columns === columns && host().pendingSizes.state.w === columns
    && host().pendingSizes.statistics.w === columns / 2,
    'legacy twelve-column sizes convert to inherited full and half width');
  check(Math.abs(host().pendingSizes.state.h * host().pendingGrid.rowHeight - 18*32)
    <= host().pendingGrid.rowHeight,
    'legacy card height is preserved to within one inherited row');
  const inheritedService = host().services.cardGrid;
  const inheritedHeight = host().pendingSizes.state.h * host().pendingGrid.rowHeight;
  host().services.cardGrid = () => ({columns:columns === 192 ? 96 : 192,rowHeight:8});
  host().ensureCardSizes();
  check(host().pendingSizes.state.w === host().pendingGrid.columns
    && Math.abs(host().pendingSizes.state.h * 8 - inheritedHeight) <= 8,
    'changing page grid resolution preserves full width and physical card height');
  host().services.cardGrid = inheritedService;
  await cancel();
  await start();
  host().ensureCardSizes();
  sizeEnergy();
  const energyBefore = {...host().pendingSizes.state};
  const pendingSizes = JSON.stringify(host().pendingSizes);
  $('[data-auto-arrange]').click();
  check(JSON.stringify(host().pendingSizes) === pendingSizes && writes === 0,
    'automatic arrangement keeps all sizes and does not write');
  check($('#top').hasAttribute('data-sized'), 'manual dimensions activate popup grid');
  const resize = $('[data-group="state"] [data-resize-card]');
  resize.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));
  check(host().pendingSizes.state.h === energyBefore.h + 1, 'resize handle supports height keyboard change');
  $('[data-group="state"] [data-resize-card]').dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));
  check(host().pendingSizes.state.w === energyBefore.w + 1, 'resize handle supports width keyboard change');
  host().toggleCard('statistics');
  host().toggleCard('gallery');
  host().autoArrangeCards();
  const firstHidden = order().findIndex(key=>['statistics','gallery'].includes(key));
  check(order().slice(firstHidden).every(key=>['statistics','gallery'].includes(key)),
    'automatic arrangement puts hidden cards including gallery last');
  if ($('#top').clientWidth > 600) {
    const hiddenTop = Math.min(...[...$('#top').children].filter(c=>c.hasAttribute('data-concealed'))
      .map(c=>c.getBoundingClientRect().top));
    const visibleBottom = Math.max(...[...$('#top').children].filter(c=>!c.hasAttribute('data-concealed'))
      .map(c=>c.getBoundingClientRect().bottom));
    check(hiddenTop >= visibleBottom, 'hidden cards are visually below all visible cards, not backfilled into holes');
  }
  await cancel();
  await start();
  check(!host().config.cardSizes && host().cardStack?.el === $('#top'),
    'cancel discards sizes and automatic arrangement; next edit measures its GridStack baseline');
  host().reorderCard('gallery','statistics',true);
  host().reorderCard('gallery','statistics',true);
  check(order()[1] === 'gallery', 'repeated upper-half hits keep card before target');
  host().reorderCard('gallery','statistics',false);
  host().reorderCard('gallery','statistics',false);
  check(order()[2] === 'gallery', 'repeated lower-half hits keep card after target');
  host().toggleCard('doors');
  host().toggleCard('gallery');
  host().ensureCardSizes();
  sizeEnergy();
  const failedSize = {...host().pendingSizes.state};
  fail = true;
  await host().saveArrangement();
  check($('[data-message]').textContent.includes('test storage failure'), 'storage failure visibly reported');
  check(writes === 0 && host().pendingVisibility.showGallery === false, 'failure retains pending visibility without writing');
  check(JSON.stringify(host().pendingSizes.state) === JSON.stringify(failedSize),
    'failed save retains pending sizes for retry or cancel');
  fail = false;
  await controller.reload();
  await cancel();
  window.popupOrderTest = {
    host, $, order, check, start, cancel,
    save: async () => { await host().saveArrangement(); await wait(() => document.querySelector('.cms-widget-config')); },
    snapshot: () => structuredClone(state), writes: () => writes,
    geometry: () => host().cardStack.save(false).map(({id,x=0,y=0,w,h})=>({id,x,y,w,h})).sort((a,b)=>a.id.localeCompare(b.id)),
    prepareFreeDrag: () => {
      host().cancelArrangement();
      host().startArrangement();
      const h=host(),grid=h.pendingGrid;
      check(h.cardStack instanceof GridStack, 'popup uses exactly the main widget GridStack constructor');
      check(h.cardStack.opts.mode === document.querySelector('.cms-schema5-grid').gridstack.opts.mode
        && h.cardStack.opts.margin === 0, 'same float engine and gap mechanics as main grid');
      const order=[...h.pendingCardOrder], step=Math.ceil(280/grid.rowHeight);
      h.pendingSizes=Object.fromEntries(order.map(key=>[key,{w:grid.columns/3,h:step}]));
      h.pendingPositions=Object.fromEntries(order.map((key,i)=>[key,{x:0,y:(i+2)*step}]));
      h.pendingPositions.gallery={x:0,y:0};
      h.pendingCardOrder=h.cardStackMobile ? ['state','gallery',...order.filter(key=>!['state','gallery'].includes(key))]
        : ['gallery',...order.filter(key=>key!=='gallery')];
      h.render();
      $('[data-detail-body]').scrollTop=0;
      const mobile=h.cardStackMobile;
      return {colWidth:$('#top').clientWidth/grid.columns,rowHeight:grid.rowHeight,
        mobile,dx:mobile?0:grid.columns/3,dy:mobile?h.cardStack.save(false).find(n=>n.id==='gallery').h:Math.ceil(140/grid.rowHeight)};
    },
    prepareFullWidth: () => {
      host().cancelArrangement();host().startArrangement();
      const h=host(),g=h.pendingGrid,order=['statistics','state',...h.pendingCardOrder.filter(key=>!['statistics','state'].includes(key))],height=Math.ceil(224/g.rowHeight);
      h.pendingCardOrder=order;
      h.pendingSizes=Object.fromEntries(order.map(key=>[key,{w:g.columns,h:height}]));
      h.pendingPositions=Object.fromEntries(order.map((key,i)=>[key,{x:0,y:i*height}]));
      h.render();
    },
    finish: async () => {
      check(writes === 1 && publications === 0, 'exactly one draft write and no publication');
      const currentHost = host();
      const dialog = $('[data-details]');
      check(dialog.open && !host().pendingCardOrder, 'apply keeps existing popup open and exits arrangement');
      check(!$('[data-drag-card]') && !$('[data-reading-visibility]') && !$('[data-card-visibility]'),
        'apply hides all editing controls');
      check(host().shadowRoot.activeElement === $('[data-arrange]'), 'apply leaves focus on visible arrangement button');
      const content = $('[data-detail-body]');
      const grid = document.querySelector('.cms-schema5-grid');
      const outerScroll = grid.parentElement.scrollTop;
      host().data = snapshot();
      host().startArrangement();
      host().ensureCardSizes();
      sizeEnergy();
      host().setCardSize('gallery',columns / 2,Math.ceil(448 / host().pendingGrid.rowHeight));
      host().autoArrangeCards();
      const savedSizes = JSON.stringify(host().pendingSizes);
      const savedGrid = {...host().pendingGrid};
      host().toggleReading('state_batteryChargeLevel');
      check(!host().pendingVisibility.hiddenReadings.includes('state_batteryChargeLevel'),
        'energy visibility cannot be changed through toggle method');
      $('[data-reading-visibility="vehicle_descriptions_model"]').click();
      $('[data-reading-visibility="statistics_tripMeterManual"]').click();
      const scroll = content.scrollTop;
      await host().saveArrangement();
      const savedPositions = structuredClone(host().config.cardPositions);
      check(writes === 2 && host() === currentHost && $('[data-details]') === dialog && dialog.open,
        'second save uses fresh token without remounting host/dialog');
      check(JSON.stringify(host().config.cardSizes) === savedSizes
        && JSON.stringify(state.draft.pages[0].widgets[0].cardSizes) === savedSizes,
        'card sizes persist through actual editor draft callback');
      check(JSON.stringify(host().config.cardGrid) === JSON.stringify(savedGrid)
        && host().config.cardGrid.columns === columns, 'inherited grid units persist with sizes');
      check(JSON.stringify(state.draft.pages[0].widgets[0].cardPositions) === JSON.stringify(savedPositions),
        'exact coordinates persist through actual editor draft callback');
      check([...$('#top').children].every(card=>{
        const p=savedPositions[card.dataset.group];
        return !p || (card.style.gridColumnStart === String(p.x+1) && card.style.gridRowStart === String(p.y+1));
      }), 'saved display honors exact coordinates without dense backfilling');
      check(!$('[data-resize-card]'), 'apply removes resize controls');
      check(!$('#top').hasAttribute('data-guides'), 'normal popup never displays editing grid guides');
      const popupGrid = $('#top');
      if (popupGrid.getBoundingClientRect().width <= 600) {
        check(getComputedStyle(popupGrid).display === 'flex', 'mobile saved popup sizes become a single column');
        check([...popupGrid.children].every(card=>card.clientWidth <= popupGrid.clientWidth
          && card.querySelector('.card-body').scrollHeight <= card.querySelector('.card-body').clientHeight + 1),
          'mobile cards show full contents without internal clipping');
      } else {
        const energy = $('[data-group="state"] .card-frame');
        check(Math.abs(energy.getBoundingClientRect().height - (host().config.cardSizes.state.h*savedGrid.rowHeight-16)) < 1,
          'saved desktop height matches requested grid units exactly');
        check(Math.abs(energy.getBoundingClientRect().width - (popupGrid.clientWidth/2-16)) < 1,
          'saved desktop width matches requested six of twelve columns');
      }
      check(Math.abs(content.scrollTop - Math.min(scroll, content.scrollHeight - content.clientHeight)) <= 1
        && grid.parentElement.scrollTop === outerScroll,
        'saving preserves popup and page scroll');
      check($('.soc') && $('[role=meter]') && $('.range'), 'fixed energy summary remains visible after apply');
      check(!$('#reading-vehicle_descriptions_model'), 'hidden reading disappears after apply');
      check(!host().pendingCardOrder, 'successful apply exits editing');
      host().startArrangement();
      if (!host().cardStackMobile) {
        const geometry = host().cardStack.save(false);
        host().cancelArrangement();
        const top = $('#top'),bounds = top.getBoundingClientRect();
        check(top.hasAttribute('data-float'), 'normal card view uses the floating layout too');
        const differences = [...top.children].map(card=>{
          const item=geometry.find(entry=>entry.id===card.dataset.group),r=card.getBoundingClientRect();
          return {key:card.dataset.group,delta:[r.x-bounds.x-item.x*bounds.width/columns,
            r.y-bounds.y-item.y*savedGrid.rowHeight,r.width-item.w*bounds.width/columns,
            r.height-item.h*savedGrid.rowHeight]};
        });
        check(differences.every(({delta})=>delta.every(value=>Math.abs(value)<1)),
          `normal and moving modes have identical actual card geometry: ${JSON.stringify(differences)}`);
        host().startArrangement();
      }
      const reopeningSize = {...host().pendingSizes.state};
      check(Math.abs(reopeningSize.h * host().pendingGrid.rowHeight
        - host().config.cardSizes.state.h * host().config.cardGrid.rowHeight) <= host().pendingGrid.rowHeight,
        'reopening preserves physical card height across inherited grid measurement changes');
      check(!$('#group-state [data-reading-visibility]'), 'energy summary and readings have no eye controls');
      check($('[data-reading-visibility="vehicle_descriptions_model"]').getAttribute('aria-pressed') === 'false',
        'hidden reading remains editable');
      host().toggleReading('vehicle_descriptions_model');
      host().cancelArrangement();
      check(!$('#reading-vehicle_descriptions_model'), 'cancel restores saved reading preference');
      host().data = [{name:'Car',readings:{}}];
      check(host().config.hiddenReadings.includes('statistics_tripMeterManual'), 'missing reading retains hidden preference');
      host().data = snapshot();
      check(!$('#reading-statistics_tripMeterManual'), 'returning reading keeps saved visibility');
      check(JSON.stringify(state.live) === JSON.stringify(initial), 'live config unchanged');
      check(JSON.stringify(state.draft.pages[0].widgets[0].grid) ===
        JSON.stringify(initial.pages[0].widgets[0].grid), 'outer grid unchanged');
      await controller.reload();
      check(controller.snapshot().draft.pages[0].widgets[0].groupOrder.includes('gallery'),
        'reload reads persisted order including gallery');
      check(new Set(state.draft.pages[0].widgets[0].groupOrder).size === volvoGroupOrder().length,
        'saved order includes all unique cards');
      check(state.draft.pages[0].widgets[0].showDetails === initial.pages[0].widgets[0].showDetails,
        'inline or popup display preference retained');
      check(state.draft.pages[0].widgets[0].hiddenGroups.includes('doors'), 'eye preference persists with order');
      check(controller.snapshot().draft.pages[0].widgets[0].hiddenReadings.includes('vehicle_descriptions_model'),
        'reading preference survives controller reload');
      let staleRejected = false;
      await controller.saveWidget('one',{...state.draft.pages[0].widgets[0], title:'Other edit'}, state.token,'update');
      host().startArrangement();
      await host().saveArrangement();
      staleRejected = $('[data-message]').textContent.includes('veraltet');
      check(staleRejected && host().pendingCardOrder && dialog.open,
        'concurrent change is rejected, not overwritten with a fetched token');
      host().cancelArrangement();
      host().closeDetails();
      const {mountSchema5Widgets} = await import('../www/fhem-cms/js/fcui-schema5-widgets.js');
      const root = document.createElement('div');
      root.className = 'grid-stack cms-schema5-grid';
      document.body.append(root);
      const view = mountSchema5Widgets(GridStack,root,state.draft,'one',document.createElement('nav'),{},
        new Map([['Car',snapshot()]]));
      try {
        const readOnly = root.querySelector('cms-volvoconnect');
        readOnly.openDetails();
        check(JSON.stringify(readOnly.config.cardSizes) === savedSizes
          && readOnly.$('#top').hasAttribute('data-sized') && !readOnly.$('#top').hasAttribute('data-guides'),
          'saved dimensions survive full readonly remount without editing guides');
        check(readOnly.$('[data-arrange]').hidden, 'view mode has no arrangement controls');
        check(JSON.stringify(readOnly.config.cardPositions) === JSON.stringify(savedPositions)
          && [...readOnly.$('#top').children].every(card=>{
            const p=savedPositions[card.dataset.group];
            return !p || (card.style.gridColumnStart === String(p.x+1) && card.style.gridRowStart === String(p.y+1));
          }), 'exact free coordinates survive full readonly remount');
        readOnly.startArrangement();
        check(!readOnly.pendingCardOrder, 'view mode rejects arrangement method');
        check(!readOnly.$('[data-group="doors"]'), 'saved hidden group is absent in view mode');
        check(readOnly.$('.soc') && !readOnly.$('#reading-vehicle_descriptions_model'),
          'saved hidden readings are absent after a full view remount');
      } finally { view.destroy(); root.remove(); }
      output.dataset.result = 'pass';
      output.textContent = JSON.stringify({checks});
    },
  };
  output.dataset.ready = 'true';
  output.textContent = 'READY';
} catch (error) {
  output.dataset.result = 'fail';
  output.textContent = `${error.message}\n${error.stack}`;
}
</script>
