<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>LinkWidget regression</title>
<style>body { background:#eee; } cms-link { width:720px; height:360px; }</style>
<pre id="result"></pre>
<script type="module">
import '../www/fhem-cms/components/cms-link.js';
import { fitLinkWidget } from '../www/fhem-cms/js/link-widget.js';
import { Schema5DraftController } from '../www/fhem-cms/js/fcui-schema5-draft.js';
import { Schema5WidgetSession } from '../www/fhem-cms/js/fcui-schema5-widget-session.js';
const result = document.querySelector('#result');
let checks = 0;
const check = (condition, name) => { checks++; if (!condition) throw new Error(name); };
const equal = (actual, expected, name) => check(JSON.stringify(actual) === JSON.stringify(expected),
  `${name}: ${JSON.stringify(actual)} !== ${JSON.stringify(expected)}`);
const pause = () => new Promise(resolve => setTimeout(resolve, 50));
const fail = error => { result.dataset.result = 'fail'; result.textContent = error.stack || String(error); };
const pages = [{ id: 'home', title: 'Startseite' }, { id: 'solar', title: 'Solar' }];
const image = `media/${'a'.repeat(32)}.png`;
const initial = { id: 'links', type: 'fhem-link', title: 'Meine Links', showTitle: true,
  grid: { col: 3, row: 5, w: 6, h: 4 }, links: [
    { id: 'one', kind: 'internal', page: 'solar', text: 'Zur Solarseite', showText: true,
      textPosition: 'above', target: 'self', grid: { col: 1, row: 1, w: 4, h: 3 } },
    { id: 'two', kind: 'external', url: 'https://example.test/energy', text: 'Energie',
      showText: true, textPosition: 'overlay', target: 'tab', grid: { col: 1, row: 4, w: 4, h: 3 } },
  ] };
let saved;
let writes = 0;
let deletes = 0;
let picks = 0;
let saveError = false;
let mediaError = false;
let widget;
const services = { pages,
  saveWidget: async value => {
    if (saveError) throw new Error('Test: Schreiben fehlgeschlagen');
    saved = structuredClone(value); writes++;
  },
  deleteWidget: async id => { equal(id, 'links', 'delete binds outer ID'); deletes++; },
  pickAsset: async ({mode, owner}) => {
    if (mediaError) throw new Error('Test: Medien nicht verfügbar');
    check(owner === widget.shadowRoot, 'asset picker bound to widget lifecycle');
    picks++;
    return { image: mode === 'image', href: mode === 'image' ? image : `../../fhemcms-assets/CMS/${'b'.repeat(32)}` };
  },
};
const $ = selector => widget.shadowRoot.querySelector(selector);
function field(key, value) {
  const input = $(`[data-field="${key}"]`);
  check(Boolean(input), `field ${key} exists`);
  if (input.type === 'checkbox') input.checked = value;
  else input.value = value;
  input.dispatchEvent(new Event(input.tagName === 'SELECT' || input.type === 'checkbox' ? 'change' : 'input'));
}
async function click(selector) { $(selector).click(); await pause(); }
try {
  widget = document.createElement('cms-link');
  widget.services = services;
  widget.config = structuredClone(initial);
  widget.setAttribute('view-only', '');
  document.body.prepend(widget);
  check($('[data-title]').textContent === initial.title, 'title rendered');
  check(getComputedStyle($('[data-title]')).fontWeight === '400', 'shared lightweight title');
  check($('[data-open-config]').getClientRects().length === 0, 'live view has no configuration button');
  check($('[data-links]').children.length === 2, 'two links rendered');
  const internal = $('[data-links]').children[0];
  equal(internal.getAttribute('href'), '#/solar', 'internal CMS route');
  equal(internal.target, '_self', 'internal link same window');
  internal.click();
  equal(location.hash, '#/solar', 'internal link really changes route without opening a window');
  const external = $('[data-links]').children[1];
  equal(external.target, '_blank', 'external new tab');
  check(external.rel.includes('noopener') && external.rel.includes('noreferrer'), 'new tabs isolate opener');
  equal(external.getAttribute('href'), initial.links[1].url, 'external URL retained');
  const open = window.open;
  let opened;
  window.open = (...args) => { opened = args; return null; };
  widget.config = { ...structuredClone(initial), links: [{ ...initial.links[1], target: 'window' }] };
  $('[data-links] a').click();
  equal(opened.slice(0, 2), [initial.links[1].url, '_blank'], 'window target URL');
  check(opened[2].includes('popup') && opened[2].includes('noopener'), 'separate window requested safely');
  check(!$('[data-view-error]').textContent, 'noopener null return does not falsely report a blocked popup');
  window.open = open;
  for (const textPosition of ['above', 'overlay', 'below']) for (const showText of [true, false]) {
    widget.config = { ...structuredClone(initial), links: [{ ...initial.links[0], image, textPosition, showText }] };
    const tile = $('[data-links] a');
    equal(tile.dataset.position, textPosition, 'text position');
    equal(tile.querySelectorAll('.link-text').length, Number(showText), 'text visibility');
    check(tile.querySelector('img').getAttribute('src') === image, 'optional image');
    await tile.querySelector('img').decode();
    check(tile.querySelector('img').naturalWidth > 0, 'local image is really loaded and decodable');
    equal(tile.getAttribute('aria-label'), initial.links[0].text, 'hidden text keeps accessible link label');
    if (showText && textPosition === 'below') equal(getComputedStyle(tile.querySelector('.link-text')).order, '1', 'text below image');
    if (showText && textPosition === 'overlay') equal(getComputedStyle(tile.querySelector('.link-text')).position, 'absolute', 'text integrated into image');
  }
  for (const viewport of [320, 720]) {
    widget.style.width = `${viewport}px`;
    widget.config = { ...structuredClone(initial), links: [{ ...initial.links[0],
      grid: { col: 7, row: 9, w: 4, h: 3 } }] };
    const tile = $('[data-links] a').getBoundingClientRect();
    const box = $('[data-links]').getBoundingClientRect();
    check(tile.width >= box.width * .95 && tile.height >= box.height * .95,
      'single offset link fills its occupied area without empty outer grid tracks');
    equal($('[data-links] a').style.gridColumn, '1 / span 4', 'leading empty columns trimmed for display');
    equal($('[data-links] a').style.gridRow, '1 / span 3', 'leading empty rows trimmed for display');
  }
  widget.style.width = '';
  widget.config = structuredClone(initial);
  await widget.openConfig();
  check($('[data-dialog]').open && widget.grid, 'nested Gridstack opened');
  equal(widget.grid.opts.column, 12, 'own 12-column raster');
  check(!$('[data-geometry]') && !$('input[type=number]'), 'placement is purely graphical');
  check(getComputedStyle($('[data-grid]')).backgroundImage.includes('linear-gradient'), 'fine grid always visible in tile editor');
  equal(widget.grid.engine.nodes.length, 2, 'all nested tiles mounted');
  field('text', 'Geänderter Linktext');
  field('kind', 'external');
  field('url', 'javascript:alert(1)');
  await widget.save();
  equal(writes, 0, 'invalid URL never saved');
  check($('[data-error]').textContent.includes('HTTP'), 'invalid URL reported');
  field('url', 'https://example.test/path');
  field('target', 'self');
  field('textPosition', 'below');
  field('showText', false);
  check($('[data-field=textPosition]').disabled, 'text position inactive while text hidden');
  field('showText', true);
  await click('[data-media]');
  equal(picks, 1, 'image opens shared asset picker');
  equal(widget.links[0].image, image, 'selected image attached to selected tile');
  const firstTile = () => [...$('[data-grid]').children]
    .find(item => item.gridstackNode.id === widget.links[0].id).querySelector('.grid-stack-item-content');
  check(firstTile().style.backgroundImage.includes(image), 'selected image immediately appears on the dialog grid tile');
  equal(getComputedStyle(firstTile()).backgroundSize, 'cover', 'dialog grid image covers the tile');
  equal(getComputedStyle(firstTile().querySelector('.choose')).color, 'rgb(255, 255, 255)',
    'grid selection button stays readable over the image');
  await click('[data-clear-image]');
  check(!Object.hasOwn(widget.links[0], 'image'), 'image removable');
  equal(firstTile().style.backgroundImage, '', 'removing image also clears the grid preview');
  await click('[data-media]');
  mediaError = true;
  await click('[data-media]');
  check($('[data-error]').textContent.includes('Medien nicht verfügbar'), 'media failure visible');
  mediaError = false;
  saveError = true;
  await widget.save();
  check($('[data-dialog]').open, 'save failure keeps dialog open');
  check($('[data-error]').textContent.includes('Schreiben fehlgeschlagen'), 'write failure visible');
  equal(writes, 0, 'failed save not counted');
  saveError = false;
  await widget.save();
  equal(writes, 1, 'one successful save');
  equal(saved.grid, initial.grid, 'nested editing never changes outer placement');
  equal(saved.links[0].text, 'Geänderter Linktext', 'text saved');
  equal(saved.links[0].target, 'self', 'target saved');
  equal(saved.links[0].textPosition, 'below', 'text placement saved');
  check(!$('[data-dialog]').open && !widget.grid, 'save destroys nested grid');
  widget.config = structuredClone(saved);
  await widget.openConfig();
  equal(widget.links, saved.links, 'reopen preserves all fields');
  check(firstTile().style.backgroundImage.includes(image), 'saved image returns on the raster when reopening');
  field('kind', 'asset');
  await click('[data-document]');
  equal(widget.links[0].asset, `../../fhemcms-assets/CMS/${'b'.repeat(32)}`, 'document chosen from shared asset picker');
  equal(widget.links[0].target, 'self', 'document link default');
  await click('[data-add]');
  equal(widget.links.length, 3, 'link added');
  await click('[data-remove-link]');
  equal(widget.links.length, 2, 'selected link removed');
  const beforeCancel = structuredClone(widget.config);
  field('text', 'Nur lokal');
  await click('[data-cancel]');
  equal(widget.config, beforeCancel, 'cancel leaves saved configuration unchanged');
  equal(writes, 1, 'cancel does not write');
  const live = { schemaVersion: 5, settings: { layoutMode: 'grid', gridColumns: 12 },
    navigation: { orientation: 'horizontal', grid: { col: 1, row: 1, w: 12, h: 1 } },
    pages: pages.map(page => ({ ...page, widgets: page.id === 'home' ? [{ ...structuredClone(initial),
      grid: { col: 3, row: 5, w: 4, h: 7 } },
      { id: 'neighbor', type: 'text', html: 'Do not move', grid: { col: 3, row: 12, w: 6, h: 2 } }] : [] })) };
  let state = { live, draft: null, token: 'a'.repeat(64) };
  let retryWrites = 0;
  const controller = new Schema5DraftController({
    read: async () => structuredClone(state),
    save: async draft => { retryWrites++; state = { live, draft, token: 'b'.repeat(64) }; },
    publish: async () => {}, discard: async () => {},
  });
  await controller.reload();
  const session = new Schema5WidgetSession({ controller, pageId: 'home', token: state.token,
    widget: live.pages[0].widgets[0], action: 'update' });
  let completed = false;
  session.completion.then(() => { completed = true; });
  widget.services = session.services(services);
  widget.config = session.widget;
  await widget.openConfig();
  await click('[data-add]');
  field('text', 'Keep my new link');
  await widget.save();
  check($('[data-dialog]').open && widget.grid, 'real local collision retains dialog and GridStack');
  check(!completed, 'local collision does not trigger panel completion');
  equal(retryWrites, 0, 'local collision never invokes transport');
  check($('[data-error]').textContent.includes('nichts gespeichert'), 'collision explains no write took place');
  equal($('[data-field=text]').value, 'Keep my new link', 'new link text survives rejected save');
  equal(widget.links.length, 3, 'new link remains editable after collision');
  await click('[data-remove-link]');
  await widget.save();
  check(completed && !$('[data-dialog]').open, 'corrected layout saves in the same session and closes normally');
  equal(retryWrites, 1, 'retry writes exactly once');
  equal(state.draft.pages[0].widgets[0].grid, { col: 3, row: 5, w: 4, h: 7 }, 'retry persists fitted geometry');
  equal(state.draft.pages[0].widgets[1], live.pages[0].widgets[1], 'retry leaves neighboring widget unchanged');
  const existing = { ...structuredClone(initial), title: 'Existing links',
    grid: { col: 1, row: 27, w: 40, h: 23 }, links: [1, 2, 3].map(number => ({
      ...structuredClone(initial.links[0]), id: `link${number}`,
      grid: { col: 1 + (number - 1) * 4, row: 1, w: 4, h: 4 },
    })) };
  const live96 = { ...structuredClone(live), settings: { layoutMode: 'grid', gridColumns: 96 },
    navigation: { orientation: 'horizontal', grid: { col: 1, row: 1, w: 92, h: 4 } } };
  live96.pages[0].widgets = [existing,
    { id: 'side', type: 'text', html: 'Keep side', grid: { col: 72, row: 23, w: 13, h: 12 } },
    { id: 'below', type: 'text', html: 'Keep below', grid: { col: 27, row: 50, w: 45, h: 12 } }];
  let state96 = { live: live96, draft: null, token: 'c'.repeat(64) };
  let writes96 = 0;
  const controller96 = new Schema5DraftController({
    read: async () => structuredClone(state96),
    save: async (draft, token) => {
      equal(token, state96.token, '96-column writes remain state-bound');
      writes96++;
      state96 = { live: live96, draft, token: String(writes96).padStart(64, '0') };
    },
    publish: async () => {}, discard: async () => {},
  });
  await controller96.reload();
  for (const add of [false, true]) {
    const current = (state96.draft || state96.live).pages[0].widgets[0];
    const session96 = new Schema5WidgetSession({ controller: controller96, pageId: 'home',
      token: state96.token, widget: current, action: 'update' });
    let completed96 = false;
    session96.completion.then(() => { completed96 = true; });
    widget.services = session96.services(services);
    widget.config = session96.widget;
    await widget.openConfig();
    if (add) {
      await click('[data-add]');
      field('text', 'Keep fourth link');
      await click('[data-media]');
      await widget.save();
      check($('[data-dialog]').open && widget.grid && !completed96,
        '96-column fourth link collision preserves the actual dialog');
      equal(writes96, 1, 'colliding fourth link never writes');
      equal($('[data-field=text]').value, 'Keep fourth link', 'fourth link text survives');
      equal(widget.links[3].image, image, 'fourth link image survives');
      check($('[data-error]').textContent.includes('nichts gespeichert'),
        'actual lack of vertical space remains explicit');
      widget.links.forEach((item, index) => {
        const wrapper = [...$('[data-grid]').children].find(entry => entry.gridstackNode.id === item.id);
        widget.grid.update(wrapper, { x: index * 3, y: 0, w: 3, h: 4 });
      });
    }
    await widget.save();
    check(completed96 && !$('[data-dialog]').open, '96-column dialog saves and closes normally');
    equal(state96.draft.pages[0].widgets[0].grid, existing.grid,
      '96-column dialog preserves 40 by 23 outer geometry');
    equal(state96.draft.pages[0].widgets.slice(1), live96.pages[0].widgets.slice(1),
      '96-column save never moves neighbors');
    equal(state96.live, live96, '96-column dialog does not publish');
  }
  equal(writes96, 2, 'existing save and corrected fourth link each write once');
  equal(state96.draft.pages[0].widgets[0].links.length, 4, 'fourth link really persists');
  equal(state96.draft.pages[0].widgets[0].links[3].text, 'Keep fourth link', 'saved fourth link retains its input');
  equal(state96.draft.pages[0].widgets[0].links[3].image, image, 'saved fourth link retains its image');
  widget.services = services;
  widget.config = structuredClone(initial);
  await widget.openConfig();
  equal($('[data-field=targetMode]').value, 'page', 'existing internal links default to page navigation');
  field('targetMode', 'modal');
  field('modalSize', 'lg');
  equal(widget.links[0].targetMode, 'modal', 'modal mode set on internal link');
  equal(widget.links[0].modalSize, 'lg', 'modal size set on internal link');
  field('kind', 'external');
  check(!Object.hasOwn(widget.links[0], 'targetMode') && !Object.hasOwn(widget.links[0], 'modalSize'),
    'switching link kind removes modal fields');
  await click('[data-cancel]');
  widget.config = structuredClone(initial);
  await widget.openConfig();
  field('targetMode', 'modal');
  field('modalSize', 'sm');
  window.linkRegression = {
    points(kind) {
      const wrappers = [...$('[data-grid]').children];
      wrappers[kind === 'resize' ? 1 : 0].scrollIntoView({ block: 'center' });
      const rect = wrappers[0].querySelector('.handle').getBoundingClientRect();
      const handle = wrappers[1].querySelector('.ui-resizable-se').getBoundingClientRect();
      const cell = $('[data-grid]').getBoundingClientRect().width / 12;
      const hit = widget.shadowRoot.elementFromPoint(handle.x + handle.width / 2, handle.y + handle.height / 2);
      if (kind === 'resize') check(handle.width > 0 && hit?.classList.contains('ui-resizable-se'),
        `resize handle is reachable: ${JSON.stringify({ handle: handle.toJSON(), hit: hit?.className,
          canvas: $('.canvas').getBoundingClientRect().toJSON(), style: $('[data-grid]').style.cssText,
          rows: widget.grid.getRow(), cellHeight: widget.grid.opts.cellHeight,
          nodes: widget.grid.save(false) })}`);
      return { drag: { x: rect.x + rect.width / 2, y: rect.y + rect.height / 2 },
        resize: { x: handle.x + handle.width / 2, y: handle.y + handle.height / 2 }, cell };
    },
    async finish() {
      try {
        widget.syncGrid();
        equal(widget.links[0].grid.col, 5, 'real drag moves tile four columns');
        equal(widget.links[0].grid.row, 1, 'drag keeps row');
        equal(widget.links[1].grid.w, 6, 'real corner resize adds two columns');
        equal(widget.links[1].grid.h, 4, 'real corner resize adds one row');
        const geometry = widget.links.map(link => structuredClone(link.grid));
        await widget.save();
        equal(writes, 2, 'drag and resize saved once together');
        equal(saved.links.map(link => link.grid), geometry, 'all dragged/resized positions saved');
        equal(saved.grid, initial.grid, 'outer raster unchanged after actual drag');
        equal(saved.links[0].targetMode, 'modal', 'modal setting saved');
        equal(saved.links[0].modalSize, 'sm', 'modal size saved');
        const fitted = fitLinkWidget(saved, 12, pages);
        equal(fitted.grid, { col: 3, row: 5, w: 8, h: 8 },
          'outer size follows dragged/resized tiles and visible title');
        const previousView = structuredClone(widget.config);
        widget.config = fitted;
        const view = $('[data-links]').getBoundingClientRect();
        for (const tile of $('[data-links]').children) {
          const rect = tile.getBoundingClientRect();
          check(rect.left >= view.left - 1 && rect.right <= view.right + 1
            && rect.top >= view.top - 1 && rect.bottom <= view.bottom + 1,
          'all links fit the rendered occupied area');
        }
        widget.config = previousView;
        widget.config = structuredClone(saved);
        await widget.openConfig();
        equal($('[data-field=targetMode]').value, 'modal', 'modal setting survives reopening');
        equal($('[data-field=modalSize]').value, 'sm', 'modal size survives reopening');
        widget.syncGrid();
        equal(widget.links.map(link => link.grid), geometry, 'drag and resize survive reopening');
        await widget.removeWidget();
        equal(deletes, 1, 'widget deletion uses existing service');
        check(!widget.grid, 'delete cleans grid');
        await widget.openConfig({ isNew: true });
        check($('[data-delete]').hidden, 'unsaved new widget cannot delete an existing widget');
        await widget.removeWidget();
        equal(deletes, 1, 'new widget deletion refused');
        widget.remove();
        check(!widget.grid && !$('[data-dialog]').open, 'disconnect closes dialog and destroys Gridstack');
        result.dataset.result = 'pass'; result.textContent = JSON.stringify({ checks });
      } catch (error) { fail(error); }
    },
  };
  result.dataset.ready = 'true';
} catch (error) { fail(error); }
</script>
</html>
