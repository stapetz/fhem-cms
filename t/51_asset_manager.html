<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Shared Assetmanager regression</title>
<pre id="result"></pre>
<script type="module">
import { openAssetManager } from '../www/fhem-cms/js/asset-manager.js';
import { createEditor, cleanHtml } from '../www/fhem-cms/js/richtext.js';
const result = document.querySelector('#result');
let checks = 0;
const check = (condition, name) => { checks++; if (!condition) throw new Error(name); };
const equal = (actual, expected, name) => check(JSON.stringify(actual) === JSON.stringify(expected), `${name}: ${JSON.stringify(actual)}`);
const pause = () => new Promise(resolve => setTimeout(resolve, 30));
let revision = 1;
const image = { id: 'a'.repeat(32), name: 'Solar.png', file: `${'a'.repeat(32)}.png`,
  href: `media/${'a'.repeat(32)}.png`, bytes: 100, image: true, folder: 'root' };
const pdf = { id: 'b'.repeat(32), name: 'Anleitung.pdf', file: `${'b'.repeat(32)}.bin`,
  href: `../../fhemcms-assets/CMS/${'b'.repeat(32)}`, bytes: 200, image: false, folder: 'root' };
let state = { token: String(revision).padStart(64, '0'), folders: [], assets: [image, pdf], totalBytes: 300,
  policy: { imageBytes: 3145728, documentBytes: 20971520, totalBytes: 524288000,
    types: { png: true, jpg: true, gif: true, pdf: true, docx: true } } };
let inUse = true;
let failList = false;
let deleteCalls = 0;
let uploads = 0;
const uploadedFolders = [];
let pickerModes = [];
const actions = [];
let ignoreMove = false;
const tick = () => {
  state.token = String(++revision).padStart(64, '0');
  state.totalBytes = state.assets.reduce((sum, asset) => sum + asset.bytes, 0);
  return structuredClone(state);
};
const services = {
  async assetAction(request) {
    actions.push(request.op);
    if (request.op === 'list') {
      if (failList) throw new Error('Test: Assetkatalog nicht erreichbar');
      return structuredClone(state);
    }
    if (request.op === 'usage') return { usage: inUse ? [
      { source: 'Live', page: 'solar', pageTitle: 'Solaranlage', widget: 'text1', title: 'Text' },
      { source: 'Entwurf', page: 'start', pageTitle: 'Startseite', widget: 'links1', title: 'Links' },
    ] : [] };
    check(request.token === state.token, 'mutations bind current catalog token');
    if (request.op === 'mkdir') state.folders.push({ id: String(state.folders.length + 1).repeat(32), name: request.name, parent: request.parent });
    else if (request.op === 'folder') Object.assign(state.folders.find(item => item.id === request.id), { name: request.name, parent: request.parent });
    else if (request.op === 'rmdir') state.folders = state.folders.filter(item => item.id !== request.id);
    else if (request.op === 'move') {
      if (!ignoreMove) Object.assign(state.assets.find(item => item.id === request.id), { name: request.name, folder: request.folder });
    }
    else if (request.op === 'policy') state.policy = structuredClone(request.policy);
    else if (request.op === 'delete') { deleteCalls++; state.assets = state.assets.filter(item => item.id !== request.id); }
    else throw new Error(`Unknown operation ${request.op}`);
    return { state: tick() };
  },
  async uploadAsset(file, folder, token, options) {
    equal(token, state.token, 'upload bound to catalog token');
    check(file instanceof File, 'real File passed to shared uploader');
    uploadedFolders.push(folder);
    options.onProgress(file.size, file.size);
    if (file.name === 'Error.png') throw new Error('Test: Upload fehlgeschlagen');
    if (file.name === 'Abort.png') {
      await new Promise(resolve => setTimeout(resolve, 100));
      if (options.signal.aborted) throw new Error('Upload abgebrochen');
    }
    const item = { ...structuredClone(image), id: (12 + uploads).toString(16).padStart(32, '0'), name: file.name, folder };
    state.assets.push(item); uploads++;
    return { state: tick(), selected: item.id };
  },
};
services.pickAsset = options => { pickerModes.push(options.mode); return openAssetManager(services, options); };
const manager = owner => owner.querySelector('[data-asset-manager]').shadowRoot;
const click = async (root, selector) => { root.querySelector(selector).click(); await pause(); };
const set = (root, selector, value, event = 'input') => {
  const input = root.querySelector(selector); input.value = value; input.dispatchEvent(new Event(event));
};
const createFolder = async (root, name) => {
  await click(root, '[data-mkdir]');
  set(root, '[data-folder-create] [data-folder-name]', name);
  await click(root, '[data-folder-create-accept]');
};
try {
  let pending = openAssetManager(services);
  await pause();
  let root = manager(document);
  check(root.querySelector('[data-assets-dialog]').open, 'manager opens as modal');
  check(root.querySelectorAll('[data-asset-id]').length === 2, 'images and documents share catalog');
  check(root.querySelector('[data-select]').hidden, 'File menu management has no insertion action');

  check(root.querySelector('[data-mkdir]').compareDocumentPosition(root.querySelector('[data-assets]')) & Node.DOCUMENT_POSITION_FOLLOWING,

  check(root.querySelector('[data-detail]').hidden, 'empty details never reserve space in overview');
  equal(Math.round(root.querySelector('[data-assets]').getBoundingClientRect().width),

  const thumb = root.querySelector('img');
  await thumb.decode();
  check(thumb.naturalWidth > 0, 'asset thumbnails really load');
  await click(root, `[data-asset-id="${image.id}"]`);

  check(preview.naturalWidth > 0, 'selected image is displayed again in details');
  equal(root.querySelector('[data-image-preview] a').title, 'Bild in voller Größe anschauen', 'full size preview has requested hover text');
  check(!root.querySelector('[data-confirm-delete]'), 'no persistent delete checkbox');

  } finally { window.fetch = nativeFetch; }

  await click(root, '[data-usage-button]');

  await click(root, '[data-delete-folder-accept]');

  equal(root.querySelector('[data-asset-suffix]').textContent, '.png', 'file extension is outside editable input');
  const nameInput = root.querySelector('[data-asset-name]');
  check(nameInput.closest('label').nextElementSibling.matches('[data-rename]'), 'rename button directly follows filename');
  set(root, '[data-asset-name]', 'Neuer Name');
  await click(root, '[data-rename]');
  equal(state.assets[0].name, 'Neuer Name.png', 'rename keeps exact original extension');
  equal(state.assets[0].folder, 'root', 'rename does not move file');
  set(root, '[data-asset-name]', 'Nicht speichern');
  await click(root, '[data-choose-destination]');
  check(root.querySelector('[data-folder-picker]').open, 'move destination opens a visual folder picker');
  check(root.querySelector(`[data-folder-preview="${image.id}"]`), 'destination picker shows folder contents too');
  await click(root, `[data-folder-picker] [data-open-folder="${folder}"]`);
  await click(root, '[data-folder-cancel]');
  equal(state.assets[0].folder, 'root', 'cancelling picker never moves asset');
  ignoreMove = true;
  await click(root, '[data-choose-destination]');
  await click(root, `[data-folder-picker] [data-open-folder="${folder}"]`);
  await click(root, '[data-folder-accept]');
  check(root.querySelector('[data-status]').textContent.includes('nicht übernommen'), 'unconfirmed move is an explicit error');
  equal(state.assets[0].folder, 'root', 'unconfirmed move leaves asset in its original folder');

  await click(root, '[data-choose-destination]');

  await click(root, '[data-folder-accept]');
  equal(state.assets[0].folder, folder, 'asset moved logically');
  equal(state.assets[0].name, 'Neuer Name.png', 'moving never applies an unsaved rename');
  equal(state.assets[0].href, image.href, 'moving does not break saved path');
  check(root.querySelector('[data-status]').textContent.includes('gespeichert in'), 'successful move explicitly names destination');
  check(root.querySelector(`[data-asset-id="${image.id}"]`), 'successful move follows image into destination folder');
  await click(root, '[data-reload]');
  check(root.querySelector(`[data-asset-id="${image.id}"]`), 'moved image remains visible after reload');
  await click(root, '[data-path] [data-path-folder="root"]');
  await click(root, `[data-edit-folder="${folder}"]`);
  await click(root, '[data-rmdir]');
  check(root.querySelector('[data-status]').textContent.includes('nicht gelöscht'), 'nonempty folder is never deleted');
  equal(state.folders.length, 1, 'nonempty folder and contents preserved');
  await click(root, `[data-open-folder="${folder}"]`);
  const transfer = new DataTransfer();
  transfer.items.add(new File(['image'], 'Upload.png', { type: 'image/png' }));
  transfer.items.add(new File(['image2'], 'Upload2.png', { type: 'image/png' }));
  check(root.querySelector('[data-upload]').multiple, 'native file chooser allows multiple selection');
  root.querySelector('[data-upload]').files = transfer.files;
  root.querySelector('[data-upload]').dispatchEvent(new Event('change'));
  await pause();
  equal(uploads, 2, 'file chooser uploads all selected files');
  equal(state.assets.at(-1).folder, folder, 'upload goes directly to selected folder');
  equal(uploadedFolders, [folder, folder], 'all chosen images use current folder');
  check(root.querySelector('[data-detail]').hidden, 'batch upload never opens details');
  check(!root.querySelector('[data-rename]') && !root.querySelector('[data-choose-destination]'), 'upload does not offer unneeded move controls');
  check(root.querySelector('[data-status]').textContent.includes('Upload abgeschlossen'), 'upload success visible');
  const drop = async names => {
    const dataTransfer = new DataTransfer();
    for (const name of names) dataTransfer.items.add(new File(['dropped'], name, { type: 'image/png' }));
    const zone = root.querySelector('[data-assets]');
    const over = new DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer });
    zone.dispatchEvent(over);
    check(over.defaultPrevented, 'file drag prevents browser navigation');
    check(zone.classList.contains('drag-over'), 'drop area highlights for files');
    const event = new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer });
    zone.dispatchEvent(event); await pause();
    check(event.defaultPrevented, 'drop prevents opening files in browser');
    check(!zone.classList.contains('drag-over'), 'drop removes highlight');
  };
  await drop(['Drop.png', 'Drop2.png']);
  equal(uploads, 4, 'drop uploads multiple files through shared service');
  check(uploadedFolders.every(id => id === folder), 'drop also uses currently opened folder');
  check(root.querySelector('[data-detail]').hidden, 'drop leaves overview without details');
  await drop(['Error.png', 'NotStarted.png']);
  equal(uploads, 4, 'failed batch stops before later files');
  check(root.querySelector('[data-status]').textContent.includes('0/2'), 'failure reports completed count');
  await drop(['Abort.png', 'NotStarted.png']);
  await click(root, '[data-abort]'); await new Promise(resolve => setTimeout(resolve, 120));

  check(root.querySelector('[data-status]').textContent.includes('abgebrochen'), 'cancellation visible');
  check(root.querySelector('[data-detail]').hidden, 'error and cancellation do not reopen details');
  root.querySelector('[data-type=pdf]').checked = false;
  set(root, '[data-limit=documentBytes]', '30');
  set(root, '[data-limit=totalBytes]', '600');
  await click(root, '[data-policy]');
  equal(state.policy.types.pdf, false, 'type can be disabled');
  equal(state.policy.documentBytes, 30 * 1048576, 'document quota configurable');
  equal(state.policy.totalBytes, 600 * 1048576, 'total quota configurable');
  check(state.assets.some(asset => asset.id === pdf.id), 'disabling a type does not delete existing documents');
  set(root, '[data-new-type]', 'epub');
  await click(root, '[data-add-type]');
  check(state.policy.types.epub, 'new passive extension enabled');
  set(root, '[data-new-type]', 'svg');
  await click(root, '[data-add-type]');
  check(!state.policy.types.svg, 'active types cannot be added');
  check(root.querySelector('[data-status]').classList.contains('error'), 'invalid admin setting explicitly reported');
  inUse = false;
  const uploaded = state.assets.filter(item => item.id !== image.id && item.id !== pdf.id);
  for (const item of uploaded.slice(1)) {
    await click(root, `[data-asset-id="${item.id}"]`);
    await click(root, '[data-delete-asset]');
    await click(root, '[data-delete-asset-accept]');
  }
  const beforeDelete = deleteCalls;
  await click(root, `[data-asset-id="${uploaded[0].id}"]`);

  check(root.querySelector('[data-asset-delete]').open, 'delete button opens confirmation');

  await click(root, '[data-delete-asset]');
  await click(root, '[data-delete-asset-accept]');
  equal(deleteCalls, beforeDelete + 1, 'confirmed unused asset deleted');

  check(!document.querySelector('[data-asset-manager]'), 'manager DOM cleaned up');
  pending = openAssetManager(services, { mode: 'image' });
  await pause(); root = manager(document);
  await click(root, `[data-open-folder="${folder}"]`);
  equal(root.querySelectorAll('[data-asset-id]').length, 1, 'image picker filters out documents');
  await click(root, `[data-asset-id="${image.id}"]`);
  await click(root, '[data-select]');
  equal((await pending).href, image.href, 'image selection returns stable address');
  pending = openAssetManager(services, { mode: 'document' });
  await pause(); root = manager(document);

  await click(root, '[data-close]'); await pending;
  const host = document.createElement('div'); document.body.append(host);

  pending = openAssetManager(services);

  const mutationsBeforePointer = actions.filter(op => !['list', 'usage'].includes(op)).length;

        equal(uploaded.folder, 'd'.repeat(32), 'real browser drop uses currently opened nested folder');
      }
      check(root.querySelector('[data-detail]').hidden, 'real drop closes details even after image move');
      check(root.querySelector('[data-status]').textContent.includes('Unterordner'), 'real drop names current location');
      await click(root, '[data-reload]');
      check(root.querySelector(`[data-asset-id="${image.id}"]`), 'real pointer move persists after reload');
      await click(root, '[data-close]'); await pending;
      result.dataset.result = 'pass'; result.textContent = JSON.stringify({ checks });
    },
  };
  result.dataset.ready = 'true';
} catch (error) {
  result.dataset.result = 'fail'; result.textContent = error.stack || String(error);
}
</script>
</html>
