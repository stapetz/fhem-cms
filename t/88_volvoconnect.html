<!doctype html>
<html lang="de" data-cms-theme="liquid-glass">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolvoConnect — natives Fahrzeugwidget</title>
<link rel="stylesheet" href="../www/fhem-cms/css/fhem-cms.css">
<link rel="stylesheet" href="../www/fhem-cms/css/fcui-gridstack.css">
<style>
body { margin:0; padding:16px; }
.cms-shell { margin:0; }
#mount > cms-volvoconnect { width:100%; --cms-widget-height:auto; --cms-widget-containment:inline-size; }
.grid-stack-animate,.grid-stack-animate .grid-stack-item { transition:none !important; }
#result { white-space:pre-wrap; }
</style>
<div class="cms-shell"><div id="mount"></div></div><pre id="result">RUNNING</pre>
<script type="module">
import { createWidgetElement, dataFor, devicesOf, isLiveWidget } from '../www/fhem-cms/js/widget-factory.js';
import { volvoGroups } from '../www/fhem-cms/js/volvoconnect.js';
import { blueprintDevices, remapBlueprintDevice } from '../www/fhem-cms/js/fcui-schema5-blueprints.js';
import { setLiquidAppearance } from '../www/fhem-cms/js/fcui-schema5-appearance.js';
import { GridStack } from '../www/fhem-cms/js/fcui-runtime.js';
import { mountSchema5Widgets } from '../www/fhem-cms/js/fcui-schema5-widgets.js';

const output = document.querySelector('#result');
let checks = 0;
const check = (condition, message) => { if (!condition) throw new Error(message); checks++; };
const pause = () => new Promise(resolve => setTimeout(resolve, 60));
const mount = document.querySelector('#mount');
const widget = { id:'car', type:'fhem-volvoconnect', title:'VolvoConnect',
  device:'Car', grid:{ col:1, row:2, w:12, h:18 } };
const values = {
  state:'authenticated', vehicle_descriptions_model:'Volvo EX40', vehicle_modelYear:'2027',
  vehicle_externalColour:'Crystal White Pearl', state_batteryChargeLevel:'83',
  state_batteryChargeLevel_unit:'percentage', state_electricRange:'320', state_electricRange_unit:'km',
  state_chargingStatus:'DONE', state_chargingType:'NONE', state_chargerConnectionStatus:'DISCONNECTED',
  state_chargingCurrentLimit:'32', state_chargingCurrentLimit_unit:'ampere',
  state_targetBatteryChargeLevel:'100', state_targetBatteryChargeLevel_unit:'percentage',
  state_estimatedChargingTimeToTargetBatteryChargeLevel:'0',
  state_estimatedChargingTimeToTargetBatteryChargeLevel_unit:'minutes',
  odometer_odometer:'1459', odometer_odometer_unit:'km',
  engine_engineStatus:'STOPPED', doors_centralLock:'LOCKED', windows_frontLeftWindow:'CLOSED',
  brakes_brakeFluidLevelWarning:'NO_WARNING', workshopDiagnostics_washerFluidLevelWarning:'NO_WARNING',
  lastUpdate:'2026-11-14 16:00:00',
};
for (const [prefix] of volvoGroups) values[`${prefix}_exampleValue`] = 'Test';
const snapshots = () => new Map([['Car', [{ name:'Car', type:'VolvoConnect', readings:{...values},
  sets:'lock unlock climate:noArg climate_stop:noArg charge_start charge_stop horn' }]]]);
const saved = [], commands = [];
const services = { listAllDevices:async () => [{name:'Car',type:'VolvoConnect',readings:values}],
  saveWidget:async value => saved.push(value), deleteWidget:async () => {},
  setCommand:async (...args) => commands.push(args) };
const host = createWidgetElement(widget, services, snapshots(), true);
mount.append(host);
const $ = selector => host.shadowRoot.querySelector(selector);
try {
  await pause();
  check(host.localName === 'cms-volvoconnect', 'factory creates native VolvoConnect');
  check(isLiveWidget(widget), 'widget subscribes to live updates');
  check(devicesOf(widget).join() === 'Car', 'only selected vehicle is subscribed');
  check(dataFor(widget, snapshots())[0].name === 'Car', 'single-device snapshot is supplied');
  check(blueprintDevices(widget).join() === 'Car', 'blueprint detects vehicle');
  check(remapBlueprintDevice(widget, 'Car', 'Other').device === 'Other', 'blueprint remaps only vehicle');
  check($('.soc').textContent === '83%', 'battery charge hero matches module reading');
  check($('.range').textContent.includes('320 km'), 'range hero uses module unit');
  check($('[role=meter]').getAttribute('aria-valuenow') === '83', 'battery meter matches value');
  check($('[data-content]').querySelectorAll('section.card').length === 1, 'compact tile contains only energy/range block');
  check(!$('[data-content] dl') && !$('[data-content] img'), 'details and gallery stay out of compact tile');
  check(!$('[data-details]').open && !$('[data-detail-content]').childElementCount,
    'closed popup does not build hidden detail resources');
  check($('[data-info]').getAttribute('aria-haspopup') === 'dialog', 'info button announces a popup');
  check($('[data-info]').parentElement === $('[data-open-actions]').parentElement
    && $('[data-info]').nextElementSibling === $('[data-open-actions]'), 'info and actions sit adjacent in right toolbar');
  check($('.connected').textContent === '✓' && $('.connected').getAttribute('aria-label') === 'API: Verbunden',
    'compact tile shows accessible connected check');
  const toolbar = $('.hero-tools').getBoundingClientRect();
  const heading = $('.hero-heading').getBoundingClientRect();
  check(Math.abs(toolbar.right - heading.right) <= 1, 'compact toolbar is right-aligned');
  for (const button of [$('[data-info]'), $('[data-open-actions]')]) {
    const style = getComputedStyle(button);
    check(style.borderWidth === '0px' && style.backgroundColor === 'rgba(0, 0, 0, 0)' && style.boxShadow === 'none',
      'launchers are graphical symbols without square backgrounds or frames');
    check(button.querySelector('svg')?.getAttribute('viewBox') === '0 0 24 24', 'launcher uses shared vector icon');
    check(button.querySelector('svg').getAttribute('aria-hidden') === 'true'
      && button.getAttribute('aria-label'), 'icon is decorative and button has accessible label');
    check(button.getBoundingClientRect().width === 48 && button.getBoundingClientRect().height === 48,
      'frameless icons preserve invisible 48px touch targets');
  }
  check(getComputedStyle($('[data-info] svg')).width === getComputedStyle($('[data-open-actions] svg')).width
    && getComputedStyle($('[data-info] svg')).height === getComputedStyle($('[data-open-actions] svg')).height
    && $('[data-info] svg').getAttribute('stroke-width') === $('[data-open-actions] svg').getAttribute('stroke-width'),
    'info and actions have equal icon size and stroke style');
  $('[data-info]').focus();
  $('[data-info]').click();
  check($('[data-details]').open && $('[data-info]').getAttribute('aria-expanded') === 'true',
    'info button opens full native modal');
  check($('[data-detail-title]').textContent === 'VolvoConnect - Fahrzeugdetails',
    'details heading uses configured vehicle name');
  host.config = {...widget,title:'Demo-Elch',showTitle:false};
  check($('[data-detail-title]').textContent === 'Demo-Elch - Fahrzeugdetails'
    && $('[data-actions-title]').textContent === 'Demo-Elch - Fahrzeugaktionen',
    'both modal headings use vehicle title even with hidden main heading');
  host.config = {...widget,title:''};
  check($('[data-detail-title]').textContent === 'Car - Fahrzeugdetails', 'missing title falls back to device name');
  host.config = {...widget,hiddenReadings:['state_batteryChargeLevel','state_electricRange','state_chargingCurrentLimit']};
  check($('.soc') && $('.range') && $('[role=meter]') && $('#reading-state_chargingCurrentLimit'),
    'legacy hidden energy preferences cannot conceal fixed energy readings');
  check(!$('.soc').closest('[data-reading-concealed]') && !$('#reading-state_chargingCurrentLimit').hasAttribute('data-reading-concealed'),
    'fixed energy values are not dimmed by legacy hidden settings');
  host.config = widget;
  check($('[data-detail-content]').textContent.includes('01:') === false, 'zero remaining time is not invented');
  check($('[data-detail-content]').textContent.includes('00:00 h'), 'real zero remains visible');
  check($('.badge').getAttribute('aria-label') === 'API: Verbunden' && $('.badge').textContent === '✓',
    'API state uses symbol with translated accessible description');
  check($('#footer').textContent.includes('14.11.2026 16:00:00'), 'last update is German date/time');
  const legacyEnergy = {...values};
  delete values.state_batteryChargeLevel;
  delete values.state_electricRange;
  values.fuel_batteryChargeLevel = '84';
  values.statistics_distanceToEmptyBattery = '310';
  values.statistics_distanceToEmptyBattery_unit = 'km';
  host.data = dataFor(widget,snapshots());
  check($('.soc').textContent === '84%' && $('.range').textContent.includes('310 km'),
    'Keycloak fuel/statistics readings appear in compact tile');
  for (const key of Object.keys(values)) delete values[key];
  Object.assign(values,legacyEnergy);
  host.data = dataFor(widget,snapshots());
  check($('[data-detail-content]').querySelectorAll('section.card').length >= 14, 'all module scopes appear');
  check(!$('#gallery'), 'missing image readings produce no empty gallery');
  check($('#group-engineDiagnostics').textContent.includes('Bremsflüssigkeitsstand'), 'diagnostics grouping follows module');
  check(!$('#group-brakes').textContent.includes('Bremsflüssigkeitsstand'), 'brake-fluid warning is not duplicated');
  check($('#reading-doors_centralLock .status-icon').textContent === '🔒', 'lock status uses dashboard symbol');
  check($('#reading-doors_centralLock dd').textContent === '🔒', 'lock has no duplicate visible status text');
  check($('#reading-brakes_brakeFluidLevelWarning .status-icon').textContent === '✓', 'normal fluid status uses dashboard check');
  check($('#reading-state_chargingCurrentLimit .reading-icon').textContent === '⚡', 'reading has semantic label symbol');
  const content = $('[data-content]');
  const socNode = $('.soc');
  content.scrollTop = 30;
  values.state_batteryChargeLevel = '84';
  host.data = dataFor(widget, snapshots());
  check($('.soc') === socNode && socNode.textContent === '84%', 'live values update without replacing nodes');
  check($('[data-content]') === content, 'content root remains stable');

  values.vehicle_images_exteriorImageUrl = `${location.origin}/t/media/${'a'.repeat(32)}.png`;
  values.vehicle_images_internalImageUrl = `${location.origin}/t/media/${'b'.repeat(32)}.png`;
  host.data = dataFor(widget, snapshots());
  check($('#gallery img') && $('#gallery').querySelectorAll('img').length === 2, 'gallery defaults on with both views');
  check($('#group-vehicle').nextElementSibling === $('#gallery'), 'gallery follows vehicle information in default order');
  const slides = $('.slides'), image = slides.querySelector('img');
  slides.scrollLeft = 100;
  const scroll = slides.scrollLeft;
  host.data = dataFor(widget, snapshots());
  check($('.slides') === slides && $('.slides img') === image, 'refresh retains gallery and image nodes');
  check(slides.scrollLeft === scroll, 'refresh does not reset gallery scroll');
  image.dispatchEvent(new Event('error'));
  host.data = dataFor(widget, snapshots());
  check($('.slides img').hidden && $('.slides figcaption').textContent.includes('nicht geladen'),
    'image load errors stay visible across refreshes');
  host.config = {...widget, showGallery:false};
  check(!$('#gallery'), 'gallery switch disables images');
  host.config = widget;
  check(Boolean($('#gallery')), 'gallery can be enabled again');
  for (const theme of ['light','dark','liquid-glass']) {
    document.documentElement.dataset.cmsTheme = theme;
    for (const width of [280,343,393,600,834,1200]) {
      mount.style.width = `${width}px`;
      await pause();
      const tile = $('[data-tile]');
      check(tile.scrollWidth <= tile.clientWidth + 1, `${theme}/${width}: no horizontal tile overflow`);
      check(tile.scrollHeight <= tile.clientHeight + 1, `${theme}/${width}: content-driven mobile height`);
      for (const section of host.shadowRoot.querySelectorAll('.tile section.card')) {
        const box = section.getBoundingClientRect(), outer = tile.getBoundingClientRect();
        check(box.left >= outer.left && box.right <= outer.right + 1, `${theme}/${width}: cards fit tile`);
      }
      const dialog = $('[data-details]'), body = $('[data-detail-body]');
      check(body.scrollWidth <= body.clientWidth + 1, `${theme}/${width}: popup has no horizontal scroller`);
      const bounds = dialog.getBoundingClientRect();
      check(bounds.top >= 0 && bounds.bottom <= innerHeight + 1 && bounds.left >= 0
        && bounds.right <= innerWidth + 1, 'popup stays inside viewport');
      check($('[data-close-details]').getBoundingClientRect().height >= 48, 'popup close has touch height');
      const bodyBounds = body.getBoundingClientRect();
      const cards = [...$('[data-detail-content]').querySelectorAll('section.card')];
      for (const card of cards) {
        const bounds = card.getBoundingClientRect();
        check(bounds.left >= bodyBounds.left && bounds.right <= bodyBounds.right + 1,
          `${theme}/${width}: detail card stays within popup width`);
        check(getComputedStyle(card).backgroundImage === getComputedStyle($('#group-state')).backgroundImage
          && getComputedStyle(card).border === getComputedStyle($('#group-state')).border
          && getComputedStyle(card).borderRadius === getComputedStyle($('#group-state')).borderRadius,
          `${theme}/${width}: every card including gallery matches energy card surface`);
      }
      for (const button of $('[data-detail-content]').querySelectorAll('button')) {
        check(button.getBoundingClientRect().height >= 48, 'popup actions retain touch height');
      }
      const gridCards = [...$('#top').children];
      const cardWidth = gridCards[0].getBoundingClientRect().width;
      check(gridCards.every(card => Math.abs(card.getBoundingClientRect().width - cardWidth) < 1),
        'gallery and module cards have equal responsive widths');
      check(getComputedStyle($('#top')).alignItems === 'start', 'short cards are not stretched to row height');
      check(Math.abs($('#gallery figure').getBoundingClientRect().width - $('.slides').clientWidth) < 1,
        'gallery frame fits exactly one image into its width');
      check(getComputedStyle($('#gallery img')).objectFit === 'contain', 'gallery fits full image without cover cropping');
      check($('[data-content]').getBoundingClientRect().height <= 300, 'compact overview remains a small block');
      for (const button of host.shadowRoot.querySelectorAll('.tile button')) {
        if (button.getBoundingClientRect().height) check(button.getBoundingClientRect().height >= 48, '48px touch actions');
      }
    }
  }
  setLiquidAppearance(document.querySelector('.cms-shell'), {liquidIntensity:40, liquidTransparency:70});
  check(getComputedStyle($('[data-tile]')).backgroundColor !== 'rgb(32, 46, 39)', 'theme surface token is used');
  const backdrop = getComputedStyle($('[data-details]'));
  check((backdrop.backdropFilter || backdrop.webkitBackdropFilter) === 'blur(12px)',
    'popup blurs underlying text for readable glass');

  host.data = [{name:'Car',readings:{state_batteryChargeLevel:'0',state_electricRange:'0',state_electricRange_unit:'km'}}];
  check($('.soc').textContent === '0%', 'real zero SOC is shown');
  check($('.range').textContent.includes('0 km'), 'real zero range is shown');
  host.data = [{name:'Car',readings:{}}];
  check(!$('.soc') && !$('.range') && !$('[data-detail-content] .card'), 'missing readings leave no fake values or empty groups');
  host.data = [{name:'Car',readings:{state_batteryChargeLevel:'ERROR_READING_PROPERTY'}}];
  check(!$('[data-detail-content] .card'), 'unavailable property is not rendered as a vehicle value');
  host.data = [{name:'Car',readings:{state_batteryChargeLevel:'30',
    state_chargingType:'Not authorized to access this resource.',
    statistics_customValue:'Not authorized to access this resource.',statistics_customValue_unit:'km'}}];
  check(!$('#reading-state_chargingType') && !$('#reading-statistics_customValue')
    && !$('[data-detail-content]').textContent.includes('Not authorized'), 'authorization failures omit whole rows');
  values.statistics_customValue = '<img src=x onerror=alert(1)>';
  host.data = dataFor(widget, snapshots());
  check($('#group-statistics').textContent.includes('<img src=x'), 'untrusted reading remains plain text');
  check(!$('#group-statistics img'), 'reading cannot inject markup');

  host.removeAttribute('view-only');
  await host.sendAction('unlock');
  check(commands.length === 0, 'editor cannot send vehicle commands');
  host.setAttribute('view-only','');
  const originalConfirm = window.confirm;
  try {
    window.confirm = () => { throw new Error('vehicle actions need no second confirmation'); };
    host.closeDetails();
    host.openActions();
    check($('[data-actions-title]').textContent === 'VolvoConnect - Fahrzeugaktionen', 'actions heading uses vehicle name');
    for (const button of $('[data-actions-content]').querySelectorAll('[data-command]')) {
      check(getComputedStyle(button).backgroundImage === getComputedStyle($('#compact-energy')).backgroundImage
        && getComputedStyle(button).border === getComputedStyle($('#compact-energy')).border
        && getComputedStyle(button).borderRadius === getComputedStyle($('#compact-energy')).borderRadius,
        'action tiles match the energy card surface');
    }
    await host.sendAction('invalid');
    check(commands.length === 0, 'nonallowlisted command is rejected');
    await host.sendAction('lock');
    check(commands.length === 1 && commands[0].join() === 'Car,lock', 'action uses normal command service without confirmation');
    services.setCommand = async () => { throw new Error('test failure'); };
    await host.sendAction('lock');
    check($('[data-action-message]').textContent.includes('test failure'), 'action errors are visible');
  } finally { window.confirm = originalConfirm; }

  await host.openConfig({isNew:true});
  check(!$('[data-details]').open, 'configuration closes details instead of stacking two widget modals');
  check($('[name=showDetails]').checked, 'dialog popup defaults on');
  check(!$('[name=readings]'), 'dialog requires no manual reading mapping');
  check(!$('[data-group-choices]') && !$('[data-preview-mount]'), 'configuration has no duplicate group list or interactive preview');
  $('[name=title]').value = 'Ungespeicherter Fahrzeugname';
  $('[data-module-info]').click();
  check($('[data-module-help]').open && $('[data-dialog]').open, 'module info opens modal above configuration');
  check((getComputedStyle($('[data-module-help]')).backdropFilter
    || getComputedStyle($('[data-module-help]')).webkitBackdropFilter) === 'blur(12px)',
    'module help blurs underlying widget configuration for legibility');
  check($('[data-module-info]').querySelector('svg') && $('[data-module-info]').classList.contains('cms-icon-button'),
    'module help uses the same reusable info icon');
  check($('[data-module-help]').textContent.includes('Community-Modul')
    && $('[data-module-help]').textContent.includes('define Volvo1 VolvoConnect'), 'help explains module and device creation');
  check($('[data-module-help] pre').textContent.includes('/main/controls_volvo.txt')
    && $('[data-module-help] pre').textContent.includes('update all')
    && $('[data-module-help] pre').textContent.includes('shutdown restart'), 'help shows complete stable controls installation');
  check($('[data-module-help] a').getAttribute('rel') === 'noopener noreferrer', 'external module documentation is safely linked');
  $('[data-close-module-help]').click();
  check(!$('[data-module-help]').open && $('[data-dialog]').open
    && $('[name=title]').value === 'Ungespeicherter Fahrzeugname', 'help close preserves unsaved configuration');
  check(host.shadowRoot.activeElement === $('[data-module-info]'), 'help close returns focus to info icon');
  $('[data-module-info]').click();
  $('[data-module-help]').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));
  check(!$('[data-module-help]').open && $('[data-dialog]').open, 'help Escape leaves widget configuration open');
  $('[name=title]').value = widget.title;
  check([...$('[data-form]').querySelectorAll('input')].slice(0,2).map(i=>i.name).join() === 'title,device',
    'device assignment directly follows title');
  check(getComputedStyle($('.config-actions')).justifyContent === 'flex-end', 'dialog actions match standard right alignment');
  check([...$('.config-actions').children].map(b=>b.textContent).join() === 'Widget löschen,Abbrechen,Speichern',
    'standard dialog labels and order');
  $('[name=showDetails]').checked = false;
  await host.saveConfig();
  check(saved.length === 1 && saved[0].showGallery === true, 'configuration preserves gallery preference');
  check(saved[0].showDetails === false, 'inline preference is persisted');
  check(saved[0].device === 'Car' && saved[0].type === widget.type, 'device/type preserved on save');
  check(JSON.stringify(saved[0].grid) === JSON.stringify(widget.grid), 'dialog preserves widget grid');
  check(saved[0].groupOrder[3] === 'gallery' && saved[0].hiddenGroups.length === 0,
    'configuration preserves group preferences');
  const configBefore = JSON.stringify(widget);
  host.config = {...widget, groupOrder:['statistics','doors'], hiddenGroups:['doors','state']};
  host.openDetails();
  check(!$('[data-detail-content] #group-doors') && !$('[data-detail-content] #group-state'), 'hidden groups omitted from popup');
  check($('[data-detail-content] [data-group]').dataset.group === 'statistics', 'saved group order controls popup');
  check($('.soc').textContent === '84%', 'hidden energy group does not hide compact overview');
  check(JSON.stringify(widget) === configBefore, 'rendering does not migrate saved configuration');
  host.config = {...widget, hiddenGroups:volvoGroups.map(([key])=>key), showGallery:false};
  check(!$('[data-detail-content] [data-group]'), 'all module groups can be hidden');
  host.config = widget;
  check(Boolean($('#group-doors')), 'old configuration without preferences defaults to all groups');
  let cancelled = 0;
  host.addEventListener('cms-widget-cancel', () => cancelled++);
  await host.openConfig({isNew:true});
  $('[name=showDetails]').checked = false;
  $('[data-dialog]').dispatchEvent(new Event('cancel', {cancelable:true}));
  check(!$('[data-dialog]').open && cancelled === 1, 'native Escape cancellation closes new widget session');
  check(saved.length === 1 && JSON.stringify(host.config) === configBefore, 'cancel never persists changed group preferences');
  await host.openConfig();
  check($('[name=showDetails]').checked, 'reopening discards unsaved presentation changes');
  host.closeConfig(false);
  host.openDetails();
  values.location_latitude = '0';
  values.location_longitude = '0';
  host.data = dataFor(widget, snapshots());
  for (let i=0; i<100 && !host.vehicleMaps.size; i++) await pause();
  const map = host.vehicleMaps.get('volvo-location');
  check(Boolean(map), 'existing native map runtime renders actual coordinates');
  check(map.car.getLatLng().lat === 0 && map.car.getLatLng().lng === 0, 'real zero coordinates are retained');
  map.instance.setView([0.01,0.01],17,{animate:false});
  const centerBefore = map.instance.getCenter();
  const sizeBefore = map.instance.getSize();
  check(sizeBefore.y === 175, 'map initializes at card height before external CSS arrives');
  $('[data-detail-body]').scrollTop = 100;
  const detailScroll = $('[data-detail-body]').scrollTop;
  host.data = dataFor(widget, snapshots());
  check(host.vehicleMaps.get('volvo-location') === map && map.instance.getZoom() === 17,
    'refresh retains map instance and user zoom');
  check($('[data-detail-body]').scrollTop === detailScroll && $('[data-details]').open,
    'live refresh keeps popup open and preserves its scroll');
  check(map.instance.project(map.instance.getCenter()).distanceTo(map.instance.project(centerBefore)) < 1,
    `refresh retains user pan (${JSON.stringify(centerBefore)} -> ${JSON.stringify(map.instance.getCenter())}; size ${JSON.stringify(sizeBefore)} -> ${JSON.stringify(map.instance.getSize())}; host ${map.host.clientHeight})`);
  services.savePopupSettings = async () => {};
  host.startArrangement();
  host.moveCard('location',-1);
  check(host.vehicleMaps.get('volvo-location') === map && map.instance.getZoom() === 17,
    'popup reordering retains existing map and user zoom');
  host.cancelArrangement();
  delete services.savePopupSettings;
  delete values.location_latitude;
  host.data = dataFor(widget, snapshots());
  check(!$('#volvo-location') && host.vehicleMaps.size === 0, 'missing coordinate removes map instead of guessing');
  values.location_latitude = '0';
  host.data = dataFor(widget, snapshots());
  check(host.vehicleMaps.size === 1, 'valid position recreates map');
  host.closeDetails();
  check(!host.vehicleMaps.size && !$('[data-detail-content]').childElementCount,
    'closing popup releases map and hidden detail DOM');
  check(host.shadowRoot.activeElement === $('[data-info]'), 'popup returns focus to info button');
  host.openDetails();
  check(host.vehicleMaps.size === 1, 'reopening restores live detail data');
  host.remove();
  check(host.vehicleMaps.size === 0, 'disconnect releases map resources');
  mount.append(host);
  check(host.vehicleMaps.size === 0 && !$('[data-details]').open, 'reconnect starts with closed popup and no hidden maps');
  host.openDetails();
  check(host.vehicleMaps.size === 1, 'reconnected widget recreates map when popup opens');
  host.closeDetails();
  host.config = {...widget, showDetails:false};
  check(!$('[data-info]') && !$('[data-details]').open, 'inline mode has no info button or automatic popup');
  check($('[data-inline-content] [data-group=state]') && $('[data-inline-content] [data-group=vehicle]'),
    'inline mode shows complete vehicle groups');
  check(!$('[data-inline-content] #actions') && $('[data-open-actions]'), 'actions move out of cards into their own launcher');
  const inlineMap = host.vehicleMaps.get('inline-volvo-location');
  inlineMap.instance.setZoom(17,{animate:false});
  const inlineSoc = $('[data-inline-content] .soc');
  host.data = dataFor(widget,snapshots());
  check($('[data-inline-content] .soc') === inlineSoc && host.vehicleMaps.get('inline-volvo-location') === inlineMap
    && inlineMap.instance.getZoom() === 17, 'inline refresh retains DOM, map and zoom');
  for (const width of [343,768,1100]) {
    host.style.width = `${width}px`;
    await pause();
    const inline = $('[data-inline-content]');
    check(inline.scrollWidth <= inline.clientWidth + 1, 'inline cards have no horizontal overflow');
  }
  services.savePopupSettings = async () => {};
  host.render();
  const inlineOrder = [...$('[data-inline-content] #inline-top').children].map(card=>card.dataset.group).join();
  $('[data-open-arrangement]').click();
  check($('[data-details]').open && host.pendingVisibility, 'inline edit opens existing popup arrangement');
  check(!$('[data-detail-content] [data-card-step]'), 'arrangement has no up/down buttons');
  host.moveCard('gallery',-1);
  host.toggleCard('doors');
  check([...$('[data-inline-content] #inline-top').children].map(card=>card.dataset.group).join() === inlineOrder,
    'editing in popup leaves inline card layout untouched');
  check(!host.config.hiddenGroups?.includes('doors'), 'eye changes remain unsaved until apply');
  host.cancelArrangement();
  host.closeDetails();
  await pause();
  check(host.vehicleMaps.size === 1 && !$('[data-detail-content]').childElementCount,
    'closing inline editor restores map without delayed native close cleanup destroying it');
  check(host.shadowRoot.activeElement === $('[data-open-arrangement]'), 'inline arrangement restores launcher focus');
  delete services.savePopupSettings;
  host.config = {...widget, showDetails:false, showGallery:false, hiddenGroups:['doors']};
  check(!$('[data-inline-content] [data-group=doors]') && !$('[data-inline-content] [data-group=gallery]'),
    'inline display uses the same visibility settings');
  const originalSave = services.saveWidget;
  services.saveWidget = async () => { throw new Error('test config save failure'); };
  await host.openConfig();
  await host.saveConfig();
  check($('[data-dialog]').open && $('[data-error]').textContent.includes('test config save failure')
    && !$('[data-form]').inert, 'failed configuration save stays open, visible and editable');
  host.closeConfig(false);
  services.saveWidget = originalSave;
  host.config = widget;
  host.remove();
  mount.style.width = '100%';
  const gridRoot = document.createElement('div');
  gridRoot.className = 'grid-stack cms-schema5-grid';
  gridRoot.style.width = 'min(1200px,100%)';
  mount.append(gridRoot);
  const rasterConfig = {schemaVersion:5, settings:{layoutMode:'grid',gridColumns:12},
    navigation:{grid:{col:1,row:1,w:12,h:1}}, pages:[{id:'start',
      widgets:[{...widget, grid:{col:1,row:2,w:4,h:4}}]}]};
  const raster = mountSchema5Widgets(GridStack, gridRoot, rasterConfig, 'start',
    document.createElement('nav'), services, snapshots());
  try {
    await new Promise(resolve => setTimeout(resolve, 400));
    const tile = gridRoot.querySelector('cms-volvoconnect').shadowRoot.querySelector('.tile');
    check(tile.scrollHeight <= tile.clientHeight + 1, `new compact raster fits without an internal scrollbar: ${
      JSON.stringify({width:tile.clientWidth, height:tile.clientHeight, content:tile.scrollHeight})}`);
    check(tile.scrollWidth <= tile.clientWidth + 1, 'new compact raster has no horizontal overflow');
  } finally { raster.destroy(); gridRoot.remove(); }
  window.volvoPopupRegression = { host, mount };
  output.dataset.result = 'pass';
  output.textContent = JSON.stringify({checks});
} catch (error) {
  output.dataset.result = 'fail';
  output.textContent = `${error.message}\n${error.stack}`;
  console.error(error);
}
</script>
