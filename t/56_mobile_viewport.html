<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile raster overflow regression</title>
<link rel="stylesheet" href="../www/fhem-cms/css/fcui-gridstack.css">
<link rel="stylesheet" href="../www/fhem-cms/css/fhem-cms.css">
<style>.grid-stack-animate, .grid-stack-animate .grid-stack-item { transition: none !important; }</style>
<main class="cms-shell"><div class="cms-schema5-workspace"><div id="grid" class="grid-stack cms-schema5-grid"></div></div></main>
<pre id="result">RUNNING</pre>
<script type="module">
import { GridStack } from '../www/fhem-cms/js/fcui-runtime.js';
import { Schema5View } from '../www/fhem-cms/js/fcui-schema5-view.js';
import { measureSchema5Navigation } from '../www/fhem-cms/js/fcui-schema5-navigation-fit.js';

const output = document.querySelector('#result');
let checks = 0;
const check = (condition, message) => { if (!condition) throw new Error(message); checks++; };
const settle = () => new Promise(resolve => setTimeout(resolve, 150));
const root = document.querySelector('#grid');
const shell = root.closest('.cms-shell');
const workspace = root.parentElement;
const config = {
  schemaVersion: 5, settings: { layoutMode: 'grid', gridColumns: 12 },
  navigation: { orientation: 'horizontal', grid: { col: 1, row: 1, w: 12, h: 1 } },
  pages: [{ id: 'start', title: 'Start', widgets: [0, 1, 2, 3].map(index => ({
    id: `w${index}`, type: 'text', title: `Widget ${index}`, html: '<p>Beispiel</p>',
    grid: { col: 1 + index * 3, row: 2, w: 3, h: 3 },
  })) }, ...['Heizungssteuerung im Wohnbereich', 'Gartenbewässerung und Außenanlagen',
    'Haushaltsgeräte und Energieverbrauch']
    .map((title, index) => ({ id: `page${index}`, title, widgets: [] }))],
};
try {
  const before = JSON.stringify(config);
  const landscape = new URLSearchParams(location.search).get('landscape') === '1';
  const view = new Schema5View({ GridStack, root, config, status: document.createElement('p'),
    client: { jsonlist: async () => [], subscribe() {}, unsubscribe() {} }, services: {} });
  await view.start();
  if (new URLSearchParams(location.search).get('cms-device') === 'mobile') {
    check(root.hasAttribute('data-mobile-preview'), 'mobile preview marker is active');
    check(root.hasAttribute('data-mobile-layout'), 'mobile preview uses the same responsive layout in either orientation');
  } else {
    check(matchMedia('(pointer: coarse)').matches, 'touch device has coarse primary pointer');
    check(!root.hasAttribute('data-mobile-preview'), 'touch device does not rely on preview marker');
    check(root.hasAttribute('data-mobile-layout'), 'touch device uses the mobile layout at either orientation');
  }
  for (const width of [343, 358, 398, 430, 635, 712, 768, 778, 834, 932, 992, 1048, 1101, 1162, 1194, 1250, 1334]) {
    shell.style.width = `${width}px`;
    window.dispatchEvent(new Event('resize'));
    await settle();
    check(workspace.scrollWidth <= workspace.clientWidth + 1,
      `${width}: horizontal overflow ${workspace.scrollWidth}/${workspace.clientWidth}`);
    const edge = workspace.getBoundingClientRect();
    const boxes = [...root.querySelectorAll('.grid-stack-item:not(.cms-responsive-navigation) > .grid-stack-item-content')]
      .map(item => item.getBoundingClientRect());
    const nav = root.querySelector('.cms-nav');
    if (root.hasAttribute('data-mobile-layout') && width <= 600) {
      check(boxes.every(box => box.width >= root.clientWidth * 0.95),
        `${width}: narrow mobile widgets use the available portrait width`);
    }
    if (root.hasAttribute('data-mobile-layout')) {
      check(getComputedStyle(root).display === 'flex', `${width}: mobile layout stays responsive in portrait and landscape`);
      if (width === 343 || width === 430) {
        const required = measureSchema5Navigation(nav);
        check(nav.hasAttribute('data-compact'),
          `portrait width ${width}px collapses links behind the burger (${required.width}px required)`);
        if (width === 343) {
          const wrapper = nav.closest('.cms-responsive-navigation');
          check(getComputedStyle(wrapper).position === 'absolute', 'compact navigation overlays the widget flow');
          const firstWidget = root.querySelector('.grid-stack-item:not(.cms-responsive-navigation)');
          const before = firstWidget.getBoundingClientRect().top;
          nav.querySelector('.cms-nav-burger').click();
          await settle();
          check(nav.hasAttribute('data-open'), 'burger opens navigation');
          check(firstWidget.getBoundingClientRect().top === before, 'opening navigation does not move widgets');
          const menu = nav.getBoundingClientRect();
          check(menu.width > 100 && menu.width <= root.clientWidth,
            `open navigation has a usable width (${menu.width}px within ${root.clientWidth}px viewport)`);
          check(menu.bottom > firstWidget.getBoundingClientRect().top,
            'opened navigation overlays the widgets');
          nav.querySelector('.cms-nav-burger').click();
          await settle();
        }
      }
      if (width === 932 || width === 1194) {
        const required = measureSchema5Navigation(nav);
        check(!nav.hasAttribute('data-compact'),
          `landscape width shows links instead of the burger (${nav.clientWidth}px available, ${required.width}px required)`);
      }
    }
    if (!nav.hasAttribute('data-compact')) {
      const bounds = nav.getBoundingClientRect();
      for (const link of nav.querySelectorAll('.cms-nav-link')) {
        const box = link.getBoundingClientRect();
        check(box.left >= bounds.left - 0.5 && box.right <= bounds.right + 0.5
          && box.bottom <= bounds.bottom + 0.5, `${width}: navigation link clipped`);
      }
    }
    for (const box of boxes) {
      check(box.left >= edge.left - 1 && box.right <= edge.right + 1, `${width}: widget clipped`);
    }
    for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
      const a = boxes[i], b = boxes[j];
      check(a.right <= b.left + 1 || b.right <= a.left + 1 || a.bottom <= b.top + 1 || b.bottom <= a.top + 1,
        `${width}: widgets overlap`);
    }
    check(JSON.stringify(config) === before, `${width}: configuration changed`);
  }
  view.stop();
  check(!root.hasAttribute('data-mobile-preview'), 'marker removed on stop');
  check(!root.hasAttribute('data-mobile-layout'), 'mobile layout marker removed on stop');
  const verticalConfig = structuredClone(config);
  verticalConfig.navigation.orientation = 'vertical';
  shell.style.width = landscape ? '852px' : '393px';
  const verticalView = new Schema5View({ GridStack, root, config: verticalConfig,
    status: document.createElement('p'),
    client: { jsonlist: async () => [], subscribe() {}, unsubscribe() {} }, services: {} });
  await verticalView.start();
  await settle();
  const verticalNav = root.querySelector('.cms-nav');
  const verticalWrapper = verticalNav.closest('.cms-responsive-navigation');
  window.dispatchEvent(new Event('resize'));
  await settle();
  check(verticalNav.classList.contains('is-vertical'), 'vertical navigation configuration is retained');
  check(verticalNav.hasAttribute('data-compact'), landscape
    ? 'vertical navigation in short landscape collapses to a burger'
    : 'narrow vertical navigation collapses to a burger');
  check(verticalWrapper.hasAttribute('data-nav-overlay'), 'vertical burger overlays the mobile widget flow');
  if (landscape) {
    const landscapeWidgets = [...root.querySelectorAll('.grid-stack-item:not(.cms-responsive-navigation)')];
    check(landscapeWidgets.every(item => item.getBoundingClientRect().width >= root.clientWidth * 0.38),
      'short landscape widgets scale to at least 40 percent of the available width');
  }
  const verticalFirstWidget = root.querySelector('.grid-stack-item:not(.cms-responsive-navigation)');
  const verticalBefore = verticalFirstWidget.getBoundingClientRect();
  verticalNav.querySelector('.cms-nav-burger').click();
  await settle();
  check(verticalNav.hasAttribute('data-open'), 'vertical burger opens the page list');
  const verticalAfter = verticalFirstWidget.getBoundingClientRect();
  check(verticalAfter.x === verticalBefore.x && verticalAfter.y === verticalBefore.y,
    'opening vertical navigation does not move widgets');
  verticalView.stop();
  shell.style.width = '343px';
  const editor = new Schema5View({ GridStack, root, config, status: document.createElement('p'),
    client: { jsonlist: async () => [], subscribe() {}, unsubscribe() {} }, services: {},
    editing: { onChange() {}, onEdit() {} } });
  await editor.start();
  await settle();
  const editorNav = root.querySelector('.cms-nav');
  const navWrapper = editorNav.closest('.cms-responsive-navigation');
  const editorBurger = editorNav.querySelector('.cms-nav-burger');
  check(root.classList.contains('cms-grid-editable'), 'editor retains GridStack controls');
  check(editorNav.hasAttribute('data-compact'), 'narrow editor shows the burger');
  check(navWrapper.hasAttribute('data-nav-overlay'), 'compact editor navigation overlays the grid');
  check(getComputedStyle(navWrapper).position === 'absolute', 'editor navigation is removed from the grid flow');
  const burgerBox = editorBurger.getBoundingClientRect();
  check(document.elementFromPoint(burgerBox.left + burgerBox.width / 2,
    burgerBox.top + burgerBox.height / 2) === editorBurger, 'editor tools do not block the burger');
  const firstWidget = root.querySelector('.grid-stack-item:not(.cms-responsive-navigation)');
  const beforeOpen = firstWidget.getBoundingClientRect();
  editorBurger.click();
  await settle();
  check(editorNav.hasAttribute('data-open'), 'editor burger opens the navigation');
  const afterOpen = firstWidget.getBoundingClientRect();
  check(afterOpen.x === beforeOpen.x && afterOpen.y === beforeOpen.y,
    'opening editor navigation does not move widgets');
  editor.stop();
  output.dataset.result = 'pass';
  output.textContent = JSON.stringify({ checks });
} catch (error) {
  output.dataset.result = 'fail';
  output.textContent = error.stack || String(error);
}
</script>
