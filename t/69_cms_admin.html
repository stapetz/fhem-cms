<!doctype html>
<meta charset="utf-8">
<title>CMS administration regression</title>
<iframe></iframe>
<pre id="result">RUNNING</pre>
<script type="module">
import { mountCmsAdmin } from '../www/fhem-cms/js/cms-admin.js';
import { applyCmsAdminAppearance, createCmsAdminMenuLinks } from '../www/fhem-cms/js/cms-admin-link.js';
const frame = document.querySelector('iframe');
const output = document.querySelector('#result');
let checks = 0;
const check = (condition, message) => { if (!condition) throw new Error(message); checks++; };
const wait = async predicate => {
  for (let i = 0; i < 100; i++) {
    if (predicate()) return;
    await new Promise(resolve => setTimeout(resolve, 20));
  }
  throw new Error('Timeout');
};
try {
  const html = await (await fetch('../www/fhem-cms/admin.html')).text();
  const parsed = new DOMParser().parseFromString(html, 'text/html');
  const assets = [...parsed.querySelectorAll('link[rel="stylesheet"], script[src]')];
  check(assets.length === 3 && assets.every(asset =>
    new URL(asset.getAttribute('href') || asset.getAttribute('src'), location.href).searchParams.get('v')),
  'administration assets use versioned URLs instead of stale cached files');
  frame.srcdoc = html.replace(/<script type="module" src="js\/cms-admin\.js[^"]*"><\/script>/, '')
    .replace('<title>', `<base href="${new URL('../www/fhem-cms/', location.href)}"><title>`);
  await wait(() => frame.contentDocument?.querySelector('#refresh'));
  const doc = frame.contentDocument;
  const body = doc.documentElement;
  await wait(() => [...doc.querySelectorAll('link[rel="stylesheet"]')].every(link => link.sheet));
  let removed = [];
  const items = [
    {name: 'Keep', kind: 'device', blocked: null, files: [{path: 'fhem-cms-data/Keep', directory: true}]},
    {name: 'Drop', kind: 'device', blocked: null, files: []},
    {name: 'Orphan', kind: 'orphan', blocked: null, files: []},
    {name: 'Foreign', kind: 'orphan', blocked: 'Keine CMS-Daten', files: []},
  ];
  const client = {
    base: new URL('http://example.test/custom/'),
    inventory: async () => ({token: 'a'.repeat(64), items: items.filter(item => !removed.includes(item.name))}),
    cacheStatus: async () => ({status: 'ready'}),
    cacheContents: async offset => ({offset, total: 51, warnings: [], items: offset === 0
      ? [{name: 'Alpha', alias: '<b>Garage</b>', readings: [
        {name: 'energy', sources: [{type: 'dblog', name: 'DB'}]},
        {name: 'power', sources: [{type: 'dblog', name: 'DB'}, {type: 'filelog', name: 'Log'}]},
      ]}]
      : [{name: 'Zulu', readings: [{name: 'temperature', sources: [{type: 'filelog'}]}]}]}),
    remove: async selection => {
      removed.push(...selection.map(item => item.name));
      return selection.map(item => ({...item, ok: true, message: 'Erledigt'}));
    },
  };
  const config = {
    schemaVersion: 5, theme: 'dark', settings: {layoutMode: 'grid', gridColumns: 12},
    navigation: {orientation: 'horizontal', grid: {col: 1, row: 1, w: 12, h: 1}},
    pages: [{id: 'home', title: 'Home', widgets: []}],
  };
  const states = {
    Keep: {live: structuredClone(config), draft: null, token: 'b'.repeat(64)},
    Drop: {live: {...structuredClone(config), theme: 'light'}, draft: null, token: 'd'.repeat(64)},
  };
  let failSave = '';
  let failLoad = false;
  let saves = 0;
  const loadedDevices = [];
  const createSession = async device => {
    loadedDevices.push(device);
    if (failLoad) throw new Error('Zugriff verweigert');
    const state = structuredClone(states[device]);
    const controller = {
      saveDraft: async (candidate, token) => {
        saves++;
        if (token !== states[device].token) throw new Error('Zustand ist veraltet');
        if (failSave === 'uncertain') {
          states[device].draft = structuredClone(candidate);
          throw new Error('Antwort verloren');
        }
        if (failSave) throw new Error('Zugriff verweigert');
        states[device].draft = structuredClone(candidate);
        states[device].token = 'c'.repeat(64);
        return structuredClone(states[device]);
      },
    };
    return {controller, schemaVersion: 5, state};
  };
  let closeCalls = 0;
  const exportedBlobs = [];
  const browser = {
    closed: false,
    close: () => { closeCalls++; },
    confirm: () => true,
    setTimeout: frame.contentWindow.setTimeout.bind(frame.contentWindow),
    Blob: frame.contentWindow.Blob,
    URL: {
      createObjectURL: blob => {
        exportedBlobs.push(blob);
        return 'blob:cms-admin-test';
      },
      revokeObjectURL: () => {},
    },
  };
  let reloads = 0;
  await mountCmsAdmin(body, client, () => { reloads++; }, browser, createSession);
  const $ = selector => doc.querySelector(selector);
  check(doc.title === 'Globale FHEM-CMS Administration' && $('h1').textContent === doc.title,
    'page heading and browser title use the global administration name');
  check($('#cache-heading').closest('section').nextElementSibling === $('#devices-heading').closest('section')
    && $('#devices-heading').compareDocumentPosition($('#refresh')) & Node.DOCUMENT_POSITION_FOLLOWING,
    'shared cache precedes CMS heading, introduction and refresh');
  $('#cache-show').click();
  await wait(() => $('#cache-rows').children.length === 1);
  check($('#cache-dialog').open && $('#cache-rows').textContent.includes('Alpha (<b>Garage</b>)')
    && $('#cache-rows').textContent.includes('energy — DbLog (DB)')
    && $('#cache-rows').textContent.includes('power — DbLog (DB), FileLog (Log)')
    && !$('#cache-rows b'), 'cache dialog shows alias and sources per reading as text');
  $('#cache-next').click();
  await wait(() => $('#cache-rows').textContent.includes('Zulu'));
  check(!$('#cache-previous').disabled && $('#cache-next').disabled, 'cache pagination follows total');
  $('#cache-close').click();
  check(!$('#cache-dialog').open, 'cache dialog closes without closing administration');
  frame.style.width = '360px';
  $('#cache-show').click();
  await wait(() => $('#cache-rows').children.length === 1);
  check($('#cache-dialog').getBoundingClientRect().width <= frame.contentWindow.innerWidth
    && $('#cache-dialog').scrollWidth <= $('#cache-dialog').clientWidth,
    'cache dialog fits a narrow viewport');
  $('#cache-close').click();
  check(!doc.querySelector('#configuration-device, #configuration-page, #settings-dialog, #embedded-editor, .cms-admin-toolbar'),
    'inventory has no global CMS selection, settings panels, toolbar or embedded editor');
  check(loadedDevices.length === 0, 'initial inventory never loads a CMS configuration');
  check($('#devices').querySelectorAll('[data-config-action="import"]').length === 2
    && $('#devices').querySelectorAll('[data-config-action="export"]').length === 2
    && !$('#orphans').querySelector('[data-config-action]'), 'only device rows have JSON actions');
  const anchorClick = frame.contentWindow.HTMLAnchorElement.prototype.click;
  const anchorDownloads = [];
  frame.contentWindow.HTMLAnchorElement.prototype.click = function click() {
    anchorDownloads.push({name: this.download, href: this.href});
  };
  const openLink = $('#devices a');
  const openStyle = frame.contentWindow.getComputedStyle(openLink);
  check(openLink.classList.contains('cms-button') && openStyle.textDecorationLine === 'none'
    && ['flex', 'inline-flex'].includes(openStyle.display) && openLink.getBoundingClientRect().height >= 48,
    'open CMS link uses a touch-sized styled button');
  for (const width of [760, 360]) {
    frame.style.width = `${width}px`;
    const row = openLink.closest('article');
    const rowStyle = frame.contentWindow.getComputedStyle(row);
    const rect = openLink.getBoundingClientRect();
    const labelRect = row.querySelector('label').getBoundingClientRect();
    const rightEdge = row.getBoundingClientRect().right
      - parseFloat(rowStyle.paddingRight) - parseFloat(rowStyle.borderRightWidth);
    check(Math.abs(rect.right - rightEdge) < 1 && rect.left >= labelRect.right
      && Math.abs((rect.top + rect.bottom) / 2 - (labelRect.top + labelRect.bottom) / 2) < 1,
    `open CMS button is right-aligned beside selection at ${width}px`);
    check(openStyle.borderStyle === 'solid' && parseFloat(openStyle.borderWidth) >= 1
      && openStyle.backgroundColor !== 'rgba(0, 0, 0, 0)' && rect.height >= 48,
    `open CMS action has visible button border and background at ${width}px`);
  }
  for (const editorClass of ['cms-schema5-editor', 'cms-editor']) {
    const toolbar = doc.createElement('div');
    toolbar.className = `cms-toolbar ${editorClass}`;
    const menu = doc.createElement('div');
    menu.className = 'cms-menu-items';
    const button = doc.createElement('button');
    button.className = 'cms-button';
    button.textContent = 'Sicherungen';
    check(createCmsAdminMenuLinks({}).length === 0
      && createCmsAdminMenuLinks({ adminMenuEnabled: false }).length === 0,
    `${editorClass}: administration menu absent without explicit opt-in`);
    const [link] = createCmsAdminMenuLinks({ adminMenuEnabled: true });
    menu.append(button, link);
    toolbar.append(menu);
    doc.body.append(toolbar);
    const style = node => frame.contentWindow.getComputedStyle(node);
    check(link.textContent === 'Globale FHEM-CMS Administration' && link.getAttribute('href') === '../admin.html',
      `${editorClass}: administration label and destination`);
    check(['fontFamily', 'fontSize', 'fontWeight', 'color', 'backgroundColor', 'padding',
      'border', 'borderRadius', 'textAlign', 'textDecorationLine'].every(key => style(link)[key] === style(button)[key]),
    `${editorClass}: menu link matches other menu buttons`);
    const source = document.documentElement;
    const previousTheme = source.getAttribute('data-cms-theme');
    const previousStyle = source.getAttribute('style');
    source.setAttribute('data-cms-theme', 'liquid-glass');
    source.style.setProperty('--cms-page-image', `url("${new URL(`../www/fhem-cms/CMS/media/${'a'.repeat(32)}.jpg`, location.href).href}")`);
    source.style.setProperty('--cms-liquid-blur', '12px');
    link.click();
    const popup = document.querySelector('.cms-eventmonitor-modal');
    const adminFrame = popup.querySelector('iframe');
    const appearance = new URL(adminFrame.src).hash;
    check(appearance.includes('theme=liquid-glass') && appearance.includes('blur=12')
      && appearance.includes('background='), `${editorClass}: click transfers current theme and image`);
    check(new URL(adminFrame.src).searchParams.get('embedded') === '1'
      && !new URL(popup.querySelector('header a').href).searchParams.has('embedded')
      && new URL(popup.querySelector('header a').href).hash === appearance,
    `${editorClass}: popup and separate window share appearance`);
    adminFrame.contentWindow.cmsAdminCloseStatus = () => 'Ein Vorgang läuft noch.';
    popup.querySelector('.cms-close-button').click();
    check(popup.open && popup.querySelector('[role="status"]').textContent.includes('Vorgang'),
      `${editorClass}: busy administration blocks close`);
    adminFrame.contentWindow.cmsAdminCloseStatus = () => '';
    popup.querySelector('.cms-close-button').click();
    await wait(() => !popup.isConnected);
    if (previousTheme === null) source.removeAttribute('data-cms-theme');
    else source.setAttribute('data-cms-theme', previousTheme);
    if (previousStyle === null) source.removeAttribute('style');
    else source.setAttribute('style', previousStyle);
    toolbar.remove();
  }
  const menu = doc.createElement('div');
  menu.className = 'cms-menu-items';
  const labels = ['Vorschau', 'Raster anzeigen', 'Widgets automatisch anordnen', 'Eventmonitor'];
  for (const [index, label] of labels.entries()) {
    const item = index === 3 ? doc.createElement('a') : doc.createElement('button');
    item.className = 'cms-button';
    if (index < 2) {
      item.classList.add('cms-grid-toggle');
      item.setAttribute('aria-pressed', 'false');
    }
    item.textContent = label;
    menu.append(item);
  }
  doc.body.append(menu);
  const textStart = item => {
    const range = doc.createRange();
    range.selectNodeContents(item);
    return range.getBoundingClientRect().left;
  };
  const menuItems = [...menu.children];
  const starts = menuItems.map(textStart);
  check(menuItems.every(item => frame.contentWindow.getComputedStyle(item).width
    === frame.contentWindow.getComputedStyle(menuItems[0]).width)
    && starts.every(start => Math.abs(start - starts[0]) < 1),
  'menu buttons and links have a shared width and left-aligned text');
  menu.remove();
  const context = `#${new URLSearchParams({ theme: 'liquid-glass',
    background: `/fhem/fhem-cms/CMS/media/${'a'.repeat(32)}.jpg`,
    blur: '12', opacity: '0.7', gloss: '0.1' })}`;
  applyCmsAdminAppearance(body, context);
  check(body.getAttribute('data-cms-theme') === 'liquid-glass'
    && frame.contentWindow.getComputedStyle($('#devices article')).backdropFilter === 'blur(12px)'
    && body.style.getPropertyValue('--cms-page-image').includes('/CMS/media/'),
  'administration renders transferred Liquid Glass values and background');
  applyCmsAdminAppearance(body, context);
  check(body.style.getPropertyValue('--cms-liquid-opacity') === '0.7',
    'appearance survives repeated initialization with the same URL context');
  applyCmsAdminAppearance(body, '#theme=dark');
  check($('#devices').querySelectorAll('input[data-kind]').length === 2, 'active devices listed');
  check($('#orphans').querySelectorAll('input[data-kind]').length === 2, 'orphans separately listed');
  check($('input[value="Foreign"]').disabled, 'foreign structures cannot be selected');
  check($('#delete-devices').disabled && $('#delete-orphans').disabled, 'no preselection');
  check($('#devices a').getAttribute('href') === '/custom/fhem-cms/Keep/index.html?mode=edit', 'device link uses FHEMWEB prefix');
  const row = name => $(`input[data-kind="device"][value="${name}"]`).closest('article');
  const exportRow = async name => {
    const count = exportedBlobs.length;
    row(name).querySelector('[data-config-action="export"]').click();
    await wait(() => exportedBlobs.length > count && !$('#refresh').disabled);
    return JSON.parse(await exportedBlobs.at(-1).text());
  };
  const importRow = async (name, value, filename = 'import.json') => {
    const fileInput = row(name).querySelector('input[type="file"]');
    Object.defineProperty(fileInput, 'files', {configurable: true, value: [
      new frame.contentWindow.File([value], filename, {type: 'application/json'}),
    ]});
    fileInput.dispatchEvent(new Event('change'));
  };
  check((await exportRow('Drop')).theme === 'light' && loadedDevices.join() === 'Drop'
    && anchorDownloads[0].name === 'Drop-config.json', 'export loads live state for the clicked device only');
  check((await exportRow('Keep')).theme === 'dark' && loadedDevices.join() === 'Drop,Keep',
    'each export freshly loads its own device');
  const imported = structuredClone(config);
  imported.pages[0].title = 'Imported';
  await importRow('Keep', JSON.stringify(imported));
  await wait(() => $('#import-confirmation').open);
  check($('#import-file-name').textContent.includes('Keep') && $('#refresh').disabled,
    'import confirmation identifies clicked device and serializes actions');
  $('#import-confirmation button[value="cancel"]').click();
  await wait(() => !$('#refresh').disabled);
  check(saves === 0 && states.Keep.draft === null, 'cancel leaves both live and draft unchanged');
  await importRow('Keep', JSON.stringify(imported));
  await wait(() => $('#import-confirmation').open);
  $('#import-confirmation').dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',
    {key: 'Escape', bubbles: true, cancelable: true}));
  check(!$('#import-confirmation').open && !$('#refresh').disabled && saves === 0 && closeCalls === 0,
    'Escape cancels import and releases controls without closing the window');
  await importRow('Keep', JSON.stringify(imported));
  await wait(() => $('#import-confirmation').open);
  $('#import-confirmation button[value="import"]').click();
  await wait(() => !$('#refresh').disabled);
  check(states.Keep.draft.pages[0].title === 'Imported' && states.Keep.live.pages[0].title === 'Home'
    && states.Drop.draft === null && $('#status').textContent.includes('Live-Konfiguration blieb unverändert'),
  'import stores only a draft for the selected row');
  check((await exportRow('Keep')).pages[0].title === 'Imported', 'export prefers draft over live');
  await importRow('Drop', '{');
  await wait(() => $('#status').hasAttribute('data-error'));
  check(!$('#import-confirmation').open && saves === 1, 'invalid JSON reports error and does not write');
  const readsBeforeOversize = loadedDevices.length;
  await importRow('Drop', 'x'.repeat(1048577));
  await wait(() => $('#status').textContent.includes('größer als 1 MiB'));
  check(loadedDevices.length === readsBeforeOversize && saves === 1,
    'oversized JSON is rejected before loading or writing a configuration');
  await importRow('Drop', JSON.stringify(imported));
  await wait(() => $('#import-confirmation').open);
  states.Drop.token = 'e'.repeat(64);
  $('#import-confirmation button[value="import"]').click();
  await wait(() => !$('#refresh').disabled);
  check($('#status').textContent.includes('veraltet') && states.Drop.draft === null,
    'concurrent state change is rejected with a visible error');
  failSave = 'uncertain';
  await importRow('Drop', JSON.stringify(imported));
  await wait(() => $('#import-confirmation').open);
  $('#import-confirmation button[value="import"]').click();
  await wait(() => !$('#refresh').disabled);
  check($('#status').textContent.includes('könnte bereits gespeichert sein') && states.Drop.draft,
    'uncertain write is not retried and instructs the user to inspect current state');
  check((await exportRow('Drop')).pages[0].title === 'Imported', 'new export reads the possibly saved draft afresh');
  failSave = '';
  failLoad = true;
  row('Drop').querySelector('[data-config-action="export"]').click();
  await wait(() => $('#status').textContent.includes('Zugriff verweigert'));
  check($('#status').hasAttribute('data-error') && !$('#refresh').disabled, 'read failure is explicit and unlocks controls');
  failLoad = false;
  $('#confirmation').showModal();
  const modalEscape = new frame.contentWindow.KeyboardEvent('keydown', {key: 'Escape', bubbles: true, cancelable: true});
  $('#confirmation').dispatchEvent(modalEscape);
  check(modalEscape.defaultPrevented && !$('#confirmation').open && closeCalls === 0,
    'Escape closes an active dialog without closing the window');
  doc.body.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {key: 'Escape', bubbles: true, cancelable: true}));
  await new Promise(resolve => setTimeout(resolve, 120));
  check(closeCalls === 1 && $('#status').textContent.includes('nicht skriptgesteuert geöffnet'),
    'Escape attempts to close and visibly reports browser restrictions');
  $('#close-window').click();
  check(closeCalls === 2 && $('#close-window').getAttribute('aria-label') === 'Fenster schließen',
    'top-right close control uses the same browser close behavior');
  frame.contentWindow.HTMLAnchorElement.prototype.click = anchorClick;
  const select = name => {
    const input = $(`input[value="${name}"]`);
    input.checked = true;
    input.dispatchEvent(new Event('change'));
  };
  select('Drop');
  $('#delete-devices').click();
  check($('#confirmation').open && $('#selected').textContent === 'Drop', 'confirmation names exact selection');
  $('button[value="cancel"]').click();
  await new Promise(resolve => setTimeout(resolve, 0));
  check(removed.length === 0 && reloads === 0, 'cancel never deletes or reloads');
  $('#delete-devices').click();
  $('button[value="delete"]').click();
  await new Promise(resolve => setTimeout(resolve, 0));
  check(removed.length === 0 && reloads === 0, 'missing DELETE confirmation never deletes or reloads');
  check($('#confirmation').open, 'invalid confirmation keeps dialog open');
  $('#confirm-text').value = 'DELETE';
  $('button[value="delete"]').click();
  await wait(() => $('#results').textContent.includes('Drop: Erledigt') && !$('input[value="Drop"]'));
  check(removed.join() === 'Drop' && !!$('input[value="Keep"]'), 'only selected device removed and list refreshed');
  check(reloads === 1, 'successful confirmed device deletion reloads the page once');
  select('Orphan');
  $('#delete-orphans').click();
  $('#confirm-text').value = 'DELETE';
  $('button[value="delete"]').click();
  await wait(() => removed.includes('Orphan') && !$('input[value="Orphan"]'));
  check(removed.join() === 'Drop,Orphan', 'orphan cleanup has a separate selection');
  check(reloads === 2, 'successful orphan cleanup also reloads the page once');
  client.remove = async () => { throw new Error('Zugriff verweigert'); };
  select('Keep');
  $('#delete-devices').click();
  $('#confirm-text').value = 'DELETE';
  $('button[value="delete"]').click();
  await wait(() => $('#results').textContent.includes('Zugriff verweigert'));
  check(!!$('input[value="Keep"]') && reloads === 2, 'failure retains device and error without a page reload');
  client.remove = async selection => selection.map(item => ({...item, ok: false, message: 'Purge fehlgeschlagen'}));
  select('Keep');
  $('#delete-devices').click();
  $('#confirm-text').value = 'DELETE';
  $('button[value="delete"]').click();
  await wait(() => $('#results').textContent.includes('Purge fehlgeschlagen') && !$('#refresh').disabled);
  check(reloads === 2 && !!$('#results [data-error]'), 'unsuccessful batch keeps per-entry errors visible without reload');
  history.replaceState(null, '', '/www/fhem-cms/CMS/index.html');
  document.documentElement.setAttribute('data-cms-theme', 'light');
  const [realLink] = createCmsAdminMenuLinks({ adminMenuEnabled: true });
  document.body.append(realLink);
  realLink.click();
  const realPopup = document.querySelector('.cms-eventmonitor-modal');
  const realFrame = realPopup.querySelector('iframe');
  await wait(() => typeof realFrame.contentWindow?.cmsAdminCloseStatus === 'function');
  await wait(() => !realFrame.contentWindow.cmsAdminCloseStatus());
  const realDoc = realFrame.contentDocument;
  check(realDoc.documentElement.dataset.cmsTheme === 'light'
    && getComputedStyle(realDoc.querySelector('#close-window')).display === 'none',
  'real embedded administration uses the current theme and only the outer close button');
  const realFetch = realFrame.contentWindow.fetch;
  let releaseInventory;
  realFrame.contentWindow.fetch = () => new Promise(resolve => { releaseInventory = resolve; });
  realDoc.querySelector('#refresh').click();
  realPopup.querySelector('.cms-close-button').click();
  check(realPopup.open && realPopup.querySelector('[role="status"]').textContent.includes('Vorgang'),
    'real pending inventory request blocks the outer X');
  const oldOpen = window.open;
  let openedWindow;
  window.open = () => { openedWindow = { opener: window, location: { href: '' } }; return openedWindow; };
  realPopup.querySelector('header a').click();
  check(!openedWindow && realPopup.open, 'pending administration also blocks opening a separate window');
  releaseInventory(Response.json({ token: 'a'.repeat(64), items: [] }));
  realFrame.contentWindow.fetch = realFetch;
  await wait(() => !realFrame.contentWindow.cmsAdminCloseStatus());
  realDoc.querySelector('#confirmation').showModal();
  realPopup.querySelector('.cms-close-button').click();
  check(realPopup.open && realPopup.querySelector('[role="status"]').textContent.includes('Administrationsdialog'),
    'real confirmation prevents the outer X from closing administration');
  realDoc.querySelector('#confirmation').close();
  realDoc.body.dispatchEvent(new realFrame.contentWindow.KeyboardEvent('keydown', {
    key: 'Escape', bubbles: true, cancelable: true,
  }));
  await wait(() => !realPopup.isConnected);
  check(!realPopup.open, 'Escape inside the real administration frame closes its popup');
  realLink.click();
  const separatePopup = document.querySelector('.cms-eventmonitor-modal');
  const expectedWindowUrl = separatePopup.querySelector('header a').href;
  separatePopup.querySelector('header a').click();
  window.open = oldOpen;
  await wait(() => !separatePopup.isConnected);
  check(openedWindow.opener === null && openedWindow.location.href === expectedWindowUrl
    && new URL(expectedWindowUrl).hash === '#theme=light',
  'separate administration window preserves the theme and closes the popup');
  output.dataset.result = 'pass';
  output.textContent = JSON.stringify({checks});
} catch (error) {
  output.dataset.result = 'fail';
  output.textContent = error.stack || String(error);
}
</script>
