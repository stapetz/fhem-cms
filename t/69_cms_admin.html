<!doctype html>
<meta charset="utf-8">
<title>CMS administration regression</title>
<iframe></iframe>
<pre id="result">RUNNING</pre>
<script type="module">
import { mountCmsAdmin } from '../www/fhem-cms/js/cms-admin.js';
import { createCmsAdminMenuLinks } from '../www/fhem-cms/js/cms-admin-link.js';
const frame = document.querySelector('iframe');
const output = document.querySelector('#result');
let checks = 0;
const check = (condition, message) => { if (!condition) throw new Error(message); checks++; };
const wait = async predicate => {
  for (let i = 0; i < 100; i++) {
    if (predicate()) return;
    await new Promise(resolve => setTimeout(resolve, 20));
  }
  throw new Error('Timeout');
};
try {
  const html = await (await fetch('../www/fhem-cms/admin.html')).text();
  const parsed = new DOMParser().parseFromString(html, 'text/html');
  const assets = [...parsed.querySelectorAll('link[rel="stylesheet"], script[src]')];
  check(assets.length === 3 && assets.every(asset =>
    new URL(asset.getAttribute('href') || asset.getAttribute('src'), location.href).searchParams.get('v')),
  'administration assets use versioned URLs instead of stale cached files');
  frame.srcdoc = html.replace(/<script type="module" src="js\/cms-admin\.js[^"]*"><\/script>/, '')
    .replace('<title>', `<base href="${new URL('../www/fhem-cms/', location.href)}"><title>`);
  await wait(() => frame.contentDocument?.querySelector('#refresh'));
  const doc = frame.contentDocument;
  const body = doc.documentElement;
  await wait(() => [...doc.querySelectorAll('link[rel="stylesheet"]')].every(link => link.sheet));
  let removed = [];
  const items = [
    {name: 'Keep', kind: 'device', blocked: null, files: [{path: 'fhem-cms-data/Keep', directory: true}]},
    {name: 'Drop', kind: 'device', blocked: null, files: []},
    {name: 'Orphan', kind: 'orphan', blocked: null, files: []},
    {name: 'Foreign', kind: 'orphan', blocked: 'Keine CMS-Daten', files: []},
  ];
  const client = {
    base: new URL('http://example.test/custom/'),
    inventory: async () => ({token: 'a'.repeat(64), items: items.filter(item => !removed.includes(item.name))}),
    remove: async selection => {
      removed.push(...selection.map(item => item.name));
      return selection.map(item => ({...item, ok: true, message: 'Erledigt'}));
    },
  };
  let reloads = 0;
  await mountCmsAdmin(body, client, () => { reloads++; });
  const $ = selector => doc.querySelector(selector);
  check(doc.title === 'Globale FHEM-CMS Administration' && $('h1').textContent === doc.title,
    'page heading and browser title use the global administration name');
  const openLink = $('#devices a');
  const openStyle = frame.contentWindow.getComputedStyle(openLink);
  check(openLink.classList.contains('cms-button') && openStyle.textDecorationLine === 'none'
    && ['flex', 'inline-flex'].includes(openStyle.display) && openLink.getBoundingClientRect().height >= 48,
    'open CMS link uses a touch-sized styled button');
  for (const width of [760, 360]) {
    frame.style.width = `${width}px`;
    const row = openLink.closest('article');
    const rowStyle = frame.contentWindow.getComputedStyle(row);
    const rect = openLink.getBoundingClientRect();
    const labelRect = row.querySelector('label').getBoundingClientRect();
    const rightEdge = row.getBoundingClientRect().right
      - parseFloat(rowStyle.paddingRight) - parseFloat(rowStyle.borderRightWidth);
    check(Math.abs(rect.right - rightEdge) < 1 && rect.left >= labelRect.right
      && Math.abs((rect.top + rect.bottom) / 2 - (labelRect.top + labelRect.bottom) / 2) < 1,
    `open CMS button is right-aligned beside selection at ${width}px`);
    check(openStyle.borderStyle === 'solid' && parseFloat(openStyle.borderWidth) >= 1
      && openStyle.backgroundColor !== 'rgba(0, 0, 0, 0)' && rect.height >= 48,
    `open CMS action has visible button border and background at ${width}px`);
  }
  for (const editorClass of ['cms-schema5-editor', 'cms-editor']) {
    const toolbar = doc.createElement('div');
    toolbar.className = `cms-toolbar ${editorClass}`;
    const menu = doc.createElement('div');
    menu.className = 'cms-menu-items';
    const button = doc.createElement('button');
    button.className = 'cms-button';
    button.textContent = 'Sicherungen';
    check(createCmsAdminMenuLinks({}).length === 0
      && createCmsAdminMenuLinks({ adminMenuEnabled: false }).length === 0,
    `${editorClass}: administration menu absent without explicit opt-in`);
    const [link] = createCmsAdminMenuLinks({ adminMenuEnabled: true });
    menu.append(button, link);
    toolbar.append(menu);
    doc.body.append(toolbar);
    const style = node => frame.contentWindow.getComputedStyle(node);
    check(link.textContent === 'Globale FHEM-CMS Administration' && link.getAttribute('href') === '../admin.html',
      `${editorClass}: administration label and destination`);
    check(['fontFamily', 'fontSize', 'fontWeight', 'color', 'backgroundColor', 'padding',
      'border', 'borderRadius', 'textAlign', 'textDecorationLine'].every(key => style(link)[key] === style(button)[key]),
    `${editorClass}: menu link matches other menu buttons`);
    toolbar.remove();
  }
  check($('#devices').querySelectorAll('input').length === 2, 'active devices listed');
  check($('#orphans').querySelectorAll('input').length === 2, 'orphans separately listed');
  check($('input[value="Foreign"]').disabled, 'foreign structures cannot be selected');
  check($('#delete-devices').disabled && $('#delete-orphans').disabled, 'no preselection');
  check($('#devices a').getAttribute('href') === '/custom/fhem-cms/Keep/index.html?mode=edit', 'device link uses FHEMWEB prefix');
  const select = name => {
    const input = $(`input[value="${name}"]`);
    input.checked = true;
    input.dispatchEvent(new Event('change'));
  };
  select('Drop');
  $('#delete-devices').click();
  check($('#confirmation').open && $('#selected').textContent === 'Drop', 'confirmation names exact selection');
  $('button[value="cancel"]').click();
  await new Promise(resolve => setTimeout(resolve, 0));
  check(removed.length === 0 && reloads === 0, 'cancel never deletes or reloads');
  $('#delete-devices').click();
  $('button[value="delete"]').click();
  await new Promise(resolve => setTimeout(resolve, 0));
  check(removed.length === 0 && reloads === 0, 'missing DELETE confirmation never deletes or reloads');
  check($('#confirmation').open, 'invalid confirmation keeps dialog open');
  $('#confirm-text').value = 'DELETE';
  $('button[value="delete"]').click();
  await wait(() => $('#results').textContent.includes('Drop: Erledigt') && !$('input[value="Drop"]'));
  check(removed.join() === 'Drop' && !!$('input[value="Keep"]'), 'only selected device removed and list refreshed');
  check(reloads === 1, 'successful confirmed device deletion reloads the page once');
  select('Orphan');
  $('#delete-orphans').click();
  $('#confirm-text').value = 'DELETE';
  $('button[value="delete"]').click();
  await wait(() => removed.includes('Orphan') && !$('input[value="Orphan"]'));
  check(removed.join() === 'Drop,Orphan', 'orphan cleanup has a separate selection');
  check(reloads === 2, 'successful orphan cleanup also reloads the page once');
  client.remove = async () => { throw new Error('Zugriff verweigert'); };
  select('Keep');
  $('#delete-devices').click();
  $('#confirm-text').value = 'DELETE';
  $('button[value="delete"]').click();
  await wait(() => $('#results').textContent.includes('Zugriff verweigert'));
  check(!!$('input[value="Keep"]') && reloads === 2, 'failure retains device and error without a page reload');
  client.remove = async selection => selection.map(item => ({...item, ok: false, message: 'Purge fehlgeschlagen'}));
  select('Keep');
  $('#delete-devices').click();
  $('#confirm-text').value = 'DELETE';
  $('button[value="delete"]').click();
  await wait(() => $('#results').textContent.includes('Purge fehlgeschlagen') && !$('#refresh').disabled);
  check(reloads === 2 && !!$('#results [data-error]'), 'unsuccessful batch keeps per-entry errors visible without reload');
  output.dataset.result = 'pass';
  output.textContent = JSON.stringify({checks});
} catch (error) {
  output.dataset.result = 'fail';
  output.textContent = error.stack || String(error);
}
</script>
