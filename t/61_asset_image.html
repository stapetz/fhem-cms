<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bildvarianten</title>
<pre id="result"></pre>
<script type="module">
import { openAssetManager } from '../www/fhem-cms/js/asset-manager.js';
const result = document.querySelector('#result');
let checks = 0;
const check = (condition, name) => { checks++; if (!condition) throw new Error(name); };
const pause = () => new Promise(resolve => setTimeout(resolve, 30));
const wait = async predicate => {
  for (let i = 0; i < 100; i++) { if (predicate()) return; await pause(); }
  throw new Error('Zeitüberschreitung beim Warten auf Bilddialog');
};
const canvas = document.createElement('canvas');
canvas.width = 200; canvas.height = 100;
const ctx = canvas.getContext('2d');
ctx.fillStyle = 'red'; ctx.fillRect(0, 0, 100, 100);
ctx.fillStyle = 'blue'; ctx.fillRect(100, 0, 100, 100);
const originalBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
const originalId = 'a'.repeat(32), variantId = 'b'.repeat(32);
const original = { id: originalId, name: 'Test.png', file: `${originalId}.png`,
  href: `media/${originalId}.png`, image: true, bytes: originalBlob.size, folder: 'root' };
let revision = 1;
const state = { token: String(revision).padStart(64, '0'), folders: [], assets: [original],
  totalBytes: original.bytes, policy: { imageBytes: 3145728, documentBytes: 20971520,
    totalBytes: 524288000, types: { png: true, jpg: true, gif: true, pdf: true } } };
const nativeFetch = window.fetch;
window.fetch = async (url, options) => String(url) === original.href
  ? new Response(originalBlob, { status: 200 }) : nativeFetch(url, options);
let savedFile;
const services = {
  async assetAction(request) {
    if (request.op === 'list') return structuredClone(state);
    if (request.op === 'usage') return { usage: [] };
    if (request.op === 'delete') {
      state.assets = state.assets.filter(item => item.id !== request.id);
      for (const asset of state.assets) if (asset.variantOf === request.id) delete asset.variantOf;
      state.token = String(++revision).padStart(64, '0');
      state.totalBytes = state.assets.reduce((sum, item) => sum + item.bytes, 0);
      return { state: structuredClone(state) };
    }
    throw new Error(`Unerwartete Aktion: ${request.op}`);
  },
  async uploadAsset(file, folder, token, options) {
    check(token === state.token && folder === 'root' && options.variantOf === originalId, 'Upload bindet Original und Katalogtoken');
    savedFile = file;
    state.assets.push({ id: variantId, name: file.name, file: `${variantId}.png`,
      href: `media/${variantId}.png`, bytes: file.size, image: true, folder, variantOf: originalId });
    state.totalBytes += file.size;
    state.token = String(++revision).padStart(64, '0');
    return { selected: variantId, state: structuredClone(state) };
  },
};
try {
  const pending = openAssetManager(services, { mode: 'image' });
  await wait(() => document.querySelector('[data-asset-manager]')?.shadowRoot.querySelector('[data-asset-id]'));
  const root = document.querySelector('[data-asset-manager]').shadowRoot;
  root.querySelector(`[data-asset-id="${originalId}"]`).click();
  check(root.querySelectorAll('[data-variant-id]').length === 1, 'Original in Variantenliste');
  check(root.querySelector('.variant').textContent.includes('Original'), 'Original gekennzeichnet');
  root.querySelector('[data-edit-image]').click();
  await wait(() => root.querySelector('[data-image-editor]')?.open);
  let editor = root.querySelector('[data-image-editor]');
  check(editor.querySelector('[data-source-size]').textContent === '200 × 100',
    'Dialog zeigt die tatsächliche Quellbildgröße');
  check(editor.querySelector('[role="toolbar"][aria-label="Bildwerkzeuge"]'),
    'Bildwerkzeuge liegen in einer zugänglichen Werkzeugleiste');
  check(editor.querySelector('[data-image-size-summary]').textContent
    .includes('Ausschnitt: 200 × 100 Quellpixel · Ausgabe: 200 × 100 px'),
  'Ausschnitt- und Ausgabegröße sind klar unterschieden');
  const cropTool = editor.querySelector('[data-image-tool="crop"]');
  check(cropTool.getAttribute('aria-label') === 'Zuschneiden', 'Crop-Symbol ist zugänglich beschriftet');
  check(!editor.querySelector('[data-crop]'), 'Zuschnitt hat keine numerischen Eingabefelder');
  const outputW = editor.querySelector('[data-output="w"]');
  const outputH = editor.querySelector('[data-output="h"]');
  const outputLock = editor.querySelector('[data-output-ratio]');
  const cropLock = editor.querySelector('[data-crop-ratio]');
  const input = (field, value) => { field.value = String(value); field.dispatchEvent(new Event('input')); };
  check(outputLock.checked && !cropLock.checked, 'Bildgröße ist proportional, Zuschnitt zunächst frei');
  check(!editor.querySelector('[data-image-save]').disabled, 'Reine Größenänderung braucht keinen Zuschnitt');
  input(outputW, 100);
  check(outputH.value === '50', 'Gesperrte Ausgabehöhe folgt der Breite');
  input(outputH, 20);
  check(outputW.value === '40', 'Gesperrte Ausgabebreite folgt der Höhe');
  outputLock.click();
  input(outputW, 80);
  check(outputH.value === '20', 'Freie Ausgabegröße erlaubt ein anderes Seitenverhältnis');
  outputLock.click();
  check(outputH.value === '40', 'Erneutes Sperren stellt das Ausschnittverhältnis her');
  input(outputW, 201);
  editor.querySelector('[data-image-save]').click();
  check(!savedFile && editor.querySelector('[data-image-error]').textContent.includes('gültige Ausgabegröße'),
    'Vergrößerung über die Quellauflösung wird sichtbar abgewiesen');
  input(outputW, 200);
  const selection = editor.querySelector('.image-editor-selection');
  const key = (target, key, shiftKey = false) => target.dispatchEvent(
    new KeyboardEvent('keydown', { key, shiftKey, bubbles: true }));
  const handle = name => editor.querySelector(`[data-handle="${name}"]`);
  const cropValues = () => {
    const style = selection.style;
    return { x: Math.round(parseFloat(style.left) * 2), y: Math.round(parseFloat(style.top)),
      w: Math.round(parseFloat(style.width) * 2), h: Math.round(parseFloat(style.height)) };
  };
  const assertCrop = (expected, message) => {
    check(JSON.stringify(cropValues()) === JSON.stringify(expected), `${message}: ${JSON.stringify(cropValues())}`);
  };
  cropTool.click();
  check(cropTool.getAttribute('aria-pressed') === 'true' && !editor.querySelector('[data-crop-actions]').hidden,
    'Crop-Symbol aktiviert das Zuschneidewerkzeug');
  check(selection.tabIndex === 0 && editor.querySelectorAll('[data-handle][tabindex="0"]').length === 8,
    'Auswahl und acht Skaliergriffe sind per Tastatur erreichbar');
  key(handle('e'), 'ArrowLeft', true);
  assertCrop({ x: 0, y: 0, w: 190, h: 100 }, 'Rechter Griff verkleinert die Auswahl per Tastatur');
  cropLock.click(); outputLock.click();
  editor.querySelector('[data-crop-cancel]').click();
  assertCrop({ x: 0, y: 0, w: 200, h: 100 }, 'Abbrechen stellt den vorherigen Ausschnitt wieder her');
  check(cropTool.getAttribute('aria-pressed') === 'false' && outputW.value === '200' && outputH.value === '100'
    && getComputedStyle(editor.querySelector('[data-crop-actions]')).display === 'none',
    'Abbrechen verwirft den unbestätigten Ausschnitt');
  check(!cropLock.checked && outputLock.checked, 'Abbrechen stellt auch die Verhältnisoptionen wieder her');
  cropTool.click();
  for (let i = 0; i < 10; i++) key(handle('e'), 'ArrowLeft', true);
  for (let i = 0; i < 4; i++) key(handle('s'), 'ArrowUp', true);
  key(selection, 'ArrowRight', true); key(selection, 'ArrowRight', true); key(selection, 'ArrowDown', true);
  assertCrop({ x: 20, y: 10, w: 100, h: 60 }, 'Auswahl lässt sich per Tastatur bewegen');
  for (const [name, forward, backward] of [
    ['nw', 'ArrowLeft', 'ArrowRight'], ['n', 'ArrowUp', 'ArrowDown'], ['ne', 'ArrowUp', 'ArrowDown'],
    ['e', 'ArrowRight', 'ArrowLeft'], ['se', 'ArrowRight', 'ArrowLeft'], ['s', 'ArrowDown', 'ArrowUp'],
    ['sw', 'ArrowLeft', 'ArrowRight'], ['w', 'ArrowLeft', 'ArrowRight'],
  ]) {
    key(handle(name), forward);
    check(cropValues().w !== 100 || cropValues().h !== 60, `Griff ${name} ändert die Auswahl`);
    key(handle(name), backward);
    assertCrop({ x: 20, y: 10, w: 100, h: 60 }, `Griff ${name} ist reversibel`);
  }
  cropLock.click();
  key(handle('e'), 'ArrowRight', true);
  assertCrop({ x: 20, y: 7, w: 110, h: 66 }, 'Verhältnissperre skaliert beide Maße am Seitengriff');
  key(handle('e'), 'ArrowLeft', true);
  assertCrop({ x: 20, y: 10, w: 100, h: 60 }, 'Proportionales Verkleinern hält die gegenüberliegende Kante');
  cropLock.click();
  result.dataset.ready = 'true';
  await new Promise(resolve => {
    window.imageRegression = {
      points(from, to) {
        const rect = editor.querySelector('img').getBoundingClientRect();
        const xy = ([x, y]) => ({ x: rect.left + rect.width * x / 200, y: rect.top + rect.height * y / 100 });
        return { from: xy(from), to: xy(to) };
      },
      assertCrop,
      lock() { cropLock.click(); },
      cancelGesture(pointerId = 1) {
        const preview = editor.querySelector('.image-editor-preview');
        preview.dispatchEvent(new PointerEvent('pointercancel', { pointerId, bubbles: true }));
      },
      finish() {
        const imageRect = editor.querySelector('img').getBoundingClientRect();
        const cropRect = selection.getBoundingClientRect();
        assertCrop({ x: 100, y: 0, w: 100, h: 100 }, 'Pointer zieht den rechten Bildbereich auf');
        check(Math.abs(cropRect.left - (imageRect.left + imageRect.width / 2)) < 2,
          'Schnittrahmen liegt über dem gezogenen Bildbereich');
        resolve();
      },
    };
  });
  input(outputW, 5);
  check(outputH.value === '5', 'Ausgabeverhältnis folgt dem neuen quadratischen Ausschnitt');
  editor.querySelector('[data-crop-confirm]').click();
  check(editor.querySelector('[data-crop-actions]').hidden && cropTool.getAttribute('aria-pressed') === 'false'
    && !editor.querySelector('[data-image-save]').disabled, 'OK bestätigt den gewählten Ausschnitt');
  check(!editor.querySelector('.image-editor-selection').hidden,
    'Bestätigter Ausschnitt bleibt im Bild als Vorschau markiert');
  cropTool.click();
  key(handle('w'), 'ArrowRight', true);
  editor.querySelector('[data-crop-cancel]').click();
  assertCrop({ x: 100, y: 0, w: 100, h: 100 }, 'Abbruch erneuter Bearbeitung erhält bestätigten Zuschnitt');
  check(outputW.value === '5' && outputH.value === '5' && !editor.querySelector('[data-image-save]').disabled,
    'Abbruch erhält bestätigte Ausgabegröße und Speicherfreigabe');
  editor.querySelector('[data-image-save]').click();
  await wait(() => savedFile && root.querySelectorAll('[data-variant-id]').length === 2);
  check(root.querySelectorAll('[data-asset-id]').length === 1, 'Variante erscheint nur beim Original');
  check(root.querySelector(`[data-variant-id="${variantId}"]`).checked, 'Neue Variante ausgewählt');
  for (const card of root.querySelectorAll('.variant')) {
    check(card.querySelector('small').getBoundingClientRect().top >= card.querySelector('img').getBoundingClientRect().bottom,
      'Dateigröße steht unter dem jeweiligen Bild');
  }
  check(savedFile.name === 'Test-variante.png', 'Variante bekommt PNG-Namen');
  const bitmap = await createImageBitmap(savedFile);
  check(bitmap.width === 5 && bitmap.height === 5, 'Ausgabe entspricht Verkleinerung');
  const verify = document.createElement('canvas'); verify.width = 5; verify.height = 5;
  const out = verify.getContext('2d'); out.drawImage(bitmap, 0, 0);
  const pixel = out.getImageData(2, 2, 1, 1).data;
  check(pixel[2] > 240 && pixel[0] < 15, 'Ausschnitt enthält den rechten blauen Bildbereich');
  bitmap.close();
  check(state.assets[0].bytes === originalBlob.size, 'Original bleibt unverändert');
  root.querySelector(`[data-variant-id="${originalId}"]`).click();
  check(root.querySelector(`[data-variant-id="${originalId}"]`).checked, 'Original wieder auswählbar');
  root.querySelector(`[data-variant-id="${variantId}"]`).click();
  root.querySelector('[data-select]').click();
  check((await pending).id === variantId, 'Picker liefert die gewählte Variante');
  const second = openAssetManager(services, { mode: 'image' });
  await wait(() => document.querySelector('[data-asset-manager]')?.shadowRoot.querySelector('[data-asset-id]'));
  const nextRoot = document.querySelector('[data-asset-manager]').shadowRoot;
  nextRoot.querySelector(`[data-asset-id="${originalId}"]`).click();
  nextRoot.querySelector('[data-delete-asset]').click();
  await wait(() => nextRoot.querySelector('[data-delete-asset-accept]'));
  nextRoot.querySelector('[data-delete-asset-accept]').click();
  await wait(() => !state.assets.some(item => item.id === originalId));
  check(state.assets.length === 1 && !Object.hasOwn(state.assets[0], 'variantOf'),
    'Löschen des Originals erhält die Variante als eigenständiges Bild');
  await wait(() => nextRoot.querySelector(`[data-asset-id="${variantId}"]`));
  nextRoot.querySelector(`[data-asset-id="${variantId}"]`).click();
  nextRoot.querySelector('[data-delete-asset]').click();
  await wait(() => nextRoot.querySelector('[data-delete-asset-accept]'));
  nextRoot.querySelector('[data-delete-asset-accept]').click();
  await wait(() => state.assets.length === 0);
  check(state.assets.length === 0, 'Einzelnes Bild lässt sich nach Bestätigung löschen');
  nextRoot.querySelector('[data-close]').click();
  check(await second === null, 'Manager schließt ohne Auswahl');
  result.dataset.result = 'pass'; result.textContent = JSON.stringify({ checks });
} catch (error) {
  result.dataset.result = 'fail'; result.textContent = `${error.stack || error}`;
}
</script>
