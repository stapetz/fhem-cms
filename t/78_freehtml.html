<!doctype html>
<meta charset="utf-8">
<title>Passive free HTML and live image regression</title>
<pre id="result">RUNNING</pre>
<script type="module">
import { checkSource, extractDevices, isSafeCss, renderTemplate, sanitize } from '../www/fhem-cms/js/freehtml.js';
import { diagnoseFreeHtml } from '../www/fhem-cms/js/freehtml-diagnostics.js';
import { createWidgetElement } from '../www/fhem-cms/js/widget-factory.js';
import { Schema5DraftController } from '../www/fhem-cms/js/fcui-schema5-draft.js';
import { Schema5WidgetSession } from '../www/fhem-cms/js/fcui-schema5-widget-session.js';
const output = document.querySelector('#result');
let checks = 0;
const check = (value, message) => { if (!value) throw new Error(message); checks++; };
try {
  for (const char of ['x', 'ä', '😀']) {
    const atLimit = char.repeat(50000);
    check(checkSource(atLimit) === null, 'HTML accepts 50000 Unicode characters');
    check(checkSource(atLimit + char)?.includes('aktuell 50001'), 'HTML rejects 50001 Unicode characters');
  }
  const solar = `<div style="font-family: system-ui, -apple-system, sans-serif; color: inherit; display: flex; flex-direction: column; gap: 14px;">
    <!-- Kopfzeile -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(128,128,128,0.25); padding-bottom: 8px;">
      <strong style="font-size: 1.1em;">☀️ Solaranlage Übersicht</strong>
      <span style="background: rgba(16, 185, 129, 0.15); color: #10b981; padding: 2px 10px; border-radius: 12px; font-size: 0.85em; font-weight: 600;">Status: {{virtualSolar:state|default(unbekannt)}}</span>
    </div>
    <!-- Aktuelle Leistungswerte -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px;">
      <div style="background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 10px; padding: 10px; text-align: center;">
        <div style="font-size: 0.8em; opacity: 0.8;">☀️ PV Erzeugung</div>
        <div style="font-size: 1.25em; font-weight: 700; color: #f59e0b; margin: 4px 0;">{{virtualSolar:pv_total_power|round(1)|suffix( W)}}</div>
        <div style="font-size: 0.75em; opacity: 0.75;">Std: {{virtualSolar:statEnergyTotalHour|round(2)|suffix( kWh)}}</div>
      </div>
    </div>
    <!-- Ertragstabelle -->
    <div style="background: rgba(128, 128, 128, 0.08); border-radius: 10px; padding: 10px; overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; font-size: 0.88em; text-align: right;">
        <thead><tr style="border-bottom: 1px solid rgba(128,128,128,0.25); opacity: 0.8;"><th style="text-align: left; padding: 6px 4px;">Anlagenteil</th><th style="padding: 6px 4px;">Stunde</th></tr></thead>
        <tbody><tr style="border-bottom: 1px solid rgba(128,128,128,0.12);"><td style="text-align: left; padding: 6px 4px; font-weight: 600;">🏠 Dach</td><td style="padding: 6px 4px;">{{virtualSolar:statEnergyDachHour|round(2)}}</td></tr></tbody>
      </table>
    </div>
  </div>`;
  check(checkSource(solar) === null, 'reported commented solar layout is accepted');
  const renderedSolar = renderTemplate(sanitize(solar), (_device, reading) => reading === 'state' ? 'on' : '12.345');
  check(renderedSolar.textContent.includes('12.3 W'), 'solar readings and filters still render');
  check(renderedSolar.querySelector('[style*="display: grid"]'), 'grid layout survives');
  check(renderedSolar.querySelector('table td').textContent.includes('Dach'), 'table content survives');
  const image = '<img src="{{MeinElch:vehicle_images_exteriorImageUrl}}" alt="Fahrzeug" width="100%">';
  check(checkSource(image) === null, 'requested live image syntax is accepted');
  check(extractDevices(image).join() === 'MeinElch', 'image-only reading source is subscribed');
  const template = sanitize(image);
  check(!template.querySelector('img').hasAttribute('src'), 'unresolved source cannot initiate a request');
  for (const value of ['media/car.jpg', '/fhem/fhem-cms/CMS/media/car.jpg', 'https://example.test/car.jpg?a=1&b=2']) {
    const result = renderTemplate(template, () => value);
    check(result.querySelector('img').getAttribute('src') === value, 'safe live URL is applied: ' + value);
    check(result.querySelector('img').getAttribute('referrerpolicy') === 'no-referrer', 'external image does not expose page URL');
  }
  for (const value of ['javascript:alert(1)', 'data:image/svg+xml,<svg/>', '//example.test/car.jpg', '', '" onerror="alert(1)']) {
    const result = renderTemplate(template, () => value);
    check(!result.querySelector('img').hasAttribute('src'), 'unsafe live URL blocked');
    check(result.querySelector('[role="status"]'), 'invalid live URL explicitly reported');
  }
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="pv"><stop offset="0%" stop-color="#ff0"/></linearGradient></defs><path d="M0 0 L10 10" fill="url(#pv)"/><text x="5" y="20">{{virtualSolar:state}}</text></svg>';
  check(checkSource(svg) === null, 'static SVG with local gradient is accepted');
  const renderedSvg = renderTemplate(sanitize(svg), () => 'on');
  check(renderedSvg.querySelector('path').namespaceURI === 'http://www.w3.org/2000/svg', 'SVG namespace preserved');
  check(renderedSvg.querySelector('linearGradient'), 'SVG mixed-case tag preserved');
  check(renderedSvg.querySelector('svg').getAttribute('viewBox') === '0 0 100 100', 'SVG mixed-case attribute preserved');
  check(renderedSvg.querySelector('text').textContent === 'on', 'SVG text receives readings');
  const patternSource = '<svg viewBox="0 0 20 20"><defs><pattern id="dots" width="0.2" height="0.2" patternUnits="objectBoundingBox"><circle cx="5" cy="5" r="2" fill="teal"/></pattern></defs><rect width="100%" height="100%" fill="url(#dots)"/></svg>';
  check(checkSource(patternSource) === null, 'local SVG pattern validates');
  const patternSvg = renderTemplate(sanitize(patternSource), () => '').querySelector('svg');
  check(patternSvg.querySelector('pattern')?.namespaceURI === 'http://www.w3.org/2000/svg', 'SVG pattern survives sanitizer');
  check(patternSvg.querySelector('rect').getAttribute('fill') === 'url(#dots)', 'SVG pattern is applied through a local reference');
  const requestedCss = '.pv{fill:url(#gpv);stroke:#93c5fd}.wl{fill:url(#gwall);stroke:rgba(255,255,255,.92);stroke-width:2}';
  const requestedSvg = `<style>${requestedCss}</style><svg viewBox="0 0 20 20"><defs><linearGradient id="gpv"><stop offset="0%" stop-color="red"/></linearGradient><radialGradient id="gwall"><stop offset="0%" stop-color="blue"/></radialGradient><pattern id="p" width="10" height="10" viewBox="0 0 10 10" patternTransform="rotate(45)" style="opacity:1"><path id="lf" d="M0 0L10 10"/></pattern></defs><rect class="pv" width="10" height="10"/><g class="wl"><use href="#lf"/></g></svg>`;
  check(checkSource(requestedSvg) === null, 'requested CSS and SVG definitions validate together');
  const requestedRendered = renderTemplate(sanitize(requestedSvg), () => '');
  check(requestedRendered.querySelector('style').textContent === requestedCss, 'requested SVG CSS survives sanitizing');
  check(requestedRendered.querySelector('pattern').getAttribute('patternTransform') === 'rotate(45)', 'SVG pattern transform survives');
  check(requestedRendered.querySelector('pattern').getAttribute('style') === 'opacity:1', 'SVG inline style survives');
  check(requestedRendered.querySelector('use').getAttribute('href') === '#lf', 'SVG use retains same-SVG reference');
  const requestedHost = document.createElement('div');
  document.body.append(requestedHost);
  requestedHost.attachShadow({ mode: 'open' }).append(requestedRendered);
  check(getComputedStyle(requestedHost.shadowRoot.querySelector('.pv')).fill.includes('#gpv'), 'requested SVG gradient CSS is applied');
  check(getComputedStyle(requestedHost.shadowRoot.querySelector('.wl')).stroke === 'rgba(255, 255, 255, 0.92)',
    'requested SVG rgba stroke CSS is applied');
  requestedHost.remove();
  const generatedContent = '<style>.wd::after{content:"N"}.sw[title^="3"] ~ .et .wd::after{content:"NO"}</style><div><i class="sw" title="30"></i><div class="et"><span class="wd"></span></div></div>';
  check(checkSource(generatedContent) === null, 'CSS generated content and attribute selectors validate');
  const contentHost = document.createElement('div');
  document.body.append(contentHost);
  contentHost.attachShadow({ mode: 'open' }).append(renderTemplate(sanitize(generatedContent), () => ''));
  check(getComputedStyle(contentHost.shadowRoot.querySelector('.wd'), '::after').content === '"NO"',
    'CSS generated content applies in widget shadow DOM');
  contentHost.remove();
  const rectangle = '<svg viewBox="0 0 100 100"><rect width="100%" height="12.5px" rx="2"/></svg>';
  check(checkSource(rectangle) === null, 'SVG rectangle dimensions validate');
  const renderedRectangle = renderTemplate(sanitize(rectangle), () => '').querySelector('rect');
  check(renderedRectangle.getAttribute('width') === '100%' && renderedRectangle.getAttribute('height') === '12.5px',
    'SVG rectangle dimensions survive sanitizing and rendering');
  const unsafeRectangle = sanitize('<svg><rect width="url(https://example.test/x)" height="-1"/></svg>').querySelector('rect');
  check(!unsafeRectangle.hasAttribute('width') && !unsafeRectangle.hasAttribute('height'), 'unsafe SVG dimensions removed');
  const animatedSvg = '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"><defs><path id="tree" d="M0 0L10 10"/><clipPath id="crop"><rect width="50" height="50"/></clipPath><mask id="shade"><rect width="100%" height="100%" fill="white"/></mask></defs><g transform="rotate({{Clock:angle}}, 50, 50)" clip-path="url(#crop)" mask="url(#shade)"><use href="#tree"/><text letter-spacing="2">Test</text><circle stroke-dashoffset="{{Battery:state|int}}"/></g></svg>';
  check(checkSource(animatedSvg) === null, 'dynamic SVG and local definitions are accepted');
  check(extractDevices(animatedSvg).join() === 'Battery,Clock', 'SVG reading sources are subscribed');
  const svgTemplate = sanitize(animatedSvg);
  const svgReading = renderTemplate(svgTemplate, (_device, reading) => reading === 'angle' ? '45' : '12.8');
  check(svgReading.querySelector('g').getAttribute('transform') === 'rotate(45, 50, 50)', `SVG transform resolves numeric reading: ${svgReading.innerHTML}`);
  check(svgReading.querySelector('circle').getAttribute('stroke-dashoffset') === '12', 'SVG dash offset resolves numeric reading');
  check(svgReading.querySelector('use').getAttribute('href') === '#tree', 'local SVG use resolves a target in the same SVG');
  check(svgReading.querySelector('clipPath') && svgReading.querySelector('mask'), 'clipPath and mask keep SVG namespace and names');
  const invalidSvgReading = renderTemplate(svgTemplate, () => '1) url(https://example.test/x)');
  check(!invalidSvgReading.querySelector('g').hasAttribute('transform'), 'unsafe reading does not reach SVG transform');
  check(invalidSvgReading.querySelector('[role="status"]'), 'invalid SVG reading reports a warning');
  const foreignTarget = renderTemplate(sanitize('<svg><use href="#outside"/></svg><svg><path id="outside" d="M0 0"/></svg>'), () => '');
  check(!foreignTarget.querySelector('use').hasAttribute('href'), 'SVG use cannot reference a different SVG');
  check(foreignTarget.querySelector('[role="status"]'), 'missing local SVG use target reports a warning');
  const dynamicWidget = createWidgetElement({ id: 'dynamic-svg', type: 'fhem-html', html: animatedSvg,
    devices: ['Battery', 'Clock'] }, {}, new Map([['Clock', [{ readings: { angle: '10' } }]],
    ['Battery', [{ readings: { state: '60' } }]]]), true);
  document.body.append(dynamicWidget);
  check(dynamicWidget.shadowRoot.querySelector('g').getAttribute('transform') === 'rotate(10, 50, 50)', 'widget displays SVG reading');
  dynamicWidget.data = new Map([['Clock', [{ readings: { angle: '80' } }]], ['Battery', [{ readings: { state: '40' } }]]]);
  check(dynamicWidget.shadowRoot.querySelector('g').getAttribute('transform') === 'rotate(80, 50, 50)', 'widget updates SVG transform');
  check(dynamicWidget.shadowRoot.querySelector('circle').getAttribute('stroke-dashoffset') === '40', 'widget updates SVG dash offset');
  check(dynamicWidget.shadowRoot.querySelector('use').getBBox().width === 10, 'local SVG use renders referenced geometry');
  dynamicWidget.data = new Map([['Clock', [{ readings: { angle: 'javascript:1' } }]]]);
  check(!dynamicWidget.shadowRoot.querySelector('g').hasAttribute('transform'), 'unsafe next reading removes previous SVG transform');
  check(dynamicWidget.shadowRoot.querySelector('[data-content] [role="status"]'), 'invalid SVG update reports warning');
  dynamicWidget.remove();
  const dynamicStyle = '<style>.sun{transform:translateX(calc(var(--sun-x) * 1px));letter-spacing:2px}</style><div class="sun" style="--sun-x:{{Solar:position}}">Sun</div>';
  check(checkSource(dynamicStyle) === null, 'numeric custom property and CSS transform validate');
  const styled = renderTemplate(sanitize(dynamicStyle), () => '25');
  document.body.append(styled);
  check(getComputedStyle(styled.querySelector('.sun')).transform === 'matrix(1, 0, 0, 1, 25, 0)', 'custom property applies live CSS transform');
  styled.remove();
  const sunStyle = '<div class="efw" id="root" style="--sun-pos:{{DWD:fc0_sunPct|default(50)}}%;--h:{{DWD:fc0_hour|default(14)}};--m:{{DWD:fc0_min|default(43)}}"></div>';
  check(checkSource(sunStyle) === null, 'numeric default filters validate in CSS custom properties');
  const sunTemplate = sanitize(sunStyle);
  const defaults = renderTemplate(sunTemplate, () => null).querySelector('#root');
  check(defaults.getAttribute('style') === '--sun-pos:50%;--h:14;--m:43', 'missing readings resolve to numeric CSS defaults');
  const readings = renderTemplate(sunTemplate, (_device, reading) =>
    ({fc0_sunPct: '72', fc0_hour: '8', fc0_min: '5'})[reading]).querySelector('#root');
  check(readings.getAttribute('style') === '--sun-pos:72%;--h:8;--m:5', 'numeric CSS defaults defer to present readings');
  const unsafeStyle = renderTemplate(sunTemplate, () => 'javascript:alert(1)').querySelector('#root');
  check(!unsafeStyle.hasAttribute('style'), 'unsafe reading cannot enter CSS through numeric default');
  const live = { schemaVersion: 6, theme: 'dark', settings: { layoutMode: 'grid', gridColumns: 12 },
    navigation: { orientation: 'horizontal', grid: { col: 1, row: 1, w: 12, h: 1 } },
    pages: [{ id: 'home', title: 'Start', layoutMode: 'freeform', canvas: { width: 800, height: 600 }, widgets: [] }] };
  let state = { live, draft: null, token: 'a'.repeat(64) };
  const controller = new Schema5DraftController({
    read: async () => structuredClone(state),
    save: async draft => { state = { live, draft, token: 'b'.repeat(64) }; },
    publish: async () => {}, discard: async () => {},
  });
  await controller.reload();
  const freeWidget = { id: 'h1', type: 'fhem-html', html: '', devices: [],
    rect: { x: 20, y: 30, w: 240, h: 140, z: 1 } };
  const session = new Schema5WidgetSession({ controller, pageId: 'home', token: state.token, widget: freeWidget, action: 'create' });
  const freeHost = createWidgetElement(session.widget, session.services({}), new Map(), false);
  document.body.append(freeHost);
  freeHost.openConfig({ isNew: true });
  freeHost.shadowRoot.querySelector('[name="title"]').value = 'Titel';
  await freeHost.onSave();
  check(state.draft?.pages[0].widgets[0].title === 'Titel', 'real empty HTML dialog saves title');
  check(JSON.stringify(state.draft.pages[0].widgets[0].rect) === JSON.stringify(freeWidget.rect),
    'real HTML dialog preserves freeform position');
  check(!Object.hasOwn(state.draft.pages[0].widgets[0], 'grid'), 'real HTML dialog does not save an empty grid');
  freeHost.remove();
  const savedWidget = state.draft.pages[0].widgets[0];
  const editSession = new Schema5WidgetSession({ controller, pageId: 'home', token: state.token, widget: savedWidget, action: 'update' });
  const editHost = createWidgetElement(editSession.widget, editSession.services({}), new Map(), false);
  document.body.append(editHost);
  editHost.openConfig();
  editHost.shadowRoot.querySelector('[name="html"]').value = rectangle;
  await editHost.onSave();
  check(state.draft.pages[0].widgets[0].html === rectangle, 'real HTML dialog saves SVG rectangle');
  check(JSON.stringify(state.draft.pages[0].widgets[0].rect) === JSON.stringify(freeWidget.rect),
    'editing HTML preserves freeform position');
  editHost.remove();
  const limitSession = new Schema5WidgetSession({ controller, pageId: 'home', token: state.token,
    widget: state.draft.pages[0].widgets[0], action: 'update' });
  const limitHost = createWidgetElement(limitSession.widget, limitSession.services({}), new Map(), false);
  document.body.append(limitHost);
  limitHost.openConfig();
  limitHost.shadowRoot.querySelector('[name="html"]').value = '😀'.repeat(50000);
  await limitHost.onSave();
  check(state.draft.pages[0].widgets[0].html === '😀'.repeat(50000), 'widget dialog saves 50000 Unicode characters');
  limitHost.remove();
  check(checkSource('<details id="more"><summary>Details</summary><figure><figcaption>PV</figcaption></figure></details>') === null, 'passive structure is allowed');
  const link = renderTemplate(sanitize('<a href="https://example.test/" target="_blank">Link</a>'), () => '');
  check(link.querySelector('a').getAttribute('rel') === 'noopener noreferrer', 'links cannot control opener');
  for (const bad of [
    '<script>alert(1)<\/script>', '<img src="javascript:x">', '<img src="media/x.jpg" onerror="x()">',
    '<iframe src="javascript:x"></iframe>', '<svg onload="x()"></svg>',
    '<svg><foreignObject><p>active</p></foreignObject></svg>', '<svg><use href="x"/></svg>',
    '<svg><animate attributeName="href"/></svg>', '<svg><path fill="url(https://example.test/x)"/></svg>',
    '<img src="{{MeinElch:image|prefix(javascript:)}}">', '<div style="background:url(javascript:x)">x</div>', '<!' + '-- unfinished',
  ]) check(checkSource(bad) !== null, 'active or malformed source rejected: ' + bad);
  const unsafe = renderTemplate(sanitize('<svg onload="x()"><script>x()<\/script><circle r="4"/></svg><img src="javascript:x" onerror="x()">'), () => '');
  check(!unsafe.querySelector('script, [onload], [onerror], img[src]'), 'sanitizer independently blocks active input');
  const snapshots = value => new Map([['MeinElch', [{ name: 'MeinElch',
    readings: { vehicle_images_exteriorImageUrl: value } }]]]);
  const host = createWidgetElement({ id: 'car', type: 'fhem-html', html: image, devices: ['MeinElch'] },
    {}, snapshots('media/car.jpg'), true);
  document.body.append(host);
  check(host.shadowRoot.querySelector('img').getAttribute('src') === 'media/car.jpg', 'real widget renders image reading');
  host.data = snapshots('javascript:alert(1)');
  check(!host.shadowRoot.querySelector('img').hasAttribute('src'), 'real widget clears previous image on unsafe update');
  check(host.shadowRoot.querySelector('[data-content] [role="status"]'), 'real widget displays invalid source warning');
  host.data = snapshots('media/new.jpg');
  check(host.shadowRoot.querySelector('img').getAttribute('src') === 'media/new.jpg', 'real widget recovers with next safe update');
  check(!host.shadowRoot.querySelector('[data-content] [role="status"]'), 'real widget clears stale warning');
  host.remove();
  for (const css of [
    '.badge{position:relative}.overlay{position:absolute}',
    '@keyframes flow{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}.flow{animation:flow 1s infinite}',
    '.badge{position:fixed}.header{position:sticky}',
    '.image{background:url(media/pv.png)}',
    '.image{background:url("https://example.test/pv.png?a=1&b=2")}',
    '@import "https://example.test/theme.css";',
    '@import url("https://example.test/theme.css") screen;',
    '.flow{fill:url(#pv)}',
  ]) check(isSafeCss(css), 'requested safe CSS accepted: ' + css);
  for (const css of [
    '.image{background:url(javascript:x)}', '@import "ftp://example.test/theme.css";',
    '.image{background:url(//example.test/x)}', '.image{background:url(data:image/svg+xml,x)}',
    '.image{background:u/**/rl(jav/**/ascript:x)}', '@import;', '.x{background:url("unterminated)}',
    '.image{background:u\\72l(x)}', '.x{color:expression(alert(1))}', '/* unfinished',
  ]) check(!isSafeCss(css), 'unsafe or malformed CSS rejected: ' + css);
  const mapUrl = 'https://www.openstreetmap.org/export/embed.html?bbox=1%2C2%2C3%2C4&layer=mapnik';
  const mapHtml = `<iframe src="${mapUrl}" width="100%" height="300" frameborder="0" loading="lazy" title="Standort"></iframe>`;
  check(checkSource(mapHtml) === null, 'OpenStreetMap embed accepted');
  const map = renderTemplate(sanitize(mapHtml), () => '').querySelector('iframe');
  check(map.getAttribute('src') === mapUrl, 'map source preserved');
  check(map.getAttribute('sandbox') === 'allow-scripts', 'map cannot navigate parent, open popups or access origin storage');
  check(map.getAttribute('referrerpolicy') === 'no-referrer', 'map receives no page referrer');
  check(map.getAttribute('width') === '100%' && map.getAttribute('height') === '300', 'map dimensions preserved');
  for (const bad of [
    '<iframe src="data:text/html,x"></iframe>',
    '<iframe src="https://openstreetmap.org/export/embed.html" srcdoc="active"></iframe>',
    '<iframe src="https://openstreetmap.org/export/embed.html" sandbox="allow-same-origin"></iframe>',
    '<iframe src="https://openstreetmap.org/export/embed.html" onload="x()"></iframe>',
  ]) check(checkSource(bad) !== null, 'untrusted map options rejected');
  const animationHtml = '<style>@keyframes flow{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}.flow{animation:flow 1s linear infinite}.badge{position:fixed;top:5px;left:5px}</style><svg viewBox="0 0 100 100"><path class="flow" d="M0 0 L100 100" stroke="#fff"/></svg><div class="badge">Badge</div>';
  const animated = createWidgetElement({ id: 'pv', type: 'fhem-html', html: animationHtml, devices: [] }, {}, new Map(), true);
  animated.style.cssText = 'width:300px;height:200px;margin-left:100px;display:block';
  document.body.append(animated);
  check(getComputedStyle(animated.shadowRoot.querySelector('.flow')).animationName === 'flow', 'SVG CSS animation survives rendering');
  const bounds = animated.getBoundingClientRect();
  const badge = animated.shadowRoot.querySelector('.badge').getBoundingClientRect();
  check(badge.left >= bounds.left && badge.right <= bounds.right, 'fixed badge remains in widget rather than viewport');
  animated.remove();
  const smil = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="10"><animate attributeName="r" attributeType="XML" values="10;20;10" dur="2s" repeatCount="indefinite"/></circle></svg>';
  check(checkSource(smil) === null, 'passive SVG animate validates');
  const smilHost = document.createElement('div');
  smilHost.style.cssText = 'position:fixed;inset:0;width:100px;height:100px';
  document.body.append(smilHost);
  smilHost.attachShadow({ mode: 'open' }).append(renderTemplate(sanitize(smil), () => ''));
  const smilSvg = smilHost.shadowRoot.querySelector('svg');
  check(smilSvg.querySelector('animate').getAttribute('attributeName') === 'r', 'SMIL animation target survives sanitizing');
  await new Promise(resolve => requestAnimationFrame(resolve));
  smilSvg.pauseAnimations();
  smilSvg.setCurrentTime(0);
  await new Promise(resolve => requestAnimationFrame(resolve));
  const initialSmilWidth = smilSvg.querySelector('circle').getBBox().width;
  check(Math.abs(initialSmilWidth - 20) < 0.1, 'SVG animate starts at its declared geometry');
  let animatedSmilWidth = initialSmilWidth;
  for (let frame = 0; frame < 20; frame++) {
    smilSvg.setCurrentTime(0.5);
    await new Promise(resolve => requestAnimationFrame(resolve));
    animatedSmilWidth = smilSvg.querySelector('circle').getBBox().width;
    if (Math.abs(animatedSmilWidth - 30) < 0.1) break;
  }
  check(Math.abs(animatedSmilWidth - 30) < 0.1,
    `SVG animate actually changes geometry (${initialSmilWidth} -> ${animatedSmilWidth})`);
  smilHost.remove();
  const dashboard = await (await fetch('fixtures/volvo_dashboard.html')).text();
  check(checkSource(dashboard) === null, 'complete reported Volvo dashboard validates with corrected map source');
  const values = {
    state_batteryChargeLevel: '72.9', authStatus: 'authenticated', state_chargingStatus: 'CHARGING',
    location_latitude: '52.5', location_longitude: '13.4', vehicle_images_exteriorImageUrl: 'media/exterior.jpg',
    vehicle_images_internalImageUrl: 'media/interior.jpg',
  };
  const dashboardTemplate = sanitize(dashboard);
  const draw = () => renderTemplate(dashboardTemplate, (_device, reading) => values[reading] ?? '1');
  const dash = draw();
  check(dash.querySelector('.vd-bar-fill').style.width === '72%', 'numeric style placeholder sets battery width');
  check(dash.querySelector('.vd-badge-ok').textContent === 'API: Verbunden', 'colon-delimited mapping renders');
  check(dash.textContent.includes('Lädt'), 'Unicode charging mapping renders');
  check(dash.querySelector('iframe').getAttribute('src').includes('marker=52.5%2C13.4'), 'numeric coordinate placeholders resolve');
  check(!dashboardTemplate.querySelector('iframe').hasAttribute('src'), 'pending map template cannot load');
  check(dash.querySelectorAll('img[src]').length === 2, 'both reading images resolve');
  values.state_batteryChargeLevel = '33';
  check(draw().querySelector('.vd-bar-fill').style.width === '33%', 'battery bar updates from latest reading');
  values.state_batteryChargeLevel = '1;position:fixed';
  check(!draw().querySelector('.vd-bar-fill').hasAttribute('style'), 'CSS injection in numeric reading blocked');
  check(draw().querySelector('[role="status"]'), 'invalid numeric style reading reported');
  for (const coordinate of ['91', '', '0&other=1', 'NaN']) {
    values.location_latitude = coordinate;
    check(!draw().querySelector('iframe').hasAttribute('src'), 'invalid latitude cannot load a map');
  }
  values.location_latitude = '52.5';
  values.location_longitude = '181';
  check(!draw().querySelector('iframe').hasAttribute('src'), 'longitude outside earth bounds blocked');
  check(checkSource('<iframe src="https://openstreetmap.org{{MeinElch:location_latitude}}%2C{{MeinElch:location_longitude}}"></iframe>') !== null, 'malformed original map URL rejected');
  check(isSafeCss('scroll-behavior:smooth;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35))'), 'scroll-behavior is not legacy behavior');
  check(!isSafeCss('behavior:url(https://example.test/x)'), 'legacy executable behavior still blocked');
  check(!isSafeCss('-moz-binding:url(https://example.test/x)'), 'legacy executable binding still blocked');
  check(checkSource('<div style="width:{{Temp:state|prefix(1)}}%"></div>') !== null, 'non-numeric style filter rejected');
  dash.querySelector('iframe').remove();
  dash.querySelectorAll('img').forEach(img => img.removeAttribute('src'));
  document.body.append(dash);
  check(getComputedStyle(dash.querySelector('.vd-slider')).scrollBehavior === 'smooth', 'full reported stylesheet survives sanitizer and applies');
  check(getComputedStyle(dash.querySelector('.vd-top-grid')).display === 'grid', 'full dashboard layout is preserved');
  dash.remove();
  const policy = await (await fetch('fixtures/freehtml_policy.json')).json();
  const numericTable = createWidgetElement({ id: 'numeric-table', type: 'fhem-html', devices: [],
    html: '<table><tbody><tr><td style="padding: 6px 4px; text-align: right; font-variant-numeric: tabular-nums;">123</td></tr></tbody></table>' }, {}, new Map(), true);
  document.body.append(numericTable);
  check(getComputedStyle(numericTable.shadowRoot.querySelector('td')).fontVariantNumeric === 'tabular-nums', 'existing table numeric typography survives sanitizing and rendering');
  numericTable.remove();
  for (const [source, expected] of policy.css) check(isSafeCss(source) === expected, 'CSS positive policy: ' + source);
  for (const [source, expected] of policy.html) check((checkSource(source) === null) === expected, 'HTML positive policy: ' + source);
  const states = '<style>[data-value^="-"]{color:red}[data-state="on"]{font-weight:700}</style><div data-value="{{Sensor:power|int}}" data-state="{{Sensor:state}}">{{Sensor:state}}</div>';
  const stateTemplate = sanitize(states);
  const stateHost = document.createElement('div');
  stateHost.attachShadow({ mode: 'open' });
  document.body.append(stateHost);
  const drawState = (power, state) => {
    stateHost.shadowRoot.replaceChildren(renderTemplate(stateTemplate, (_device, reading) => reading === 'power' ? power : state));
    return stateHost.shadowRoot.querySelector('[data-value]');
  };
  let stateNode = drawState('-12.3', 'on');
  check(stateNode.dataset.value === '-12' && stateNode.dataset.state === 'on', 'data readings are resolved as attribute text');
  check(getComputedStyle(stateNode).color === 'rgb(255, 0, 0)', 'negative reading attribute selector applies');
  check(getComputedStyle(stateNode).fontWeight === '700', 'state attribute selector applies');
  stateNode = drawState('12', '" onload="x');
  check(stateNode.dataset.state === '" onload="x' && !stateNode.hasAttribute('onload'), 'attribute text cannot inject eventhandler');
  check(getComputedStyle(stateNode).color !== 'rgb(255, 0, 0)', 'new reading clears previous selector match');
  stateHost.remove();
  const frameTemplate = sanitize('<iframe src="{{Sensor:panelUrl}}"></iframe>');
  for (const url of ['http://grafana.local:3000/panel', 'https://weather.test/radar', '/local/panel']) {
    const frame = renderTemplate(frameTemplate, () => url).querySelector('iframe');
    check(frame.getAttribute('src') === url, 'arbitrary approved frame source resolves');
    check(frame.getAttribute('sandbox') === 'allow-scripts', 'arbitrary frames retain immutable sandbox');
  }
  check(!renderTemplate(frameTemplate, () => 'javascript:x').querySelector('iframe').hasAttribute('src'), 'unsafe live frame URL blocked');
  const anchors = createWidgetElement({ id: 'slider', type: 'fhem-html', devices: [],
    html: '<style>#slide1:TARGET{color:red}[data-state=":target"]{opacity:.6}.image{background:url(https://example.test/:target.png)}</style><a href="#slide1" rel="nofollow">Slide</a><div id="slide1">One</div><a href="#missing">Missing</a>' }, {}, new Map(), true);
  document.body.append(anchors);
  const beforeHash = location.hash;
  anchors.shadowRoot.querySelector('a').click();
  check(location.hash === beforeHash, 'widget fragment does not navigate CMS page router');
  check(anchors.shadowRoot.querySelector('#slide1').hasAttribute('data-cms-fragment-target'), 'widget-local target is marked');
  check(getComputedStyle(anchors.shadowRoot.querySelector('#slide1')).color === 'rgb(255, 0, 0)', 'target pseudoclass works in shadow widget');
  check(anchors.shadowRoot.querySelector('[data-content] style').textContent.includes('[data-state=":target"]'), 'fragment rewrite preserves quoted selector values');
  check(anchors.shadowRoot.querySelector('[data-content] style').textContent.includes('url(https://example.test/:target.png)'), 'fragment rewrite preserves resource URLs');
  anchors.data = new Map();
  check(anchors.shadowRoot.querySelector('#slide1').hasAttribute('data-cms-fragment-target'), 'local anchor target survives live redraw');
  check(anchors.shadowRoot.querySelector('a').rel.includes('noopener') && anchors.shadowRoot.querySelector('a').rel.includes('nofollow'), 'rel preserves safe tokens and enforces protection');
  anchors.shadowRoot.querySelector('a[href="#missing"]').click();
  check(anchors.shadowRoot.querySelector('[data-cms-fragment-warning]'), 'missing widget anchor explicitly reported');
  anchors.remove();
  for (const [source, token, reason] of [
    ['<div style="border-mystery: 1px"></div>', 'border-mystery', 'unknown-property'],
    ['<div style="color: mystery-fn(1)"></div>', 'mystery-fn', 'unknown-function'],
    ['<div style="z-index: 101"></div>', '101', 'invalid-z-index'],
    ['<div style="color: @invalid"></div>', '@', 'invalid-value-token'],
  ]) {
    const diagnostic = diagnoseFreeHtml(source);
    check(diagnostic?.reason === reason && source.slice(diagnostic.start, diagnostic.end) === token,
      `CSS ${reason} highlights its exact token`);
  }
  check(!isSafeCss('.x{color:red;.y{z-index:1}}'), 'nested CSS rules inside declarations remain rejected');
  const commentedCss = '<style><!-- <img onerror="x"> --> /* z-index: 101; */\r\n.box{border-mystery:1px}</style>';
  const commentedDiagnostic = diagnoseFreeHtml(commentedCss);
  check(commentedDiagnostic?.reason === 'unknown-property'
    && commentedCss.slice(commentedDiagnostic.start, commentedDiagnostic.end) === 'border-mystery',
  `CSS diagnostics skip HTML and CSS comments while preserving original offsets: ${JSON.stringify(commentedDiagnostic)}`);
  const entityStyle = '<div title="a > b" style="color:red&#59; z-index:101"></div>';
  const entityDiagnostic = diagnoseFreeHtml(entityStyle);
  check(entityDiagnostic?.reason === 'invalid-z-index'
    && entityStyle.slice(entityDiagnostic.start, entityDiagnostic.end) === '101',
  'quoted greater-than and attribute entities retain source positions');
  const repeatedTag = '<!-- <script> --><div><script src=x>' + '</scr' + 'ipt></div>';
  const repeatedHref = '<svg><defs><linearGradient id="gradient"/></defs><use href="#gradient"/><use href="https://example.test/external.svg"/></svg>';
  const repeatedHrefDiagnostic = diagnoseFreeHtml(repeatedHref);
  check(repeatedHrefDiagnostic.start === repeatedHref.lastIndexOf('href='),
    'attribute diagnostics skip an earlier allowed occurrence and preserve mixed-case SVG positions');
  const conditionSource = '<div data-cms-class="Test:state=on:active; invalid"></div>';
  const conditionDiagnostic = diagnoseFreeHtml(conditionSource);
  check(conditionSource.slice(conditionDiagnostic.start, conditionDiagnostic.end) === 'invalid',
    'condition diagnostics highlight the exact invalid condition rather than its whole attribute');
  const repeatedDiagnostic = diagnoseFreeHtml(repeatedTag);
  check(repeatedDiagnostic?.reason === 'html-element'
    && repeatedTag.slice(repeatedDiagnostic.start, repeatedDiagnostic.end) === 'script'
    && repeatedDiagnostic.start === repeatedTag.lastIndexOf('<script') + 1,
  'repeated tags in comments and markup resolve to the actual offending occurrence');
  const multiline = '<p>😀\r\n<div style="z-index:101"></div>';
  const multilineDiagnostic = diagnoseFreeHtml(multiline);
  const errorLine = multiline.slice(multiline.lastIndexOf('\n') + 1, multilineDiagnostic.start);
  check(multilineDiagnostic.line === 2 && multilineDiagnostic.column === [...errorLine].length + 1,
    'diagnostic line and Unicode column handle CRLF');
  const minified = `<div title="${'x'.repeat(300)}" style="border-mystery:1px"></div>`;
  const minifiedDiagnostic = diagnoseFreeHtml(minified);
  check(minifiedDiagnostic.context.length <= 180 && minifiedDiagnostic.context.includes('border-mystery'),
    'long minified-line context stays bounded around the highlighted token');

  const diagnosticWidget = document.createElement('cms-html');
  diagnosticWidget.config = { id: 'diagnostic', type: 'fhem-html', html: '', devices: [], grid: { col: 1, row: 1, w: 1, h: 1 } };
  diagnosticWidget.services = { saveWidget: async () => {} };
  document.body.append(diagnosticWidget);
  diagnosticWidget.openConfig();
  const editor = diagnosticWidget.shadowRoot.querySelector('[name="html"]');
  const diagnosticPanel = diagnosticWidget.shadowRoot.querySelector('[data-diagnostic]');
  editor.value = '<img src=x onerror="window.freeHtmlDiagnosticExecuted=true">';
  editor.dispatchEvent(new Event('input', { bubbles: true }));
  check(diagnosticPanel.querySelector('img') === null
    && diagnosticPanel.querySelector('pre').textContent.includes('<img')
    && diagnosticPanel.querySelector('mark').textContent === 'onerror'
    && window.freeHtmlDiagnosticExecuted !== true,
  'untrusted diagnostic source is rendered as marked text, never as HTML');
  diagnosticWidget.shadowRoot.querySelector('[data-diagnostic-jump]').click();
  check(document.activeElement === diagnosticWidget && diagnosticWidget.shadowRoot.activeElement === editor
    && editor.value.slice(editor.selectionStart, editor.selectionEnd) === 'onerror',
  'diagnostic jump focuses the editor and selects the offending token');
  editor.value = '<div>valid</div>';
  editor.dispatchEvent(new Event('input', { bubbles: true }));
  check(diagnosticPanel.hidden, 'valid input clears stale diagnostics');
  diagnosticWidget.services.saveWidget = async () => { throw new Error('<img src=x onerror="x">'); };
  await diagnosticWidget.onSave();
  check(diagnosticWidget.shadowRoot.querySelector('[data-dialog-error]').textContent.includes('Keine genaue Quellposition')
    && diagnosticWidget.shadowRoot.querySelector('[data-dialog-error] img') === null,
  'backend errors use an explicit positionless fallback and remain text');
  editor.value = '<img>';
  editor.dispatchEvent(new Event('input', { bubbles: true }));
  check(diagnosticWidget.shadowRoot.querySelector('[data-dialog-error]').textContent === '',
    'new input clears stale save errors');
  diagnosticWidget.remove();
  output.dataset.result = 'pass';
  output.textContent = JSON.stringify({ checks });
} catch (error) {
  output.dataset.result = 'fail';
  output.textContent = error.stack;
}
</script>
