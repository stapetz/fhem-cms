<!doctype html>
<html lang="de">
<meta charset="utf-8">
<link rel="stylesheet" href="../www/fhem-cms/css/fcui-gridstack.css">
<link rel="stylesheet" href="../www/fhem-cms/css/fhem-cms.css">
<main class="cms-shell"><div id="root" class="cms-schema5-grid" style="width: 800px"></div></main>
<output id="result">pending</output>
<script type="module">
  import { mountFreeform } from '../www/fhem-cms/js/fcui-freeform-view.js';
  import { mountFreeformEditor } from '../www/fhem-cms/js/fcui-freeform-edit.js';
  import { mountSchema5Widgets } from '../www/fhem-cms/js/fcui-schema5-widgets.js';
  import { GridStack } from '../www/fhem-cms/js/fcui-runtime.js';
  const root = document.querySelector('#root');
  const result = document.querySelector('#result');
  const page = {canvas:{width:1000,height:500,scaling:'width'}, widgets:[
    {id:'right',rect:{x:400,y:20,w:200,h:120}},
    {id:'left',rect:{x:20,y:25,w:200,h:120}},
    {id:'hidden',rect:{x:20,y:200,w:200,h:100},hideOnMobile:true},
  ]};
  const render = id => Object.assign(document.createElement('button'), {textContent:id});
  const check = (condition, name) => { if (!condition) throw new Error(name); };
  const paint = () => new Promise(resolve => setTimeout(resolve, 150));
  try {
    const params = new URLSearchParams(location.search);
    if (params.has('responsive')) {
      root.style.width = '100%';
      const nav = Object.assign(document.createElement('nav'), {className:'cms-nav'});
      const burger = Object.assign(document.createElement('button'), {className:'cms-nav-burger', textContent:'☰'});
      nav.append(burger);
      for (const name of ['Start', 'Schalter']) {
        nav.append(Object.assign(document.createElement('a'), {className:'cms-nav-link', textContent:name, href:'#'}));
      }
      const canvas = {width:1000, height:800, scaling:'fit', mobileBehavior:'stack'};
      const grid = params.has('tablet') ? document.createElement('div') : undefined;
      const navigationRect = {x:0, y:0, w:900, h:48};
      const responsive = mountFreeform(root, {...page, canvas, navigationRect, widgets:grid ? [] : page.widgets}, nav, render, {
        tablet: Boolean(grid), grid,
        background: 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 5 4%27%3E%3Cpath fill=%27teal%27 d=%27M0 0h5v4H0z%27/%3E%3C/svg%3E',
      });
      window.addEventListener('pagehide', () => responsive.destroy(), {once:true});
      result.textContent = 'responsive ready';
    } else {
    let view = mountFreeform(root, page, document.createElement('nav'), render);
    await paint();
    check(view.getScale() > .75 && view.getScale() <= .8, 'width scale');
    const widget = view.wrappers.get('left');
    check(Math.abs(widget.getBoundingClientRect().width - 200 * view.getScale()) < 2, 'rendered width');
    view.destroy();
    root.replaceChildren();
    root.style.width = '500px';
    view = mountFreeform(root, page, document.createElement('nav'), render);
    if (matchMedia('(orientation: portrait)').matches) {
      check([...view.canvas.querySelectorAll('[data-widget-id]')].map(node => node.dataset.widgetId).join() === 'left,right,hidden', 'mobile DOM order');
      check(view.wrappers.get('hidden').getBoundingClientRect().width === 0, 'mobile visibility');
    } else {
      check(view.getScale() <= .5 && !view.canvas.closest('.cms-freeform-stack'), 'narrow landscape retains canvas');
    }
    view.destroy();
    root.replaceChildren();
    root.style.width = '800px';
    const config = {schemaVersion: 6, settings: {layoutMode:'grid',gridColumns:12, pageCanvas:page.canvas,
      pageNavigationRect:{x:50,y:350,w:500,h:55}},
      navigation: {grid:{col:1,row:1,w:12,h:1}}, pages:[
        {id:'grid', widgets:[{id:'text',type:'text',markdown:'Grid',grid:{col:1,row:12,w:4,h:3}}]},
        {id:'canvas',layoutMode:'freeform',canvas:page.canvas,navigationRect:{x:50,y:350,w:500,h:55},widgets:page.widgets.map(widget => ({
          ...widget,type:'text',markdown:widget.id,
        }))},
      ]};
    const editing = {onEdit:() => {}, onChange:() => {}, onFreeformChange:() => {}};
    if (new URLSearchParams(location.search).has('grid')) {
      root.classList.add('grid-stack');
      config.pages[0].widgets[0].grid.row = 3;
      const grid = mountSchema5Widgets(GridStack, root, config, 'grid', document.createElement('nav'), {}, new Map(), editing);
      window.addEventListener('pagehide', () => grid.destroy(), {once:true});
      result.textContent = 'grid ready';
    } else if (new URLSearchParams(location.search).has('navigation')) {
      root.classList.add('cms-grid-guides');
      editing.onFreeformChange = (id, rect) => { result.dataset.saved = JSON.stringify({id, rect}); };
      const freeform = mountSchema5Widgets(GridStack, root, config, 'grid', document.createElement('nav'), {}, new Map(), editing);
      window.addEventListener('pagehide', () => freeform.destroy(), {once:true});
      result.textContent = 'navigation ready';
    } else {
    root.classList.add('grid-stack');
    const canvasStart = root.getBoundingClientRect().top;
    for (let i=0;i<2;i++) {
      const grid = mountSchema5Widgets(GridStack, root, config, 'grid', document.createElement('nav'), {}, new Map(), editing);
      check(root.querySelectorAll('.grid-stack-item:not(.cms-responsive-navigation) > .ui-resizable-handle').length === 8, 'eight native Grid resize handles');
      const raster = root.querySelector('.cms-shared-canvas-grid');
      check(parseFloat(raster.style.height) > 500, 'tall Grid gets inline height inside the shared frame');
      const gridBounds = root.querySelector('.cms-freeform-canvas').getBoundingClientRect();
      const gridNav = root.querySelector('.cms-freeform-navigation').getBoundingClientRect();
      grid.destroy();
      const freeform = mountSchema5Widgets(GridStack, root, config, 'canvas', document.createElement('nav'), {}, new Map(), editing);
      check(root.style.height === '', 'Grid height does not survive in Freeform');
      check(Math.abs(root.querySelector('.cms-freeform-canvas').getBoundingClientRect().top - canvasStart) < 2, 'canvas starts at top after Grid');
      check(root.querySelector('.cms-freeform-canvas .cms-freeform-navigation nav'), 'navigation is inside canvas');
      check(root.querySelector('.cms-freeform-navigation').style.left === '50px', 'custom navigation position');
      const size = root.querySelector('.cms-freeform-canvas').getBoundingClientRect();
      const navSize = root.querySelector('.cms-freeform-navigation').getBoundingClientRect();
      check(size.width === gridBounds.width && size.height === gridBounds.height, 'canvas has equal dimensions in both modes');
      check(['x','y','width','height'].every(key => navSize[key] === gridNav[key]), 'navigation has identical bounds across modes');
      check(root.querySelector('.cms-freeform-widget > .cms-widget-tools > .cms-widget-config'), 'widget actions are local');
      freeform.destroy();
    }
    view = mountFreeform(root, page, document.createElement('nav'), render, {phone:true});
    check(Boolean(view.canvas.closest('.cms-freeform-stack')) === matchMedia('(orientation: portrait)').matches,
      'phone preview respects orientation');
    view.destroy();
    root.replaceChildren();
    const nav = document.createElement('nav');
    view = mountFreeform(root, page, nav, render, {editing:true});
    for (const wrapper of view.wrappers.values()) {
      const tools = document.createElement('div');
      tools.className = 'cms-widget-tools';
      const move = document.createElement('button');
      move.dataset.dir = 'move';
      tools.append(move);
      wrapper.append(tools);
    }
    let saved;
    const cleanup = mountFreeformEditor(root, page, view, {
      selectedWidget:'left', onEdit:() => {}, onFreeformChange:(id,rect) => { saved = {id,rect}; },
    }, nav);
    root.querySelector('[data-dir="move"]').dispatchEvent(new KeyboardEvent('keydown', {
      key:'ArrowRight', shiftKey:true, bubbles:true,
    }));
    check(saved?.id === 'left' && saved.rect.x === 30, 'keyboard move');
    saved = undefined;
    const geometry = view.wrappers.get('left').querySelector('.cms-widget-geometry');
    geometry.click();
    const properties = root.querySelector('.cms-freeform-properties');
    const [x, y, width, height] = properties.querySelectorAll('input[type=number]');
    const level = properties.querySelector('output');
    check([...properties.querySelectorAll('.cms-freeform-property-row')].map(row => row.getAttribute('aria-label')).join() ===
      'Position,Größe,Ebene', 'geometry uses three groups');
    x.value = 60;
    properties.querySelector('[aria-label="Ebene um eins erhöhen"]').click();
    check(level.value === '2' && !saved, 'layer changes locally by one');
    x.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape', bubbles:true, cancelable:true}));
    check(!properties.matches(':popover-open') && document.activeElement === geometry && !saved, 'ESC cancels and returns focus');
    geometry.click();
    check(x.value === '20' && level.value === '1', 'reopen shows saved values after ESC');
    width.value = 205;
    properties.querySelector('[aria-label="Abbrechen"]').click();
    geometry.click();
    check(width.value === '200' && !saved, 'Abbrechen discards width');
    [x.value, y.value, width.value, height.value] = ['30','40','210','125'];
    properties.querySelector('[aria-label="Ebene um eins verringern"]').click();
    properties.querySelector('[aria-label="Geometrie übernehmen"]').click();
    check(JSON.stringify(saved?.rect) === '{"x":30,"y":40,"w":210,"h":125,"z":0}' &&
      !properties.matches(':popover-open'), 'Übernehmen saves the full geometry once');
    geometry.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape', bubbles:true}));
    check(!root.querySelector('.cms-widget-selected, .cms-freeform-handles') &&
      !view.wrappers.get('left').contains(document.activeElement), 'ESC clears selection and its focused move outline');
    window.addEventListener('pagehide', () => { cleanup(); view.destroy(); }, {once:true});
    root.addEventListener('freeform-check', () => { result.dataset.saved = JSON.stringify(saved); });
    result.textContent = '{"checks": 1}';
    result.dataset.result = 'pass';
    }
    }
  } catch (error) {
    result.textContent = `fail: ${error.message}`;
    result.dataset.result = 'fail';
  }
</script>
</html>
