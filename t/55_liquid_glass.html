<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Glass regression</title>
<link rel="stylesheet" href="../www/fhem-cms/css/fhem-cms.css">
<link rel="stylesheet" href="../www/fhem-cms/css/fcui-gridstack.css">
<main class="cms-shell"><div class="cms-schema5-workspace"><div id="grid" class="grid-stack cms-schema5-grid"></div></div></main>
<pre id="result">RUNNING</pre>
<script type="module">
import { GridStack } from '../www/fhem-cms/js/fcui-runtime.js';
import { Schema5View } from '../www/fhem-cms/js/fcui-schema5-view.js';
import { Schema5PagePanel } from '../www/fhem-cms/js/fcui-schema5-page-panel.js';

const first = `media/${'a'.repeat(32)}.png`;
const second = `media/${'b'.repeat(32)}.jpg`;
const config = {
  schemaVersion: 5, theme: 'liquid-glass',
  settings: { layoutMode: 'grid', gridColumns: 12, sharedBackground: false },
  navigation: { orientation: 'horizontal', grid: { col: 1, row: 1, w: 12, h: 1 } },
  pages: [
    { id: 'start', title: 'Start', background: first,
      widgets: [{ id: 'text', type: 'text', title: 'Wohnzimmer', html: '<p>Beispielansicht</p>',
        grid: { col: 1, row: 2, w: 5, h: 3 } }] },
    { id: 'room', title: 'Küche', background: second, widgets: [] },
  ],
};
const result = document.querySelector('#result');
let checks = 0;
const check = (condition, message) => { if (!condition) throw new Error(message); checks += 1; };
try {
  document.documentElement.dataset.cmsTheme = config.theme;
  const view = new Schema5View({ GridStack, root: document.querySelector('#grid'), status: result,
    config, client: { jsonlist: async () => [], subscribe() {}, unsubscribe() {} }, services: {} });
  await view.start();
  check(document.documentElement.style.getPropertyValue('--cms-page-image').includes(first), 'start image');
  check(getComputedStyle(document.documentElement).backgroundImage.includes(first), 'start image rendered');
  const tile = document.querySelector('.grid-stack-item-content');
  check(getComputedStyle(tile).backdropFilter.includes('blur'), 'glass blur applied');
  config.settings.liquidIntensity = 100;
  config.settings.liquidTransparency = 60;
  await view.showPage('room');
  check(document.documentElement.style.getPropertyValue('--cms-page-image').includes(second), 'individual image');
  check(getComputedStyle(document.querySelector('.grid-stack-item-content')).backdropFilter === 'blur(30px)',
    'saved intensity changes live blur');
  check(getComputedStyle(document.documentElement).getPropertyValue('--cms-liquid-opacity') === '0.4',
    'saved transparency changes live opacity');
  check(getComputedStyle(document.querySelector('.grid-stack-item-content')).getPropertyValue('--cms-surface').trim()
    === 'rgb(19 34 52 / 0.4)', 'widget surface uses saved transparency');
  check(getComputedStyle(document.documentElement).getPropertyValue('--cms-surface').trim()
    === 'rgb(19 34 52 / 0.88)', 'editor surfaces remain readable');
  config.settings.sharedBackground = true;
  await view.showPage('start');
  const widget = document.querySelector('cms-text');
  const widgetTile = widget.closest('.grid-stack-item-content');
  check(getComputedStyle(widget.shadowRoot.querySelector('.tile')).backgroundColor === 'rgba(19, 34, 52, 0.4)',
    'actual widget transparency matches preview');
  check(getComputedStyle(widgetTile, '::after').backgroundImage.includes('0.2'),
    'actual widget receives the configured gloss');
  await view.showPage('room');
  check(document.documentElement.style.getPropertyValue('--cms-page-image').includes(first), 'shared image');
  config.settings.sharedBackground = false;
  await view.showPage('start');
  await view.showPage('room');
  check(document.documentElement.style.getPropertyValue('--cms-page-image').includes(second), 'individual image restored');
  view.stop();
  check(document.documentElement.style.getPropertyValue('--cms-page-image') === 'none', 'image cleared on stop');
  const dialog = document.createElement('dialog');
  dialog.className = 'cms-editor-panel cms-editor-dialog';
  dialog.dataset.panel = 'page';
  document.body.append(dialog);
  const controller = { snapshot: () => ({ live: config, token: 'test' }), saveDraft: async () => {} };
  new Schema5PagePanel({ root: dialog, controller, pageId: 'start', token: 'test', onClose() {} });
  dialog.showModal();
  const checkbox = [...dialog.querySelectorAll('label')].find(label =>
    label.textContent.trim() === 'Bild auf allen Seiten verwenden')?.querySelector('input[type="checkbox"]');
  check(Boolean(checkbox), 'shared background checkbox exists on the start page');
  check(checkbox.getBoundingClientRect().width > 0 && checkbox.getBoundingClientRect().height > 0,
    'shared background checkbox is visible');
  dialog.style.width = '300px';
  const bounds = dialog.getBoundingClientRect();
  const control = checkbox.getBoundingClientRect();
  check(control.left >= bounds.left && control.right <= bounds.right, 'checkbox fits a narrow dialog');
  check(dialog.textContent.includes('Hintergrundbild für aktuelle Seite „Start“'), 'current page title in dialog');
  check(dialog.textContent.includes('auf jeder Seite einzeln über die Seiteneinstellungen'), 'individual background hint');
  const intensity = dialog.querySelector('[data-liquid-intensity]');
  const transparency = dialog.querySelector('[data-liquid-transparency]');
  const preview = dialog.querySelector('.cms-liquid-preview');
  const card = dialog.querySelector('.cms-liquid-preview-card');
  check(getComputedStyle(preview).backgroundImage.includes(first), 'preview uses current background image');
  check(getComputedStyle(card).backdropFilter === 'blur(30px)', 'preview starts with saved blur');
  check(getComputedStyle(card).backgroundColor === 'rgba(19, 34, 52, 0.4)', 'preview starts with saved transparency');
  const gloss = getComputedStyle(card, '::after').backgroundImage;
  intensity.value = '0';
  intensity.dispatchEvent(new Event('input'));
  transparency.value = '0';
  transparency.dispatchEvent(new Event('input'));
  check(getComputedStyle(card).backdropFilter === 'blur(0px)', 'slider updates preview blur');
  check(getComputedStyle(card).backgroundColor === 'rgb(19, 34, 52)', 'slider updates preview transparency');
  check(getComputedStyle(card, '::after').backgroundImage !== gloss, 'slider updates preview gloss');
  check(config.settings.liquidIntensity === 100 && config.settings.liquidTransparency === 60,
    'preview does not mutate saved settings');
  dialog.close();
  dialog.remove();
  for (const theme of ['dark', 'light']) {
    config.theme = theme;
    config.settings.sharedBackground = false;
    document.documentElement.dataset.cmsTheme = theme;
    await view.start();
    check(getComputedStyle(document.documentElement).backgroundImage.includes(first), `${theme}: start image rendered`);
    await view.showPage('room');
    check(getComputedStyle(document.documentElement).backgroundImage.includes(second), `${theme}: individual image rendered`);
    config.settings.sharedBackground = true;
    await view.showPage('start');
    await view.showPage('room');
    check(getComputedStyle(document.documentElement).backgroundImage.includes(first), `${theme}: shared image rendered`);
    delete config.pages[0].background;
    await view.showPage('start');
    check(getComputedStyle(document.documentElement).backgroundImage === 'none', `${theme}: no image uses theme color`);
    config.pages[0].background = first;
    view.stop();
    const panel = document.createElement('dialog');
    panel.className = 'cms-editor-panel cms-editor-dialog';
    panel.dataset.panel = 'page';
    document.body.append(panel);
    new Schema5PagePanel({ root: panel, controller, pageId: 'start', token: 'test', onClose() {} });
    panel.showModal();
    check(panel.querySelector('.cms-liquid-controls').getBoundingClientRect().height === 0,
      `${theme}: liquid controls hidden`);
    check([...panel.querySelectorAll('button')].some(button =>
      button.textContent === 'Hintergrundbild auswählen' && button.getBoundingClientRect().width > 0),
    `${theme}: background selection visible`);
    panel.close();
    panel.remove();
  }
  config.theme = 'liquid-glass';
  document.documentElement.dataset.cmsTheme = config.theme;
  config.settings.sharedBackground = false;
  result.dataset.result = 'pass';
  result.textContent = JSON.stringify({ checks });
  if (location.search === '?preview') {
    result.hidden = true;
    await view.start();
  }
} catch (error) {
  result.dataset.result = 'fail';
  result.textContent = error.stack || String(error);
}
</script>
