<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph regression</title>
<pre id="result">RUNNING</pre>
<script type="module">
import '../www/fhem-cms/components/cms-graph.js';
import { Schema5WidgetPanel } from '../www/fhem-cms/js/fcui-schema5-widget-panel.js';
import { Schema5DraftController } from '../www/fhem-cms/js/fcui-schema5-draft.js';
import { openDevicePicker } from '../www/fhem-cms/js/device-picker.js';
const result = document.querySelector('#result');
let checks = 0;
const check = (condition, message) => { if (!condition) throw new Error(message); checks++; };
const until = async (condition, message) => {
  for (let i = 0; i < 150; i++) {
    if (condition()) return;
    await new Promise(resolve => setTimeout(resolve, 30));
  }
  throw new Error(message);
};
try {
  let writes = 0, saved, readingCalls = 0, activeChecks = 0, maxChecks = 0;
  const calls = [];
  const graph = document.createElement('cms-graph');
  graph.style.cssText = 'width:min(600px,95vw);height:400px';
  graph.services = {
    history: async (device, reading, range, granularity, source) => {
      calls.push({device,reading,range,granularity,source});
      const base = device === 'Solar1' ? 2 : 3;
      return {points:[[1000,base],[2000,base+1]],summary:{last:base+1,average:base+.5},truncated:false};
    },
    logReadings: async (device, source = 'auto') => {
      readingCalls++;
      activeChecks++;
      maxChecks = Math.max(maxChecks, activeChecks);
      await new Promise(resolve => setTimeout(resolve, 10));
      activeChecks--;
      if (device === 'Broken') throw new Error('Datenbank nicht erreichbar');
      if (device === 'Partial') return {source:'filelog', readings:[], truncated:true};
      const loggedSource = device === 'Solar1' ? 'dblog' : 'filelog';
      return {source:loggedSource, readings:device === 'Empty'
        || (source !== 'auto' && source !== loggedSource) ? [] : ['power']};
    },
    listAllDevices: async () => [{name:'Empty',type:'Dummy'}, {name:'Solar2',alias:'Garten',type:'Dummy'},
      {name:'Solar1',type:'Dummy'}, {name:'Broken',type:'Dummy'}, {name:'Partial',type:'Dummy'}],
    saveWidget: async value => { writes++; saved = value; },
    deleteWidget: async () => { throw new Error('unexpected delete'); },
  };
  graph.config = {id:'graph1',type:'fhem-graph',grid:{col:1,row:2,w:6,h:10},
    chartType:'line',aggregation:'last',range:'24h',granularity:'auto',series:[
      {device:'Solar1',reading:'power',source:'dblog',label:'Dach',color:'#123abc'},
      {device:'Solar2',reading:'power',source:'filelog',label:'Garten',color:'#ef9900'},
    ]};
  document.body.append(graph);
  const root = graph.shadowRoot;
  const updatedPattern = /^Letzte Aktualisierung: \d{2}\.\d{2}\.\d{4} - \d{2}:\d{2}:\d{2}$/;
  await until(() => root.querySelectorAll('[data-svg] polyline').length === 2, 'two live lines not drawn');
  check(updatedPattern.test(root.querySelector('[data-updated]').textContent),
    'last successful fetch has the exact date/time format below the chart');
  check(root.querySelector('[data-title]').hidden && !root.querySelector('[data-title]').textContent,
    'missing title stays empty');
  graph.setAttribute('view-only', '');
  check(root.querySelector('header').getBoundingClientRect().height > 0
    && root.querySelector('[data-range]').getBoundingClientRect().width > 0,
    'untitled view-only graphs retain visible time-range controls');
  check(Math.abs(root.querySelector('.controls').getBoundingClientRect().right
    - root.querySelector('header').getBoundingClientRect().right) < 1,
    'untitled view-only time controls align to the right');
  root.querySelector('[data-title]').textContent = 'Solaranlage';
  root.querySelector('[data-title]').hidden = false;
  check(Math.abs(root.querySelector('.controls').getBoundingClientRect().right
    - root.querySelector('header').getBoundingClientRect().right) < 1,
    'time controls align to the right with a title');
  root.querySelector('[data-title]').hidden = true;
  graph.removeAttribute('view-only');
  const initialPlot = root.querySelector('[data-svg]');
  await until(() => Math.abs(initialPlot.viewBox.baseVal.width / initialPlot.viewBox.baseVal.height
    - initialPlot.clientWidth / initialPlot.clientHeight) < .02, 'plot resize did not settle');
  const initialViewBox = initialPlot.viewBox.baseVal;
  check(Math.abs(initialViewBox.width / initialViewBox.height - initialPlot.clientWidth / initialPlot.clientHeight) < .02,
    'plot viewBox matches the available widget aspect ratio');
  check(calls.some(call => call.source === 'dblog') && calls.some(call => call.source === 'filelog'),
    'each series uses its selected log source');
  const liveLegend = root.querySelectorAll('[data-legend] button');
  const initialUpdated = root.querySelector('[data-updated]').textContent;
  liveLegend[0].click();
  check(root.querySelectorAll('[data-svg] polyline').length === 1
    && root.querySelector('[data-legend] button').getAttribute('aria-pressed') === 'false',
    'legend hides and marks a line');
  root.querySelector('[data-legend] button').click();
  check(root.querySelectorAll('[data-svg] polyline').length === 2, 'legend restores a line');
  check(root.querySelector('[data-updated]').textContent === initialUpdated,
    'legend redraws do not pretend to fetch new data');
  await graph.openConfig();
  const form = root.querySelector('form');
  check(root.querySelector('[data-aggregation]').hidden, 'pie aggregation hidden for line charts');
  check(root.querySelector('[data-pie-labels]').hidden && form.elements.showPieLabels.checked,
    'pie labels default on and their control is hidden for lines');
  check(root.querySelector('dialog').getBoundingClientRect().right <= innerWidth + 1,
    'configuration dialog fits the viewport');
  const fields = root.querySelector('.row');
  check(Math.abs(fields.querySelector('[data-label]').getBoundingClientRect().height
    - fields.querySelector('[data-reading]').getBoundingClientRect().height) < 1,
    'row text and select controls have equal heights');
  const controls = [...fields.querySelectorAll('input:not([type=checkbox]),select')];
  check(controls.every(control => Math.abs(control.getBoundingClientRect().height
    - (control.hasAttribute('data-device') ? 44 : 40)) < 1),
    'row inputs and selects have consistent heights, with a touch-friendly device picker');
  const axisLeft = form.elements.axisLabelLeft.getBoundingClientRect();
  const axisRight = form.elements.axisLabelRight.getBoundingClientRect();
  check(axisLeft.top !== axisRight.top || axisRight.left - axisLeft.right >= 11,
    'left and right axis labels have adequate spacing');
  check([...root.querySelector('.axis-settings').querySelectorAll('input')].map(input => input.name).join(',')
    === 'axisLabelX,axisLabelLeft,axisLabelRight', 'axis labels start with X and then both Y axes');
  const granularityBox = form.elements.granularity.closest('label').getBoundingClientRect();
  const gridBox = form.elements.showGrid.closest('label').getBoundingClientRect();
  check(Math.abs(granularityBox.top - gridBox.top) < 1 && gridBox.left >= granularityBox.right,
    'grid checkbox is beside granularity');
  const formatControl = fields.querySelector('[data-format]');
  await until(() => !root.querySelector('.row[data-loading]'), 'configured readings still loading');
  check(fields.querySelector('[data-unit]').value === '', 'old series without a unit stays unitless');
  fields.querySelector('[data-unit-choice="W"]').click();
  check(fields.querySelector('[data-unit]').value === 'W', 'shared unit suggestions populate the series unit');
  root.querySelectorAll('[data-unit]')[1].value = '°C';
  check(graph.collect().series[1].unit === '°C', 'custom Unicode unit is collected for its reading');
  for (const unit of ['x'.repeat(17), 'bad\u0001unit']) {
    fields.querySelector('[data-unit]').value = unit;
    let rejected = false;
    try { graph.collect(); } catch { rejected = true; }
    check(rejected, 'invalid unit cannot be saved from the graph dialog');
  }
  fields.querySelector('[data-unit]').value = '';
  check(!Object.hasOwn(graph.collect().series[0], 'unit'), 'clearing a unit omits the optional field');
  fields.querySelector('[data-unit]').value = 'W';
  check(formatControl.tagName === 'SELECT' && formatControl.options.length === 9
    && [...formatControl.options].map(option => option.value).join(',')
      === ',int,round(0),round(1),round(2),round(3),round(4),round(5),round(6)',
    'format selector offers every supported format');
  const deviceBox = fields.querySelector('[data-device]').getBoundingClientRect();
  const pickBox = fields.querySelector('[data-pick]').getBoundingClientRect();
  check(Math.abs(deviceBox.top - pickBox.top) < 1 && Math.abs(deviceBox.height - pickBox.height) < 1,
    'device picker and device input are aligned');
  const statusBox = fields.querySelector('[data-row-status]').getBoundingClientRect();
  check(statusBox.top >= deviceBox.bottom && Math.abs(statusBox.left - deviceBox.left) < 1,
    'log status is directly below the device');
  check(getComputedStyle(fields.querySelector('[data-row-status]')).whiteSpace === 'normal',
    'long log messages can wrap instead of being clipped');
  check(fields.querySelector('[data-row-status]').scrollWidth <= fields.querySelector('[data-row-status]').clientWidth,
    'log source and reading count are fully visible without horizontal scrolling');
  const unitBox = fields.querySelector('[data-unit]').getBoundingClientRect();
  const unitChoiceBox = fields.querySelector('[data-unit-choices]').getBoundingClientRect();
  check(unitChoiceBox.left >= unitBox.right && Math.abs(unitChoiceBox.top - unitBox.top) < 1,
    'unit suggestions are beside the input on desktop and mobile');
  check([...fields.querySelectorAll('[data-line-only]')].every(control => !control.hidden),
    'line controls are available for line charts');
  const card = fields.getBoundingClientRect(), remove = fields.querySelector('[data-remove]').getBoundingClientRect();
  check(remove.top >= card.top && remove.top - card.top < 10 && card.right - remove.right < 10,
    'remove button is in the top-right corner');
  const lineControls = fields.querySelector('.line-controls');
  check([...lineControls.querySelectorAll('input')].map(input => input.dataset.lineWidth !== undefined ? 'width'
    : input.dataset.color !== undefined ? 'color' : 'fill').join(',') === 'width,color,fill',
    'line width, color and fill are ordered together');
  await until(() => root.querySelectorAll('[data-preview] polyline').length === 2, 'line preview missing');
  check(writes === 0, 'preview does not save');
  form.elements.chartType.value = 'stack';
  form.elements.chartType.dispatchEvent(new Event('change', {bubbles:true}));
  check(root.querySelector('[data-aggregation]').hidden, 'pie aggregation hidden for stacks');
  check([...root.querySelectorAll('[data-line-only]')].every(control => control.hidden),
    'stack charts hide line styling, axis selection and fill without changing their values');
  check(fields.querySelector('[data-color]').getBoundingClientRect().width <= 192,
    'color input stays compact when line controls are hidden');
  check(graph.collect().series[0].axis === 'left' && graph.collect().series[0].lineWidth === 4,
    'hidden line settings remain available in the saved configuration');
  check(!root.querySelector('[data-stack-linear]').hidden && !form.elements.stackLinear.checked,
    'linear stack is optional and defaults off');
  const linearBox = form.elements.stackLinear.getBoundingClientRect();
  const linearText = document.createRange();
  linearText.selectNodeContents(form.elements.stackLinear.nextSibling);
  const linearTextBox = linearText.getBoundingClientRect();
  check(linearBox.right <= linearTextBox.left && linearBox.top < linearTextBox.bottom
    && linearTextBox.top < linearBox.bottom,
    'linear stack label and checkbox share a row with checkbox first');
  await until(() => root.querySelectorAll('[data-preview] polygon').length === 2, 'stack preview missing');
  const stackPreview = root.querySelector('[data-preview]');
  const steppedPoints = stackPreview.querySelector('polygon').getAttribute('points');
  form.elements.stackLinear.checked = true;
  form.elements.stackLinear.dispatchEvent(new Event('change', {bubbles:true}));
  await until(() => stackPreview.querySelector('polygon')?.getAttribute('points') !== steppedPoints, 'linear stack preview missing');
  check(graph.collect().stackLinear === true, 'linear stack setting is collected for persistence');
  form.elements.stackLinear.checked = false;
  check(!Object.hasOwn(graph.collect(), 'stackLinear'), 'disabled linear stack does not change legacy configurations');
  const stackBounds = stackPreview.getBoundingClientRect();
  stackPreview.onpointermove({clientX:stackBounds.left + stackBounds.width/2});
  check(root.querySelector('[data-preview-tooltip]').textContent.includes(' W')
    && root.querySelector('[data-preview-tooltip]').textContent.includes(' °C'),
    'stacked preview measurements retain their per-reading units');
  root.querySelector('[data-preview-legend] button').click();
  check(root.querySelectorAll('[data-preview] polygon').length === 1, 'preview legend hides a stack');
  form.elements.chartType.value = 'pie';
  form.elements.aggregation.value = 'average';
  root.querySelector('[data-format]').value = 'round(2)';
  form.elements.chartType.dispatchEvent(new Event('change', {bubbles:true}));
  check(!root.querySelector('[data-aggregation]').hidden, 'pie aggregation shown for pie charts');
  check([...form.elements.aggregation.options].map(option => option.value).join(',') === 'last,average,min,max',
    'pie aggregation offers last, average, minimum and maximum');
  check([...root.querySelectorAll('[data-line-only]')].every(control => control.hidden),
    'pie charts hide line styling, axis selection and fill');
  await until(() => root.querySelectorAll('[data-preview] path').length === 2, 'pie preview missing');
  check(!root.querySelector('[data-pie-labels]').hidden
    && root.querySelectorAll('[data-preview] [data-pie-label]').length === 2,
    'pie preview labels default to visible');
  const previewLabels = [...root.querySelectorAll('[data-preview] [data-pie-label]')];
  check(previewLabels[0].querySelector('tspan').textContent === 'Dach'
    && previewLabels[0].textContent.includes('2.50 W') && !previewLabels[0].textContent.includes('Solar1'),
    'slice label uses the configured source label and formatted value with unit');
  check(updatedPattern.test(root.querySelector('[data-preview-updated]').textContent),
    'preview displays its own last successful fetch timestamp');
  form.elements.showPieLabels.checked = false;
  form.elements.showPieLabels.dispatchEvent(new Event('change', {bubbles:true}));
  await until(() => root.querySelectorAll('[data-preview] [data-pie-label]').length === 0,
    'pie labels cannot be disabled in preview');
  const pieShape = root.querySelector('[data-preview] path');
  const pieBox = root.querySelector('[data-preview]').getBoundingClientRect();
  pieShape.onpointermove({clientX:pieBox.left + pieBox.width / 2});
  check(!root.querySelector('[data-preview-tooltip]').hidden
    && root.querySelector('[data-preview-tooltip]').textContent.includes('2.50')
    && pieShape.getAttribute('aria-label').includes('2.50') && !pieShape.querySelector('title'),
    'pie hover displays the formatted raw average without a native tooltip');
  pieShape.onpointerleave();
  check(root.querySelector('[data-preview-tooltip]').hidden, 'pie tooltip hides after pointer leaves');
  root.querySelector('[data-format]').append(new Option('invalid', 'round(7)'));
  root.querySelector('[data-format]').value = 'round(7)';
  let badFormat = false;
  try { graph.collect(); } catch { badFormat = true; }
  check(badFormat, 'invalid formatting commands are rejected');
  root.querySelector('[data-format]').value = 'int';
  check(writes === 0, 'changing chart type never saves');
  root.querySelector('[data-add]').click();
  check(root.querySelectorAll('.row').length === 3, 'a new row can be added');
  const beforePicker = readingCalls;
  maxChecks = 0;
  root.querySelectorAll('[data-pick]')[2].click();
  check(document.querySelectorAll('.cms-dp-dialog [role=option]').length === 0,
    'unverified devices are never offered');
  await until(() => document.querySelectorAll('.cms-dp-dialog [role=option]').length === 2
    && document.querySelector('.cms-dp-dialog [data-info]').textContent.includes('2 Logprüfungen fehlgeschlagen'),
    'filtered device discovery did not complete or error was hidden');
  const devices = [...document.querySelectorAll('.cms-dp-dialog [role=option]')];
  check(readingCalls === beforePicker + 5 && maxChecks <= 2
    && devices.every(device => !/Empty|Broken|Partial/.test(device.textContent)),
    'only positively checked devices are offered with at most two concurrent checks');
  devices.find(device => device.textContent.includes('Solar2')).click();
  await until(() => root.querySelectorAll('[data-reading]')[2].options.length === 2, 'selected device readings not loaded');
  check(root.querySelectorAll('[data-device]')[2].value === 'Solar2', 'device picker sets the chosen row');
  check(root.querySelectorAll('[data-label]')[2].value === 'Garten', 'legend defaults to the device alias');
  const addedRow = root.querySelectorAll('.row')[2];
  await graph.loadReadings(addedRow, 'missingReading');
  check(addedRow.querySelector('[data-reading]').value === ''
    && ![...addedRow.querySelector('[data-reading]').options].some(option => option.value === 'missingReading')
    && addedRow.querySelector('[data-row-status]').textContent.includes('missingReading'),
    'missing saved readings are reported but never selectable');
  let readingError = '';
  try { graph.collect(); } catch (error) { readingError = error.message; }
  check(readingError.includes('Solar2') && readingError.includes('Reading'),
    'invalid reading identifies the affected device and field');
  addedRow.querySelector('[data-row-status]').textContent = 'Eine sehr lange Fehlermeldung '.repeat(20);
  check(addedRow.querySelector('[data-row-status]').scrollHeight <= addedRow.querySelector('[data-row-status]').clientHeight,
    'long log messages remain readable without clipping or scrolling');
  addedRow.querySelector('[data-source]').value = 'dblog';
  addedRow.querySelector('[data-pick]').click();
  await until(() => document.querySelector('.cms-dp-dialog [data-info]')?.textContent.includes('Datenbank nicht erreichbar'),
    'source-specific checks did not complete');
  check(document.querySelectorAll('.cms-dp-dialog [role=option]').length === 1
    && document.querySelector('.cms-dp-dialog [role=option]').textContent.includes('Solar1'),
    'explicit DbLog choice excludes FileLog-only devices');
  document.querySelector('.cms-dp-dialog [data-cancel]').click();
  check(!root.querySelector('[data-manual-reading]'), 'manual reading field is absent');
  check(root.querySelectorAll('[data-remove]')[2].querySelector('svg')
    && root.querySelectorAll('[data-remove]')[2].getAttribute('aria-label'), 'row removal uses an accessible X icon');
  root.querySelectorAll('[data-remove]')[2].click();
  check(root.querySelectorAll('.row').length === 2, 'row removal preserves other sources');
  form.elements.range.value = 'custom';
  form.elements.from.value = '2025-01-01T10:00';
  form.elements.to.value = '2025-02-01T10:00';
  form.elements.granularity.value = '1mo';
  form.elements.axisLabelX.value = 'Zeit';
  form.elements.axisLabelLeft.value = 'Watt';
  form.elements.axisLabelRight.value = 'Grad';
  form.elements.showGrid.checked = false;
  root.querySelectorAll('[data-axis]')[1].value = 'right';
  root.querySelectorAll('[data-line-style]')[1].value = 'dashed';
  root.querySelectorAll('[data-line-width]')[1].value = '7';
  root.querySelectorAll('[data-fill]')[1].checked = true;
  root.querySelectorAll('[data-format]')[1].value = 'round(2)';
  form.dispatchEvent(new Event('submit', {bubbles:true,cancelable:true}));
  await until(() => writes === 1, 'graph was not saved');
  check(saved.chartType === 'pie' && saved.aggregation === 'average' && saved.series.length === 2,
    'save preserves selected type, aggregate and series');
  check(saved.showPieLabels === false, 'save preserves disabled pie labels');
  check(saved.series[0].source === 'dblog' && saved.series[1].source === 'filelog',
    'save preserves manually selected sources');
  check(/^\d+_\d+$/.test(saved.range) && saved.granularity === '1mo' && saved.axisLabelRight === 'Grad'
    && saved.showGrid === false && saved.series[1].axis === 'right' && saved.series[1].lineStyle === 'dashed'
    && saved.series[1].lineWidth === 7 && saved.series[1].fill === true && saved.series[1].format === 'round(2)',
    'save preserves custom time, formatting and graph styling');
  check(JSON.stringify(saved.grid) === JSON.stringify(graph.config.grid), 'save preserves geometry');
  check(saved.series[0].lineWidth === 4 && saved.series[0].axis === 'left',
    'new rows default to four-pixel lines on the left axis');
  check(saved.series[0].format === 'int', 'integer format is saved with its data series');
  check(saved.series[0].unit === 'W' && saved.series[1].unit === '°C',
    'save preserves individual units for both readings');
  const decorated = {...graph.config, showGrid:false, axisLabelLeft:'Leistung', axisLabelRight:'Temperatur', axisLabelX:'Zeit',
    series:[{...graph.config.series[0], unit:'W', axis:'left', lineStyle:'dashed', lineWidth:4, fill:true},
      {...graph.config.series[1], unit:'°C', axis:'right', lineStyle:'points', lineWidth:3, format:'round(2)'}]};
  const decoratedData = [
    {points:[[1000,-1.7],[2000,2]]}, {points:[[1000,100],[2000,200]]},
  ];
  decorated.series[0].format = 'int';
  const rawData = JSON.stringify(decoratedData);
  graph.draw(decorated, decoratedData, '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
  const plot = root.querySelector('[data-svg]');
  check(plot.querySelector('polyline').getAttribute('stroke-dasharray') === '8 5'
    && plot.querySelector('polyline').getAttribute('stroke-width') === '4'
    && plot.querySelector('polygon'), 'filled dashed lines and configured width are drawn');
  check(plot.textContent.includes('Temperatur') && plot.textContent.includes('Leistung')
    && plot.textContent.includes('Zeit') && plot.textContent.includes('200'), 'both axes have independent ranges and labels');
  const tickTexts = axis => [...plot.querySelectorAll(`[data-axis-tick="${axis}"]`)].map(node => node.textContent);
  check(tickTexts('left')[0] === '-1' && tickTexts('right')[0] === '100.00'
    && tickTexts('right')[4] === '200.00', 'each axis uses its first visible series format');
  check(!plot.querySelector('circle title') && plot.querySelector('circle[aria-label]'),
    'line points do not cause a second native browser tooltip');
  check(!plot.querySelector('line[opacity="0.2"]'), 'grid can be hidden');
  const box = plot.getBoundingClientRect();
  plot.onpointermove({clientX:box.left + box.width / 2});
  check(!root.querySelector('[data-tooltip]').hidden && root.querySelector('[data-tooltip]').textContent.includes('Dach: -1')
    && root.querySelector('[data-tooltip]').textContent.includes('Garten: 100.00'), 'hover shows formatted values for both series');
  check(root.querySelector('[data-tooltip]').textContent.includes('Dach: -1 W')
    && root.querySelector('[data-tooltip]').textContent.includes('Garten: 100.00 °C')
    && root.querySelector('[data-legend]').textContent.includes('Dach (W)'),
    'line tooltips and legend identify units without modifying axis scales');
  check([...root.querySelectorAll('[data-tooltip] [data-graph-total]')].map(row => row.textContent).join('|')
    === '∑: -1 W|∑: 100.00 °C',
    'hover totals use raw values grouped by axis and unit and apply the configured formats');
  check(JSON.stringify(decoratedData) === rawData, 'display formatting does not modify the source values');
  check(parseFloat(getComputedStyle(root.querySelector('[data-tooltip]')).fontSize) >= 12
    && parseFloat(getComputedStyle(root.querySelector('[data-tooltip]')).fontSize) <= 13
    && parseFloat(getComputedStyle(root.querySelector('[data-tooltip]')).paddingTop) <= 7,
    'tooltip uses compact readable text and padding');
  graph.style.setProperty('--cms-freeform-scale', '.5');
  graph.style.transformOrigin = 'top left';
  graph.style.transform = 'scale(.5)';
  const scaledBox = plot.getBoundingClientRect();
  plot.onpointermove({clientX:scaledBox.left + scaledBox.width * .75});
  const tooltip = root.querySelector('[data-tooltip]');
  check(parseFloat(getComputedStyle(tooltip).fontSize) * .5 >= 12
    && parseFloat(getComputedStyle(tooltip).fontSize) * .5 <= 13,
    'live tooltip stays compact and readable under canvas scaling');
  check(tooltip.textContent.includes('Dach: 2') && tooltip.textContent.includes('Garten: 200.00'),
    'scaled pointer maps to the correct values');
  check(parseFloat(tooltip.style.left) <= plot.clientWidth - tooltip.offsetWidth + 1,
    'scaled tooltip remains within the plot');
  check(parseFloat(getComputedStyle(root.querySelector('[data-preview-tooltip]')).fontSize) < 20,
    'canvas scaling does not enlarge the modal preview tooltip');
  graph.style.removeProperty('--cms-freeform-scale');
  graph.style.transform = '';
  graph.draw({...decorated, series:[decorated.series[0], {...decorated.series[1], axis:'left'}]},
    decoratedData, '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set([0]));
  check(tickTexts('left')[0] === '100.00', 'hiding the first series selects the next visible axis format');
  const precise = {...decorated, series:decorated.series.map(row => ({...row, format:'round(6)'}))};
  graph.draw(precise, decoratedData, '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
  check([...plot.querySelectorAll('[data-axis-tick]')].every(node => {
    const textBox = node.getBBox();
    return textBox.x >= -0.5 && textBox.x + textBox.width <= plot.viewBox.baseVal.width + 0.5;
  }), 'six-decimal axis labels fit within the plot');
  for (const [axis, angle] of [['left',-90], ['right',90]]) {
    const title = plot.querySelector(`[data-axis-label="${axis}"]`);
    const titleBox = title.getBoundingClientRect();
    const tickBoxes = [...plot.querySelectorAll(`[data-axis-tick="${axis}"]`)].map(node => node.getBoundingClientRect());
    check(title.getAttribute('transform').startsWith(`rotate(${angle} `) && titleBox.height > titleBox.width,
      `${axis} axis title is vertical with its bottom facing the axis`);
    check(axis === 'left' ? titleBox.right <= Math.min(...tickBoxes.map(box => box.left))
      : titleBox.left >= Math.max(...tickBoxes.map(box => box.right)),
      `${axis} axis title does not overlap tick labels`);
  }
  const epoch = value => Date.parse(value) / 1000;
  const timeCases = [
    {name:'one day',start:'2026-11-25T00:00:00+01:00',end:'2026-11-26T00:00:00+01:00',axis:/^\d{2}:\d{2}$/, tip:/^\d{2}\.\d{2}\.,? \d{2}:\d{2}$/},
    {name:'over one day',start:'2026-11-25T00:00:00+01:00',end:'2026-11-26T00:00:01+01:00',axis:/^\d{2}\.\d{2}\.,? \d{2}:\d{2}$/, tip:/^\d{2}\.\d{2}\.,? \d{2}:\d{2}$/},
    {name:'year boundary',start:'2026-12-30T00:00:00+01:00',end:'2027-01-08T00:00:00+01:00',axis:/^\d{2}\.\d{2}\.\d{4}$/, tip:/^\d{2}\.\d{2}\.\d{4}$/},
  ];
  root.querySelector('[data-dialog]').showModal();
  for (const sample of timeCases) {
    const from = epoch(sample.start), to = epoch(sample.end);
    const range = `${from}_${to}`;
    const values = decorated.series.map(() => ({from,to,points:[[from,1],[to,2]]}));
    for (const [selector, legendSelector, statusSelector, tipSelector] of [
      ['[data-svg]','[data-legend]','[data-status]','[data-tooltip]'],
      ['[data-preview]','[data-preview-legend]','[data-preview-status]','[data-preview-tooltip]'],
    ]) {
      graph.draw({...decorated,range}, values, selector, legendSelector, root.querySelector(statusSelector), new Set());
      const svg = root.querySelector(selector);
      check([...svg.querySelectorAll('[data-time-tick]')].every(tick => sample.axis.test(tick.textContent)),
        `${sample.name}: X-axis uses the range-specific time format in ${selector}`);
      const bounds = svg.getBoundingClientRect();
      svg.onpointermove({clientX:bounds.left + bounds.width / 2});
      const tip = root.querySelector(tipSelector);
      check(/^\d{2}\.\d{2}\.\d{4},? \d{2}:\d{2}$/.test(tip.querySelector('strong').textContent)
        && [...tip.querySelectorAll('div:not([data-graph-total])')].every(row => !row.textContent.includes(' · ')),
        `${sample.name}: tooltip shows one full timestamp in ${selector}`);
    }
    if (sample.name === 'year boundary') {
      const labels = [...plot.querySelectorAll('[data-time-tick]')].map(tick => tick.textContent);
      check(labels[0].includes('2026') && labels[1].includes('2027'),
        'X-axis explicitly shows both years across a year boundary');
      const sparse = values.map(value => ({...value,points:[[to-3600,1],[to,2]]}));
      graph.draw({...decorated,range}, sparse, '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
      check([...plot.querySelectorAll('[data-time-tick]')].every(tick => sample.axis.test(tick.textContent)),
        'sparse observations do not replace the selected range format with time-only labels');
    }
    const relativeStart = epoch('2026-11-25T12:00:00+01:00');
    const relativeData = decorated.series.map(() => ({from:relativeStart, to:relativeStart+86402,
      points:[[relativeStart,1],[relativeStart+86400,2]]}));
    graph.draw({...decorated,range:'24h'}, relativeData, '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
    check([...plot.querySelectorAll('[data-time-tick]')].every(tick => /^\d{2}:\d{2}$/.test(tick.textContent)),
      '24-hour selection stays hourly even if source response bounds differ by seconds');
    const sumConfig = {...decorated, series: [
      {...decorated.series[0], unit:'W', format:'round(2)'}, {...decorated.series[0], label:'Garten', color:'#ef9900', unit:'W', format:'round(1)'},
      {...decorated.series[1], label:'Temperatur', unit:'°C'}, {...decorated.series[0], label:'leer', unit:'W'},
    ]};
    const sumData = [{points:[[relativeStart,2],[relativeStart+10,5]]},
      {points:[[relativeStart,3],[relativeStart+10,8]]}, {points:[[relativeStart,20]]}, {points:[]}];
    graph.draw(sumConfig, sumData, '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
    const hoverStart = () => plot.onpointermove({clientX:plot.getBoundingClientRect().left});
    hoverStart();
    check(root.querySelector('[data-tooltip]').textContent.includes('∑: 5.00 W')
      && root.querySelector('[data-tooltip]').textContent.includes('∑: 20.00 °C'),
      'sum includes visible finite nearest measurements and excludes empty series');
    check(root.querySelector('[data-tooltip] strong').textContent.includes('2026')
      && ![...root.querySelectorAll('[data-tooltip] div')].some(row => row.textContent.includes(' · ')),
      'tooltip has one full timestamp and no per-series timestamps');
    const timeData = [{points:[[relativeStart,2]]}, {points:[[relativeStart+120,3]]}];
    graph.draw({...sumConfig, series:sumConfig.series.slice(0, 2)}, timeData,
      '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
    hoverStart();
    check(root.querySelector('[data-tooltip] strong').textContent.includes('12:02'),
      'tooltip header uses the most recent of the displayed measurements');
    graph.draw(sumConfig, sumData, '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
    root.querySelectorAll('[data-legend] button')[1].click();
    hoverStart();
    check(root.querySelector('[data-tooltip]').textContent.includes('∑: 2.00 W')
      && !root.querySelector('[data-tooltip]').textContent.includes('Garten:'),
      'hidden series are excluded from tooltip values and totals');
    root.querySelectorAll('[data-legend] button')[0].click();
    root.querySelectorAll('[data-legend] button')[1].click();
    hoverStart();
    check(root.querySelector('[data-tooltip]').textContent.includes('∑: 3.0 W'),
      'hiding the most precise series updates total precision');
    const rawConfig = {...sumConfig, series:sumConfig.series.slice(0, 2).map(row => ({...row, format:''}))};
    graph.draw(rawConfig, [{points:[[relativeStart,.1]]}, {points:[[relativeStart,.2]]}],
      '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
    hoverStart();
    check(root.querySelector('[data-tooltip]').textContent.includes('∑: 0.3 W'),
      'unformatted decimals determine precision without exposing floating-point artifacts');
  }
  root.querySelector('[data-dialog]').close();
  graph.draw({...decorated, chartType:'pie'}, [
    {points:[[1000,1.5]], summary:{last:1.5,average:1.5}},
    {points:[[1000,2.5]], summary:{last:2.5,average:2.5}},
  ], '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
  check(plot.querySelectorAll('[data-pie-label]').length === 2, 'old configs without a pie label option default to visible');
  const livePie = plot.querySelector('path');
  livePie.onpointermove({clientX:plot.getBoundingClientRect().left + 20});
  check(!tooltip.hidden && tooltip.textContent.includes('Dach: 1'),
    'live pie uses the formatted custom tooltip');
  check(tooltip.textContent.includes('Dach: 1 W') && plot.querySelector('[data-pie-label]').textContent.includes('1 W'),
    'live pie uses configured labels and units consistently in slice and tooltip');
  const pieData = [{points:[[1000,1]],summary:{last:1,average:1}},
    {points:[[1000,99]],summary:{last:99,average:99}}];
  const liveAggregation = root.querySelector('[data-live-aggregation]');
  graph.config = {...graph.config, chartType:'pie'};
  check(!liveAggregation.hidden && [...liveAggregation.options].map(option => option.value).join(',')
    === 'last,average,min,max', 'pie widget exposes all aggregation choices');
  graph.config = {...graph.config, chartType:'line'};
  check(liveAggregation.hidden, 'aggregation choice is hidden for line widgets');
  for (const pair of [[0, 0], [-1, 0], [-1, -3]]) {
    graph.draw({...decorated,chartType:'pie'}, pair.map(value => ({
      points:[[1000,value]], summary:{last:value,average:value},
    })), '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
    check(!!plot.querySelector('[data-empty-pie]') && !plot.querySelector('path'),
      'nonpositive pie values render an empty circular outline');
  }
  let mixedRejected = false;
  try {
    graph.draw({...decorated,chartType:'pie'}, [-1, 2].map(value => ({
      points:[[1000,value]], summary:{last:value,average:value},
    })), '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
  } catch (error) { mixedRejected = /nichtnegative/.test(error.message); }
  check(mixedRejected, 'mixed positive and negative pie values remain an explicit error');
  const fallback = {...decorated,chartType:'pie',series:[{...decorated.series[0],label:''},decorated.series[1]]};
  graph.draw(fallback, pieData, '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
  check(plot.querySelector('[data-pie-label] tspan').textContent === 'Solar1: power',
    'missing configured label retains the shared device/reading fallback');
  const hostile = {...decorated,chartType:'pie',
    series:[{...decorated.series[0],label:'<img src=x>',unit:'<b>W</b>'},decorated.series[1]]};
  graph.draw(hostile, pieData, '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
  check(plot.querySelector('[data-pie-label]').textContent.includes('<img src=x>')
    && !root.querySelector('img') && !plot.querySelector('b'),
    'configured labels and units are rendered only as text');
  graph.draw({...decorated,chartType:'pie',showPieLabels:false}, pieData,
    '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
  check(!plot.querySelector('[data-pie-label]') && plot.querySelectorAll('path').length === 2,
    'disabling labels leaves pie segments intact');
  for (const hidden of [new Set(), new Set([0])]) {
    graph.draw({...decorated,chartType:'pie',showPieLabels:true}, pieData,
      '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), hidden);
    const labels = [...plot.querySelectorAll('[data-pie-label]')];
    check(labels.length === (hidden.size ? 1 : 2), 'pie labels follow visible legend segments');
    const center = plot.viewBox.baseVal.width / 2;
    const radius = Math.min(95, center - 5);
    labels.forEach((text, index) => {
      const box = text.getBBox(), matrix = text.transform.baseVal.consolidate().matrix;
      const points = [[box.x,box.y],[box.x+box.width,box.y],[box.x,box.y+box.height],[box.x+box.width,box.y+box.height]]
        .map(([x,y]) => new DOMPoint(x,y).matrixTransform(matrix));
      check(points.every(point => Math.hypot(point.x-center,point.y-110) <= radius + .01),
        'pie label corners remain inside the circle');
      if (!hidden.size && index === 0) {
        check(points.every(point => {
          const angle = (Math.atan2(point.y-110,point.x-center) + Math.PI/2 + Math.PI*2) % (Math.PI*2);
          return angle <= Math.PI * .02 + .0001;
        }), 'even a one-percent slice contains its complete device/value label');
      }
    });
  }
  graph.draw(decorated, decoratedData, '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
  const oldCapture = plot.setPointerCapture;
  plot.setPointerCapture = () => {};
  plot.onpointerdown({button:0, pointerId:1, clientX:box.left + box.width * .35});
  plot.onpointermove({clientX:box.left + box.width * .7});
  plot.onpointerup({clientX:box.left + box.width * .7});
  plot.setPointerCapture = oldCapture;
  await until(() => calls.some(call => /^\d+_\d+$/.test(call.range)), 'drag selection did not load a custom range');
  check(root.querySelector('[data-range]').value === 'custom', 'drag selection switches live range to custom');
  root.querySelector('[data-granularity]').value = '1mo';
  root.querySelector('[data-granularity]').dispatchEvent(new Event('change'));
  await until(() => calls.some(call => call.granularity === '1mo'), 'live granularity change not loaded');
  const manySeries = Array.from({length:20}, (_, index) => ({
    ...graph.config.series[0], device:`Solar${index}`,
  }));
  const manyData = manySeries.map((_, index) => ({
    points:Array.from({length:400}, (_, point) => [1000 + point * 20 + index, point + 1]),
  }));
  graph.draw({...graph.config, chartType:'stack', series:manySeries}, manyData,
    '[data-svg]', '[data-legend]', root.querySelector('[data-status]'), new Set());
  check(root.querySelectorAll('[data-svg] polygon').length === 20,
    'maximum stack size with distinct timestamps renders without argument overflow');
  graph.remove();
  const pieWidget = document.createElement('cms-graph');
  pieWidget.style.cssText = 'width:300px;height:300px';
  pieWidget.config = {...graph.config, chartType:'pie', aggregation:'last', series:[graph.config.series[0]]};
  pieWidget.services = {history:async () => ({points:[[1000,3]],
    summary:{last:3, average:4, min:1, max:8}})};
  document.body.append(pieWidget);
  const pieRoot = pieWidget.shadowRoot;
  await until(() => pieRoot.querySelector('[data-svg] [data-pie-label]'), 'pie widget did not load');
  for (const [mode, value] of [['min','1'], ['max','8']]) {
    pieRoot.querySelector('[data-live-aggregation]').value = mode;
    pieRoot.querySelector('[data-live-aggregation]').dispatchEvent(new Event('change'));
    await until(() => pieRoot.querySelector('[data-svg] [data-pie-label]')?.textContent.includes(value),
      `pie widget did not switch to ${mode}`);
    check(pieWidget.config.aggregation === 'last', 'live pie selection does not modify saved configuration');
  }
  pieWidget.remove();
  const originalInterval = window.setInterval;
  let refresh, refreshDelay;
  window.setInterval = (callback, delay) => {
    refresh = callback;
    refreshDelay = delay;
    return originalInterval(callback, delay);
  };
  let latest = 1;
  let fetchError = false;
  const refreshed = document.createElement('cms-graph');
  const refreshCalls = [];
  refreshed.services = {history:async (device,reading,range) => {
    if (fetchError) throw new Error('Datenbank nicht erreichbar');
    refreshCalls.push(range);
    return {points:[[1000,latest]], summary:{last:latest,average:latest}};
  }};
  refreshed.config = {...graph.config,chartType:'line',series:[graph.config.series[0]]};
  document.body.append(refreshed);
  window.setInterval = originalInterval;
  await until(() => refreshed.currentData?.[0].summary.last === 1, 'initial refresh fixture did not load');
  check(refreshDelay === 300000, 'live charts automatically poll every five minutes');
  for (const range of ['24h','7d','30d','365d','1700000000_1700100000']) {
    for (const chartType of ['line','stack','pie']) {
      refreshed.widgetConfig = {...refreshed.config,chartType};
      refreshed.range = range;
      latest++;
      refresh();
      await until(() => refreshed.currentData[0].summary.last === latest, 'automatic refresh did not draw new data');
      check(refreshCalls.at(-1) === range, `${chartType} refresh retains ${range} range semantics`);
      check(updatedPattern.test(refreshed.shadowRoot.querySelector('[data-updated]').textContent),
        `${chartType} displays the last successful refresh time`);
    }
  }
  const RealDate = window.Date;
  let fakeTime = RealDate.parse('2026-11-26T10:12:34Z');
  window.Date = class extends RealDate {
    constructor(...args) { super(...(args.length ? args : [fakeTime])); }
  };
  try {
    await refreshed.load();
    const refreshedTime = refreshed.shadowRoot.querySelector('[data-updated]');
    check(refreshedTime.textContent === 'Letzte Aktualisierung: 26.11.2026 - 11:12:34',
      'last update is fetch time in Europe/Berlin, not the timestamp of a historical observation');
    fakeTime += 2000;
    await refreshed.load();
    check(refreshedTime.textContent === 'Letzte Aktualisierung: 26.11.2026 - 11:12:36',
      'successful later fetch advances the update timestamp');
    fetchError = true;
    fakeTime += 2000;
    await refreshed.load();
    check(refreshedTime.textContent === 'Letzte Aktualisierung: 26.11.2026 - 11:12:36'
      && refreshed.shadowRoot.querySelector('[data-status]').textContent.includes('Datenbank nicht erreichbar'),
      'failed fetch is explicit and never advances the successful update timestamp');
  } finally { window.Date = RealDate; }
  refreshed.remove();
  const racing = document.createElement('cms-graph');
  let releaseFirst, releaseSecond;
  racing.services = {logReadings: device => new Promise(resolve => {
    if (device === 'First') releaseFirst = resolve; else releaseSecond = resolve;
  })};
  racing.config = {id:'race',type:'fhem-graph',series:[]};
  document.body.append(racing);
  racing.openConfig();
  const raceRow = racing.shadowRoot.querySelector('.row');
  raceRow.querySelector('[data-device]').value = 'First';
  const firstLoad = racing.loadReadings(raceRow);
  check(raceRow.querySelector('[data-reading]').disabled, 'reading select is disabled while discovery is pending');
  raceRow.querySelector('[data-device]').value = 'Second';
  const secondLoad = racing.loadReadings(raceRow);
  releaseSecond({source:'dblog',readings:['newer']});
  await secondLoad;
  releaseFirst({source:'dblog',readings:['stale']});
  await firstLoad;
  check(!raceRow.querySelector('[data-reading]').disabled
    && raceRow.querySelector('[data-reading]').options[1].value === 'newer',
    'late responses cannot replace readings for the latest device');
  racing.closeConfig();
  racing.remove();
  let release, requests = 0;
  const pending = new Promise(resolve => { release = resolve; });
  const detached = document.createElement('cms-graph');
  detached.services = {history: async () => { requests++; return pending; }};
  detached.config = structuredClone(graph.config);
  detached.config.series.push({...detached.config.series[0], device:'Solar3'});
  document.body.append(detached);
  await until(() => requests === 2, 'bounded parallel history requests did not start');
  detached.remove();
  release({points:[[1000,1]],summary:{last:1,average:1}});
  await new Promise(resolve => setTimeout(resolve, 30));
  check(requests === 2, 'removing the graph stops further history requests');
  let releaseCheck, startedChecks = 0;
  const checkPending = new Promise(resolve => { releaseCheck = resolve; });
  const picker = openDevicePicker({services:graph.services, classify:async () => {
    startedChecks++;
    await checkPending;
    return true;
  }});
  await until(() => startedChecks === 2, 'device checks did not start');
  document.querySelector('.cms-dp-dialog [data-cancel]').click();
  check(await picker === null, 'cancelling discovery closes the picker');
  releaseCheck();
  await new Promise(resolve => setTimeout(resolve, 30));
  check(startedChecks === 2 && !document.querySelector('.cms-dp-dialog'),
    'cancelled discovery starts no further checks and does not restore the dialog');
  const unfilteredPicker = openDevicePicker({services:graph.services});
  await until(() => document.querySelectorAll('.cms-dp-dialog [role=option]').length === 5,
    'ordinary device picker must remain unfiltered');
  document.querySelector('.cms-dp-dialog [data-cancel]').click();
  await unfilteredPicker;
  let bulkCalls = 0;
  const cachedPicker = openDevicePicker({services:graph.services, loadCandidates:async () => {
    bulkCalls++;
    return {devices:['Solar1'], warnings:['Cache möglicherweise veraltet']};
  }});
  await until(() => document.querySelectorAll('.cms-dp-dialog [role=option]').length === 1,
    'cached device list did not filter the picker');
  check(document.querySelector('.cms-dp-dialog [role=option]').textContent.includes('Solar1'),
    'cached picker only includes indexed devices');
  check(document.querySelector('.cms-dp-dialog [data-info]').textContent.includes('möglicherweise veraltet'),
    'cached picker shows source warnings');
  check(bulkCalls === 1, 'cached picker loads device names once');
  document.querySelector('.cms-dp-dialog [data-cancel]').click();
  await cachedPicker;
  const live = {schemaVersion:5,settings:{layoutMode:'grid',gridColumns:12},
    navigation:{orientation:'horizontal',grid:{col:1,row:1,w:12,h:1}},
    pages:[{id:'start',title:'Start',widgets:[]}]};
  let state = {live,draft:null,token:'a'.repeat(64)};
  const controller = new Schema5DraftController({
    read:async () => structuredClone(state),
    save:async (draft, token) => {
      if (token !== state.token) throw new Error('stale token');
      state = {live,draft:structuredClone(draft),token:'b'.repeat(64)};
    },
    publish:async () => {}, discard:async () => {},
  });
  await controller.reload();
  const panelRoot = document.createElement('dialog');
  document.body.append(panelRoot);
  const panel = new Schema5WidgetPanel({root:panelRoot,controller,services:graph.services,
    pageId:'start',token:state.token,onClose() {}});
  panelRoot.showModal();
  [...panelRoot.querySelectorAll('.cms-widget-choice')].find(button => button.textContent === 'Graph').click();
  const graphInPanel = panelRoot.querySelector('.cms-widget-dialog-host cms-graph');
  check(graphInPanel?.shadowRoot.querySelector('[data-dialog]').open, 'real widget panel opens the new graph dialog');
  graphInPanel.shadowRoot.querySelector('[data-pick]').click();
  await until(() => document.querySelectorAll('.cms-dp-dialog [role=option]').length === 2
    && document.querySelector('.cms-dp-dialog [data-info]').textContent.includes('Datenbank nicht erreichbar'),
    'panel device picker unavailable');
  [...document.querySelectorAll('.cms-dp-dialog [role=option]')]
    .find(option => option.textContent.startsWith('Solar1')).click();
  const row = graphInPanel.shadowRoot.querySelector('.row');
  await until(() => !row.hasAttribute('data-loading') && row.querySelector('[data-reading]').options.length === 2,
    'panel readings not loaded');
  row.querySelector('[data-reading]').value = 'power';
  row.querySelector('[data-reading]').dispatchEvent(new Event('change', {bubbles:true}));
  graphInPanel.shadowRoot.querySelector('form').dispatchEvent(new Event('submit', {bubbles:true,cancelable:true}));
  await until(() => state.draft?.pages[0].widgets.length === 1, 'real panel did not save graph draft');
  check(state.draft.pages[0].widgets[0].type === 'fhem-graph'
    && state.draft.pages[0].widgets[0].series[0].device === 'Solar1', 'panel creates graph with chosen series');
  check(live.pages[0].widgets.length === 0, 'panel never mutates live configuration');
  panel.close();
  panelRoot.remove();
  result.dataset.result = 'pass'; result.textContent = JSON.stringify({checks});
} catch (error) {
  result.dataset.result = 'fail'; result.textContent = error.stack;
}
</script>
