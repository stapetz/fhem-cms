<!doctype html>
<html lang="de" data-cms-theme="liquid-glass">
<meta charset="utf-8">
<title>Solar und Energiefluss — Liquid Glass</title>
<link rel="stylesheet" href="../www/fhem-cms/css/fhem-cms.css">
<link rel="stylesheet" href="../www/fhem-cms/css/fcui-gridstack.css">
<style>body{margin:0;padding:16px} #grid{width:100%;max-width:1000px;margin:auto} #result{white-space:pre-wrap}</style>
<div class="cms-shell"><div id="grid" class="grid-stack cms-schema5-grid"></div></div><pre id="result">RUNNING</pre>
<script type="module">
import { GridStack } from '../www/fhem-cms/js/fcui-runtime.js';
import { mountSchema5Widgets } from '../www/fhem-cms/js/fcui-schema5-widgets.js';
import { devicesOf } from '../www/fhem-cms/js/widget-factory.js';
import { blueprintDevices, remapBlueprintDevice } from '../www/fhem-cms/js/fcui-schema5-blueprints.js';
import { setLiquidAppearance } from '../www/fhem-cms/js/fcui-schema5-appearance.js';
const output = document.querySelector('#result');
let checks = 0;
const check = (condition, message) => { if (!condition) throw new Error(message); checks++; };
const pause = (ms = 50) => new Promise(resolve => setTimeout(resolve, ms));
function checkFlowGeometry(host, label) {
  const shadow = host.shadowRoot;
  const boxes = [...shadow.querySelectorAll('.node:not([hidden])')].map(node => node.getBoundingClientRect());
  for (const group of shadow.querySelectorAll('[data-edge]')) {
    if (getComputedStyle(group).display === 'none') continue;
    const path = group.querySelector('.wire');
    const matrix = path.getScreenCTM();
    const length = path.getTotalLength();
    check(length > 0, `${label}: ${group.dataset.edge} has a measured connection`);
    const count = Math.ceil(length / 2) + 1;
    const points = Array.from({ length: count }, (_, index) =>
      path.getPointAtLength(index * length / (count - 1)).matrixTransform(matrix));
    check(points.every(point => boxes.every(box => point.x <= box.left || point.x >= box.right
      || point.y <= box.top || point.y >= box.bottom)),
    `${label}: ${group.dataset.edge} stays outside every station`);
    const keys = group.dataset.edge.split('-');
    check([points[0], points.at(-1)].every((point, index) => {
      const box = shadow.querySelector(`[data-station="${keys[index]}"]`).getBoundingClientRect();
      const distance = Math.hypot(Math.max(box.left - point.x, 0, point.x - box.right),
        Math.max(box.top - point.y, 0, point.y - box.bottom));
      return distance >= 1 && distance <= 3;
    }), `${label}: ${group.dataset.edge} ends at the actual station borders`);
  }
}
const root = document.querySelector('#grid');
const source = (device, reading) => ({ device, reading });
const core = { pv: source('PV', 'power'), home: source('Home', 'load'),
  grid: source('Grid', 'power'), battery: source('Battery', 'power'), soc: source('Battery', 'soc'),
  status: source('PV', 'state'), hour: source('Meter', 'hour'), day: source('Meter', 'day'),
  month: source('Meter', 'month'), year: source('Meter', 'year'), total: source('Meter', 'total') };
const sections = ['Dach', 'Garage', 'Gartenhaus'].map(label => ({ label, readings:
  Object.fromEntries(['total', 'hour', 'day', 'month', 'previousMonth', 'year'].map(key => [key, source('Meter', key)])) }));
const widget = { id: 'energy', type: 'fhem-solar-energy', title: 'Solar und Energiefluss',
  readings: core, sections, grid: { col: 1, row: 2, w: 12, h: 12 } };
const config = { schemaVersion: 5, settings: { layoutMode: 'grid', gridColumns: 12 },
  navigation: { grid: { col: 1, row: 1, w: 12, h: 1 } }, pages: [{ id: 'start', widgets: [widget] }] };
const original = JSON.stringify(config);
const devices = [
  { name: 'PV', readings: { power: '2500', state: 'OK' } },
  { name: 'Home', readings: { load: '1000' } },
  { name: 'Grid', readings: { power: '1000' } },
  { name: 'Battery', readings: { power: '500', soc: '65' } },
  { name: 'Meter', readings: { total: '12456.78', hour: '1.23', day: '12.3', month: '123.4', previousMonth: '456.7', year: '1234.5' } },
];
let saved, writes = 0, fail = false;
const services = { listAllDevices: async () => devices,
  saveWidget: async value => { if (fail) throw new Error('Testfehler'); saved = value; writes++; },
  deleteWidget: async () => { throw new Error('Testfehler Entfernen'); } };
const snapshots = () => new Map(devices.map(device => [device.name, [structuredClone(device)]]));
let mounted;
try {
  mounted = mountSchema5Widgets(GridStack, root, config, 'start', document.createElement('nav'), services, snapshots());
  const host = root.querySelector('cms-solar-energy');
  const $ = selector => host.shadowRoot.querySelector(selector);
  check(Boolean(host), 'factory mounts native Solar und Energiefluss');
  check(devicesOf(widget).length === 5 && blueprintDevices(widget).length === 5, 'all source devices included in subscriptions and blueprints');
  const remapped = remapBlueprintDevice(widget, 'Meter', 'OtherMeter');
  check(remapped.sections[0].readings.day.device === 'OtherMeter' && remapped.readings.day.device === 'OtherMeter',
    'blueprint remapping reaches nested yield and summary sources');
  check($('[data-system]').textContent === 'System: OK', 'real system status displayed');
  check($('[data-sections]').children.length === 3 && $('[data-totals]').children.length === 4,
    'original three yield cards and four totals represented');
  check($('progress').value === 65 && !$('progress').hidden, 'SoC drives real progress element');
  check($('[data-sections]').textContent.includes('Vormonat'), 'previous month retained');
  const svg = $('svg');
  check(!$('[data-edge="pv-home"] .energy').hasAttribute('hidden'), 'PV to home flow active');
  check(getComputedStyle($('[data-edge="pv-home"] .energy')).animationName
    === (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'none' : 'energy-flow'),
  'reduced-motion preference controls actual animation');
  const updated = snapshots();
  updated.get('PV')[0].readings.power = '0';
  updated.get('Grid')[0].readings.power = '-800';
  updated.get('Battery')[0].readings.power = '-200';
  mounted.update(updated, null);
  check(svg === $('svg'), 'live values preserve SVG and running animations');
  check($('[data-edge="home-grid"] .energy').hasAttribute('data-reverse')
    && $('[data-edge="home-grid"] .energy').dataset.source === 'grid', 'grid import reverses actual flow');
  updated.delete('Grid');
  updated.get('Battery')[0].readings.soc = 'broken';
  mounted.update(updated, 'stale');
  check($('[data-power="grid"]').textContent.includes('–') && $('progress').hidden, 'missing values never become zero or a full battery');
  check([...host.shadowRoot.querySelectorAll('.energy')].every(e => e.hasAttribute('hidden')),
    'unknown balance does not invent animated power');
  check($('.tile').hasAttribute('data-stale'), 'stale data visibly marked');
  mounted.update(snapshots(), null);
  for (const theme of ['liquid-glass', 'dark', 'light', 'oled-black', 'catppuccin-mocha']) {
    document.documentElement.dataset.cmsTheme = theme;
    for (const transparency of [12, 88]) {
      setLiquidAppearance(document.documentElement, { liquidIntensity: 47, liquidTransparency: transparency });
      await pause();
      const probe = document.createElement('div');
      probe.style.cssText = 'background:var(--cms-surface);color:inherit';
      host.parentElement.append(probe);
      check(getComputedStyle($('.tile')).backgroundColor === getComputedStyle(probe).backgroundColor,
        `${theme}/${transparency}: exact inherited theme surface`);
      check(getComputedStyle($('[data-title]')).color === getComputedStyle(probe).color,
        `${theme}: inherited title color`);
      probe.remove();
    }
  }
  for (const width of [280, 390, 761, 768, 1000]) {
    root.parentElement.style.width = `${width}px`;
    root.style.width = `${width}px`;
    root.gridstack.onResize();
    await pause(400);
    for (let attempt = 0; attempt < 30 && host.clientWidth < width - 20; attempt++) await pause(100);
    check(host.clientWidth <= width, `${width}: actual widget width follows raster`);
    check(root.scrollWidth <= root.clientWidth + 1 && $('.tile').scrollWidth <= $('.tile').clientWidth + 1,
      `${width}: responsive solar layout without horizontal overflow`);
    checkFlowGeometry(host, width);
    const cards = [...host.shadowRoot.querySelectorAll('.yield')].map(e => e.getBoundingClientRect());
    check(width > 390 || cards[1].top > cards[0].top,
      `${width}: narrow yield cards stack vertically: ${JSON.stringify(cards.map(r => [r.x,r.y,r.width,r.height]))}; host ${host.clientWidth}`);
    if (width === 761) {
      check(cards.every(card => Math.abs(card.top - cards[0].top) < 1),
        'reference desktop width: all three yield cards in one row, not two plus one');
      check(cards.every(card => card.height <= 210), 'yield cards retain compact original height');
      const firstRows = [...host.shadowRoot.querySelectorAll('.yield .row:first-child')].map(e => e.getBoundingClientRect());
      check(firstRows.every(row => Math.abs(row.top - firstRows[0].top) < 1),
        'desktop yield rows align even when the heading total wraps');
      check($('.flow').clientHeight <= 370 && $('.node').getBoundingClientRect().width <= 181,
        'flow remains compact with room for labels and border-to-border connections');
      const lower = ['bat', 'home', 'grid'].map(key => $(`.${key}`).getBoundingClientRect());
      check(lower.every(box => Math.abs(box.top - lower[0].top) < 1
        && Math.abs(box.bottom - lower[0].bottom) < 1), 'desktop station frames align across browsers');
      check($('progress').getBoundingClientRect().height <= 5,
        'native Safari progress appearance cannot inflate the battery station');
      check($('.totals').clientHeight <= 90, 'summary stays in original compact strip');
      check($('[data-sections] h4').textContent.includes('(kWh)')
        && !$('.yield dd').textContent.includes('kWh') && $('.yield dd').textContent === '1.23',
      'units appear in card header, compact numeric precision matches original');
      check(getComputedStyle($('[data-power="pv"]')).color === 'rgb(245, 158, 11)'
        && getComputedStyle($('[data-power="home"]')).color === 'rgb(59, 130, 246)',
      'original semantic station value colors retained');
    }
  }
    check($('[data-sections] h4').textContent.startsWith('🏠 Dach')
      && $('[data-sections]').children[1].querySelector('h4').textContent.startsWith('🚗 Garage')
      && $('[data-sections]').children[2].querySelector('h4').textContent.startsWith('🏡 Gartenhaus'),
    'original section heading emojis restored without changing stored labels');
    for (const width of [280, 390, 768]) {
      root.parentElement.style.width = `${width}px`;
      root.style.width = `${width}px`;
      root.setAttribute('data-mobile-layout', '');
      root.gridstack.onResize();
      await pause(450);
      const tile = $('.tile');
      const wrapper = host.parentElement;
      check(tile.scrollHeight <= tile.clientHeight + 1 && tile.scrollWidth <= tile.clientWidth + 1,
        `${width}: complete mobile widget has no internal scrollbar`);
      check(wrapper.scrollHeight <= wrapper.clientHeight + 1 && wrapper.scrollWidth <= wrapper.clientWidth + 1,
        `${width}: grid content has no hidden overflow or scrollbar`);
      const bottom = $('[data-totals]').getBoundingClientRect().bottom;
      const frame = tile.getBoundingClientRect();
      checkFlowGeometry(host, `mobile ${width}`);
      check(bottom <= frame.bottom && frame.bottom - bottom <= 18,
        `${width}: all totals visible without empty space below`);
      if (width <= 390) {
        const stations = ['bat', 'home', 'grid'].map(key => $(`[data-station="${key}"]`).getBoundingClientRect());
        check(stations[1].left - stations[0].right >= 7.5 && stations[2].left - stations[1].right >= 7.5,
          `${width}: lower station frames have at least 8px of separation`);
        check(stations.every(box => Math.abs(box.top - stations[0].top) < 1
          && Math.abs(box.bottom - stations[0].bottom) < 1),
        `${width}: battery, home and grid share the same top and bottom edges`);
        const powers = ['bat', 'home', 'grid'].map(key => $(`[data-power="${key}"]`).getBoundingClientRect());
        check(powers.every(box => Math.abs(box.top - powers[0].top) < 1),
          `${width}: lower station values align despite differently wrapped labels`);
      }
    }
    root.removeAttribute('data-mobile-layout');
  await host.openConfig();
  check($('[data-dialog]').getBoundingClientRect().width <= innerWidth
    && $('[data-dialog]').scrollWidth <= $('[data-dialog]').clientWidth + 1,
  'complete configuration fits actual desktop, tablet or phone viewport');
  check($('[data-dialog]').open && host.shadowRoot.querySelectorAll('.source').length === 29,
    'configuration contains every reading from original design');
  check(host.shadowRoot.querySelector('[data-source-key="pv"] [data-device]').value === 'PV',
    'per-field device restored');
  await host.saveConfig();
  check(writes === 1 && saved.sections.length === 3 && saved.readings.grid.device === 'Grid',
    'complete cross-device configuration saves');
  check(JSON.stringify(saved.sections) === JSON.stringify(sections), 'yield sources round-trip exactly');
  await host.openConfig();
  const form = $('[data-form]');
  const pvRow = $('[data-sources] [data-source-key="pv"]');
  pvRow.querySelector('[data-reading]').value = '';
  await host.saveConfig();
  check(writes === 1 && $('[data-error]').textContent.includes('PV-Leistung'), 'missing PV rejected explicitly');
  host.setSource(pvRow, 'PV', 'power');
  form.elements.threshold.value = '2.5';
  await host.saveConfig();
  check(writes === 1 && $('[data-error]').textContent.includes('Schwellwert'), 'fractional threshold rejected');
  form.elements.threshold.value = '10';
  fail = true;
  await host.saveConfig();
  check(writes === 1 && $('[data-dialog]').open && $('[data-error]').textContent.includes('Testfehler'),
    'save failure remains visible without closing or clearing draft');
  fail = false;
  host.closeConfig(false);
  await host.openConfig();
  const pickerInput = $('[data-sources] [data-source-key="home"] [data-device]');
  pickerInput.click();
  await pause();
  const picker = host.shadowRoot.querySelector('.cms-dp-dialog') || document.querySelector('.cms-dp-dialog');
  check(picker?.open, 'clicking device field opens normal device picker');
  const target = [...picker.querySelectorAll('[data-list] button')].find(e => e.textContent.includes('Home'));
  check(Boolean(target), 'device picker offers real devices');
  target.click();
  await pause();
  host.closeConfig(false);
  let cancelled = 0;
  host.addEventListener('cms-widget-cancel', () => cancelled++);
  await host.openConfig({ isNew: true });
  check($('[data-delete]').hidden, 'new widget cannot delete existing data');
  host.closeConfig(false);
  check(cancelled === 1 && writes === 1, 'new-widget cancellation writes nothing');
  host.config = { ...widget, readings: { pv: core.pv }, sections: [], showTitle: false };
  check($('[data-title]').hidden && $('[data-station="bat"]').hidden && $('[data-station="grid"]').hidden,
    'optional title, battery and grid can be omitted');
  check($('[data-totals]').hidden, 'unconfigured summaries hidden');
  host.config = widget;
  check(JSON.stringify(config) === original, 'rendering and dialog never mutate saved original');
  const plant = { name: 'Plant', readings: { pv_total_power: '1000', home_power: '600',
    grid_feed_in_power: '100', battery_power: '300', battery_remain_capacity: '60', state: 'OK',
    EnergyRoof: '100', statEnergyRoofDay: '2', statEnergyRoofMonthLast: '20',
    EnergyTotal: '100', statEnergyTotalHour: '1', statEnergyTotalDay: '2' } };
  devices.push(plant);
  host.config = { ...widget, readings: {}, sections: [] };
  await host.openConfig({ isNew: true });
  const field = key => $(`[data-sources] [data-source-key="${key}"]`);
  const selected = key => field(key).querySelector('[data-reading]');
  check(selected('pv').value === 'pv_total_power'
    && field('pv').querySelector('[data-device]').value === 'Plant',
  'normal new-widget dialog detects a unique solar dummy without device-first mode');
  check(selected('home').value === 'home_power' && selected('soc').value === 'battery_remain_capacity',
    'power and battery sources are prefilled before saving');
  check(selected('day').value === 'statEnergyTotalDay' && selected('hour').value === 'statEnergyTotalHour',
    'summary and hourly statistics prefilled');
  check($('[data-section-label]').value === 'Roof'
    && $('[data-section] [data-source-key="previousMonth"] [data-reading]').value === 'statEnergyRoofMonthLast',
  'named yield cards and previous-month statistics proposed automatically');
  check(writes === 1 && Object.keys(host.config.readings).length === 0,
    'suggestions remain unsaved dialog draft');
  selected('home').value = '';
  selected('home').dispatchEvent(new Event('change', { bubbles: true }));
  $('[data-detect]').click();
  check(selected('home').value === '', 'explicitly cleared reading protected against re-detection');
  const manual = selected('pv');
  manual.value = 'home_power';
  manual.dispatchEvent(new Event('change', { bubbles: true }));
  $('[data-detect]').click();
  check(manual.value === 'home_power', 'manual reading preserved');
  host.closeConfig(false);
  await host.openConfig();
  check(selected('pv').value === '' && !$('[data-section-label]'),
    'editing an existing widget does not silently add sources or cards');
  field('pv').querySelector('[data-device]').click();
  await pause();
  const pvPicker = host.shadowRoot.querySelector('.cms-dp-dialog') || document.querySelector('.cms-dp-dialog');
  [...pvPicker.querySelectorAll('[data-list] button')].find(e => e.textContent.includes('Plant')).click();
  await pause();
  check(selected('pv').value === 'pv_total_power' && selected('home').value === 'home_power',
    'choosing a PV device proposes matching readings and remaining sources');
  host.closeConfig(false);
  devices.push({ name: 'SecondPlant', readings: { pv_total_power: '300' } });
  await host.openConfig({ isNew: true });
  check(selected('pv').value === '' && $('[data-detection]').textContent.includes('Mehrere PV-Devices'),
    'ambiguous installations require a device choice instead of an arbitrary default');
  $('[data-shared-device]').click();
  await pause();
  const sharedPicker = host.shadowRoot.querySelector('.cms-dp-dialog') || document.querySelector('.cms-dp-dialog');
  [...sharedPicker.querySelectorAll('[data-list] button')].find(e => e.textContent.includes('Plant') && !e.textContent.includes('SecondPlant')).click();
  await pause();
  check(selected('pv').value === 'pv_total_power' && selected('battery').value === 'battery_power',
    'shared device selection preselects actual matching readings');
  check($('[data-section-label]').value === 'Roof', 'shared device selection also seeds yield cards');
  $('[data-add-section]').click();
  const extraSection = $('[data-section-fields]').lastElementChild;
  extraSection.querySelector('[data-section-label]').value = 'Roof';
  $('[data-detect]').click();
  check(extraSection.querySelector('[data-source-key="day"] [data-reading]').value === 'statEnergyRoofDay',
    'explicit detection completes empty readings in a manually named yield card');
  const extraDay = extraSection.querySelector('[data-source-key="day"] [data-reading]');
  extraDay.value = '';
  extraDay.dispatchEvent(new Event('change', { bubbles: true }));
  $('[data-detect]').click();
  check(extraDay.value === '', 'manually cleared yield source remains empty');
  host.closeConfig(false);
  host.config = widget;
  output.dataset.result = 'pass'; output.textContent = JSON.stringify({ checks });
} catch (error) {
  output.dataset.result = 'fail'; output.textContent = `${error.message}\n${error.stack}`;
} finally {
  document.documentElement.dataset.cmsTheme = 'liquid-glass';
  setLiquidAppearance(document.documentElement, { liquidIntensity: 47, liquidTransparency: 12 });
}
</script>
</html>
