name: Generate FHEM Controls

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate repository-wide controls file
        run: python3 scripts/generate_controls.py

      - name: Commit generated controls file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update FHEM controls file [skip ci]"
          file_pattern: controls_fhem-cms.txt
